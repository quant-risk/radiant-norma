<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160" role="img" aria-label="Radiant Sentinel — sentinela regulatória para Instituições Financeiras brasileiras">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="480" height="160" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="480" height="160" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="480" height="3" fill="url(#accentGrad)"/>

    <g transform="translate(30, 30)">
      <path d="M 50 0 L 95 22 L 95 70 L 50 100 L 5 70 L 5 22 Z"
            fill="none" stroke="url(#accentGrad)" stroke-width="2.5"/>
      <path d="M 50 12 L 82 28 L 82 66 L 50 88 L 18 66 L 18 28 Z"
            fill="url(#accentGrad)" opacity="0.18"/>
      <path d="M 30 52 L 44 66 L 70 38"
            fill="none" stroke="url(#accentGrad)" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="155" y="72" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="2">RADIANT</text>
    <text x="155" y="110" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="300" font-size="34" fill="url(#textGrad)" letter-spacing="8">SENTINEL</text>
    <text x="156" y="132" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="9" fill="#94a3b8" letter-spacing="3.5">SENTINELA REGULATÓRIA · BACEN · CADOCS</text>
  </g>
</svg>