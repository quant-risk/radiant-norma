<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Radiant Sentinel mark">
  <defs>
    <linearGradient id="markBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="markAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="markClip">
      <rect width="120" height="120" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#markClip)">
    <rect width="120" height="120" fill="url(#markBg)"/>
    <rect x="0" y="0" width="120" height="3" fill="url(#markAccent)"/>

    <g transform="translate(10, 10)">
      <path d="M 50 0 L 95 22 L 95 70 L 50 100 L 5 70 L 5 22 Z"
            fill="none" stroke="url(#markAccent)" stroke-width="2.5"/>
      <path d="M 50 12 L 82 28 L 82 66 L 50 88 L 18 66 L 18 28 Z"
            fill="url(#markAccent)" opacity="0.18"/>
      <path d="M 30 52 L 44 66 L 70 38"
            fill="none" stroke="url(#markAccent)" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>