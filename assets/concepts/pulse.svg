<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160" role="img" aria-label="Radiant Sentinel — Pulse Watcher mark">
  <defs>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <radialGradient id="haloP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="textP" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <clipPath id="clipP"><rect width="480" height="160" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#clipP)">
    <rect width="480" height="160" fill="url(#bgP)"/>

    <g opacity="0.05" stroke="#60a5fa" stroke-width="0.5">
      <path d="M 0 40 H 480 M 0 80 H 480 M 0 120 H 480"/>
      <path d="M 60 0 V 160 M 120 0 V 160"/>
    </g>

    <g transform="translate(80, 80)">
      <circle cx="0" cy="0" r="56" fill="none" stroke="url(#ringP)" stroke-width="0.8" opacity="0.18"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="url(#ringP)" stroke-width="1" opacity="0.32"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#ringP)" stroke-width="1.3" opacity="0.55"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="url(#ringP)" stroke-width="1.6" opacity="0.85"/>

      <g stroke="url(#ringP)" stroke-width="1.2" stroke-linecap="round" opacity="0.55">
        <line x1="0" y1="-58" x2="0" y2="-52"/>
        <line x1="0" y1="52" x2="0" y2="58"/>
        <line x1="-58" y1="0" x2="-52" y2="0"/>
        <line x1="52" y1="0" x2="58" y2="0"/>
      </g>

      <g stroke="url(#ringP)" stroke-width="1" stroke-linecap="round" opacity="0.35">
        <line x1="42" y1="-42" x2="38" y2="-38"/>
        <line x1="-42" y1="42" x2="-38" y2="38"/>
      </g>

      <circle cx="0" cy="0" r="22" fill="url(#haloP)" opacity="0.55"/>

      <circle cx="0" cy="0" r="5.5" fill="#ffffff"/>
      <circle cx="0" cy="0" r="2.8" fill="#a78bfa"/>
    </g>

    <text x="180" y="68" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, sans-serif" font-weight="200" font-size="36" fill="#e2e8f0" letter-spacing="10">RADIANT</text>
    <text x="180" y="108" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, sans-serif" font-weight="800" font-size="36" fill="url(#textP)" letter-spacing="6">SENTINEL</text>
    <text x="181" y="132" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, sans-serif" font-weight="500" font-size="9" fill="#64748b" letter-spacing="3.5">VIGILÂNCIA REGULATÓRIA · BACEN · CADOCS</text>
  </g>
</svg>