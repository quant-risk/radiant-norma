<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Radiant Norma mark — Bolha de Nível">
  <defs>
    <linearGradient id="lbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="lcaps" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="lbub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#c4b5fd"/>
      <stop offset="75%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lclip"><rect width="120" height="120" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#lclip)">
    <rect width="120" height="120" fill="url(#lbg)"/>
    <rect x="0" y="0" width="120" height="3" fill="#8b5cf6"/>

    <g transform="translate(10, 38)">
      <rect x="0" y="0" width="100" height="44" rx="22"
            fill="url(#lcaps)"
            stroke="url(#lrim)" stroke-width="1.5"/>

      <rect x="3" y="3" width="94" height="14" rx="14" fill="#a78bfa" opacity="0.12"/>

      <g stroke="#a78bfa" stroke-width="1" opacity="0.55">
        <line x1="22" y1="6"  x2="22" y2="14"/>
        <line x1="22" y1="30" x2="22" y2="38"/>
        <line x1="78" y1="6"  x2="78" y2="14"/>
        <line x1="78" y1="30" x2="78" y2="38"/>
      </g>

      <g stroke="#c4b5fd" stroke-width="1.4" opacity="0.7">
        <line x1="50" y1="2"  x2="50" y2="9"/>
        <line x1="50" y1="35" x2="50" y2="42"/>
      </g>

      <circle cx="50" cy="22" r="16" fill="url(#lbub)"/>

      <circle cx="50" cy="22" r="8" fill="#ffffff"/>
      <circle cx="50" cy="22" r="5" fill="#a78bfa"/>
      <circle cx="47.5" cy="19.5" r="2" fill="#ffffff" opacity="0.9"/>

      <g stroke="#60a5fa" stroke-width="1" opacity="0.55">
        <line x1="6" y1="22" x2="14" y2="22"/>
        <line x1="86" y1="22" x2="94" y2="22"/>
      </g>
    </g>
  </g>
</svg>