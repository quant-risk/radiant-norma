<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160" role="img" aria-label="Radiant Norma — Bolha de Nível">
  <defs>
    <linearGradient id="bgL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="capsule" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="capsuleRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="bubbleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#c4b5fd"/>
      <stop offset="75%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <clipPath id="clipL"><rect width="480" height="160" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#clipL)">
    <rect width="480" height="160" fill="url(#bgL)"/>

    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="130" height="44" rx="22"
            fill="url(#capsule)"
            stroke="url(#capsuleRim)" stroke-width="1.5"/>

      <rect x="3" y="3" width="124" height="14" rx="14" fill="url(#textL)" opacity="0.12"/>

      <g stroke="#a78bfa" stroke-width="1" opacity="0.55">
        <line x1="30" y1="6"  x2="30" y2="14"/>
        <line x1="30" y1="30" x2="30" y2="38"/>
        <line x1="100" y1="6"  x2="100" y2="14"/>
        <line x1="100" y1="30" x2="100" y2="38"/>
      </g>

      <g stroke="#c4b5fd" stroke-width="1.4" opacity="0.7">
        <line x1="65" y1="2"  x2="65" y2="9"/>
        <line x1="65" y1="35" x2="65" y2="42"/>
      </g>

      <circle cx="65" cy="22" r="16" fill="url(#bubbleGlow)"/>

      <circle cx="65" cy="22" r="8" fill="#ffffff"/>
      <circle cx="65" cy="22" r="5" fill="#a78bfa"/>
      <circle cx="62.5" cy="19.5" r="2" fill="#ffffff" opacity="0.9"/>

      <g stroke="#60a5fa" stroke-width="1" opacity="0.55">
        <line x1="6" y1="22" x2="14" y2="22"/>
        <line x1="116" y1="22" x2="124" y2="22"/>
      </g>
    </g>

    <text x="180" y="68" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, sans-serif" font-weight="200" font-size="36" fill="#e2e8f0" letter-spacing="10">RADIANT</text>
    <text x="180" y="108" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, sans-serif" font-weight="800" font-size="36" fill="url(#textL)" letter-spacing="8">NORMA</text>
    <text x="181" y="132" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, sans-serif" font-weight="500" font-size="9" fill="#94a3b8" letter-spacing="3.5">ALINHADO COM A NORMA · BACEN · CADOCS</text>
  </g>
</svg>