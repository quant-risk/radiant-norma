[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radiant-norma"
version = "1.0.0"
description = "Cliente Python oficial para a Radiant Norma API"
readme = "README.md"
license = {text = "Proprietary"}
authors = [
    {name = "Radiant Financial Technology", email = "dev@radiantnorma.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Proprietary",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest", "pytest-httpx", "ruff"]

[project.urls]
Homepage = "https://radiantnorma.com"
Repository = "https://github.com/fortvna/radiant-norma"

[tool.setuptools.packages.find]
where = ["src"]
