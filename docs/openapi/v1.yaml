# Radiant Norma — OpenAPI 3.1 Specification
# https://github.com/quant-risk/radiant-norma
#
# Auto-generated from handler signatures (Sprint 77).
# regenerate with: oapi-codegen -generate types -package api v1.yaml
#
openapi: 3.1.0
info:
  title: Radiant Norma API
  description: |
    API REST para geração, validação e submissão de CADOCs BACEN.

    **Autenticação:** header `X-IF-ID` (fallback) ou JWT Bearer token no
    `Authorization` header. O token JWT contém `if_id`, `cnpj`, `role`.

    **Formato:** todos os endpoints aceitam e retornam `application/json`
    salvo onde indicado.

    **Códigos de erro:** `error` + `message` no body. Códigos HTTP:
    - 400 Bad Request — payload inválido ou mal formatado
    - 401 Unauthorized — autenticação requerida
    - 403 Forbidden — sem permissão para este IF/endpoint
    - 404 Not Found — recurso não encontrado
    - 422 Unprocessable Entity — validação semântica falhou
    - 429 Too Many Requests — rate limit excedido
    - 500 Internal Server Error — erro interno (detalhes não expostos)
    - 503 Service Unavailable — dependência externa indisponível

    **Rate limiting:** cada IF tem buckets independentes. Atualizar
    via `/v1/l4/compare` retorna headers `X-RateLimit-*`.
  version: "3.36.2"
  contact:
    name: Radiant Risk
    url: https://radiantrisk.com
    email: api@radiantrisk.com
  license:
    name: Proprietary

servers:
  - url: https://api.radiantrisk.com/v1
    description: Produção
  - url: https://staging-api.radiantrisk.com/v1
    description: Staging

security:
  - BearerAuth: []
  - IFIDHeader: []

tags:
  - name: Health
    description: Health checks e readiness.
  - name: Schema
    description: Schema Registry — versões e metadados de leiautes CADOC.
  - name: Rules
    description: Catálogo de regras de validação.
  - name: Validation
    description: Validação L1→L4 de documentos CADOC.
  - name: Generation
    description: Geração de documentos CADOC a partir do Canonical Model.
  - name: CrossDoc
    description: Validação cross-document (L3) — consistência entre CADOCs.
  - name: STA
    description: Integração com o sistema STA do BACEN.
  - name: Radar
    description: Radar Regulatório — detecção de mudanças de leiaute.
  - name: Audit
    description: Histórico de envios e auditoria.
  - name: Insights
    description: KPIs, heatmaps e recomendações orientadas por ML.
  - name: Webhooks
    description: Webhooks outbound — eventos de validação, schema, radar e submissão.

paths:

  # =====================================================================
  # Health
  # =====================================================================

  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      tags: [Health]
      security: []
      responses:
        "200":
          description: Servidor está vivo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  version: { type: string, example: "3.36.2" }

  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe — verifica DB e dependências.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Pronto para receber tráfego.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ready" }
                  db: { type: string, example: "ok" }
        "503":
          description: Dependência indisponível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # =====================================================================
  # Schema Registry
  # =====================================================================

  /schemas:
    get:
      operationId: listSchemas
      summary: Lista códigos CADOC disponíveis.
      tags: [Schema]
      responses:
        "200":
          description: Lista de CADOCs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cadocs:
                    type: array
                    items: { type: string }
                    example: ["2030","2060","2061","2062","2070","2160","2170","3040","3044","3050","4111"]
                  total: { type: integer }
        "500":
          $ref: "#/components/responses/InternalError"

  /schemas/{cadoc}:
    get:
      operationId: getSchema
      summary: Retorna leiaute atualmente efetivo para um CADOC.
      tags: [Schema]
      parameters:
        - $ref: "#/components/parameters/Cadoc"
      responses:
        "200":
          description: Schema efetivo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaVersion"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /schemas/{cadoc}/versions:
    get:
      operationId: listVersions
      summary: Lista todas as versões de layout disponíveis para um CADOC.
      tags: [Schema]
      parameters:
        - $ref: "#/components/parameters/Cadoc"
      responses:
        "200":
          description: Lista de versões.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cadoc: { type: string }
                  versions:
                    type: array
                    items: { type: string }
                    example: ["3.0","3.1","3.2"]
                  total: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /schemas/{cadoc}/changelog:
    get:
      operationId: listSchemaChangelog
      summary: Lista histórico de alterações de leiaute (por data-base).
      tags: [Schema]
      parameters:
        - $ref: "#/components/parameters/Cadoc"
      responses:
        "200":
          description: Changelog de versões.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cadoc: { type: string }
                  changelog:
                    type: array
                    items:
                      $ref: "#/components/schemas/SchemaChangelogEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /schema:
    get:
      operationId: listSchemasV2
      summary: Lista CADOCs com metadados expandidos (versão, complexidade, campos).
      description: |
        Semelhante a GET /schemas mas inclui info de geração:
        versões suportadas, complexidade estimada, data de vigência,
        contagem de campos. Ideal para o wizard de geração.
        Cacheado por 5 minutos no servidor.
      tags: [Schema]
      responses:
        "200":
          description: Lista de schemas com metadados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaListResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # =====================================================================
  # Rules
  # =====================================================================

  /rules:
    get:
      operationId: listRules
      summary: Lista todos os códigos CADOC que possuem regras de validação.
      tags: [Rules]
      responses:
        "200":
          description: Códigos com regras disponíveis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cadocs:
                    type: array
                    items: { type: string }
                  total: { type: integer }
        "500":
          $ref: "#/components/responses/InternalError"

  /rules/{cadoc}:
    get:
      operationId: listRulesByCadoc
      summary: Lista todas as regras de validação para um CADOC específico.
      tags: [Rules]
      parameters:
        - $ref: "#/components/parameters/Cadoc"
      responses:
        "200":
          description: Lista de regras.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /rules/disabled:
    get:
      operationId: listDisabledRules
      summary: Lista regras desabilitadas para o IF autenticado.
      tags: [Rules]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Regras desabilitadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  if_id: { type: string }
                  disabled_codes:
                    type: array
                    items: { type: string }
                  total: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /rules/{code}/toggle:
    post:
      operationId: toggleRule
      summary: Habilita ou desabilita uma regra para o IF autenticado.
      description: Toggle idempotente — envia o mesmo código mais de uma vez alterna o estado.
      tags: [Rules]
      security:
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Z][0-9]{1,3}$" }
      responses:
        "200":
          description: Novo estado da regra.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  if_id: { type: string }
                  disabled: { type: boolean }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # =====================================================================
  # Validation
  # =====================================================================

  /validate:
    post:
      operationId: validate
      summary: Valida um documento CADOC (L1 XSD → L2 Semântico → L3 Cross-doc).
      description: |
        Executa validação em 3 camadas:

        **L1 (XSD):** bem-formedness + conformidade estrutural.
        **L2 (Semântico):** regras de negócio específicas do CADOC
        (ex: 275 regras para 3040, organizadas em B/F/C/S/I/H).
        **L3 (Cross-doc):** consistência entre múltiplos CADOCs do mesmo
        período (ex: 4111.X → 3040).

        O campo `xml` pode conter XML ou JSON (para 3044).
      tags: [Validation]
      security:
        - BearerAuth: []
        - IFIDHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
            example:
              cadoc_code: "3040"
              data_base: "2026-06-30"
              xml: "<SCRDocumento>...</SCRDocumento>"
              content_type: "application/xml"
      responses:
        "200":
          description: Resultado da validação.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validação semântica falhou (documento bem formado mas regras violadas).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # =====================================================================
  # Generation
  # =====================================================================

  /generate/{cadoc}:
    post:
      operationId: generateCadoc
      summary: Gera um documento CADOC a partir do Canonical Model.
      description: |
        Recebe um `CanonicalDocument` com `Participantes` e `Operacoes`
        e produz o XML final. Suporta os CADOCs: 2030, 2060, 2061, 2062,
        2070, 2160, 2170, 3040, 3050, 4111.

        O campo `source` indica a fonte de dados: `manual`, `api`, `file`,
        `db`, `mcp`. O wizard de geração (/console/generate) determina a
        source antes de enviar a requisição.

        O `versao_layout` é opcional — se omitido, usa a versão efetiva
        mais recente para a `data_base`.

        A resposta inclui `xml` (documento gerado), `xml_hash` (SHA-256
        do XML) e `explain` (campo a campo do que foi gerado).
      tags: [Generation]
      security:
        - BearerAuth: []
        - IFIDHeader: []
      parameters:
        - $ref: "#/components/parameters/Cadoc"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
            example:
              cadoc_code: "3040"
              if_id: "if_demo"
              cnpj: "12.345.678/0001-90"
              nome_if: "Banco Demo S.A."
              versao_layout: "3.0"
              data_base: "2026-06-30"
              participantes:
                - id: "P001"
                  tipo: "PF"
                  nome: "João Silva"
                  cpf: "123.456.789-00"
                  Rating: "AA"
              operacoes:
                - id: "O001"
                  tipo: "CRÉDITO_PESSOAL"
                  valor: 50000.00
                  prazo: 24
                  taxa: 18.5
      responses:
        "200":
          description: Documento gerado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Geração falhou — canonical incompleto ou inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /generate/{cadoc}/fields:
    get:
      operationId: listGenerateFields
      summary: Retorna os campos necessários para gerar um CADOC específico.
      description: |
        Usado pelo wizard de geração para saber quais campos o Canonical Model
        precisa. Inclui: nome do campo, tipo, se é obrigatório, description
        e пример (exemplo de valor).
      tags: [Generation]
      parameters:
        - $ref: "#/components/parameters/Cadoc"
      responses:
        "200":
          description: Lista de campos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /generate/{cadoc}/sources:
    post:
      operationId: ingestSources
      summary: Configura a fonte de dados para um CADOC.
      description: |
        Registra qual connector será usado (manual/api/file/db/mcp) e
        retorna os fields que precisam ser preenchidos/mapeados.
        É o passo intermediário do wizard — antes de gerar, o frontend
        confirma a fonte e faz o mapping de campos.
      tags: [Generation]
      security:
        - BearerAuth: []
        - IFIDHeader: []
      parameters:
        - $ref: "#/components/parameters/Cadoc"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_type]
              properties:
                source_type:
                  $ref: "#/components/schemas/SourceType"
                source_name:
                  type: string
                  description: "Nome/identificador da fonte (ex: api-customer, file-contas-a-pagar)"
                mapping:
                  type: object
                  description: "Mapeamento opcional: campo -> source_field"
                  additionalProperties: { type: string }
      responses:
        "200":
          description: Configuração aceita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceConfigResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /generate/adapters:
    get:
      operationId: listSourceAdapters
      summary: Lista os adapters de fonte de dados disponíveis.
      description: Retorna todos os conectores registrados (manual/api/file/db/mcp).
      tags: [Generation]
      responses:
        "200":
          description: Lista de adapters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  adapters:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdapterInfo"
        "500":
          $ref: "#/components/responses/InternalError"

  /generate/file/parse:
    post:
      operationId: parseUploadedFile
      summary: Faz upload e parse de um arquivo para extrair CanonicalDocument.
      description: |
        Aceita CSV, XLSX, PDF ou JSON e tenta extrair participantes e
        operações no formato Canonical Model. Retorna o documento
        extraído para validação antes da geração.
      tags: [Generation]
      security:
        - BearerAuth: []
        - IFIDHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                cadoc_code:
                  type: string
                data_base:
                  type: string
                  format: date
      responses:
        "200":
          description: Documento extraído.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileParseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          description: Formato de arquivo não suportado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /generate/batch:
    post:
      operationId: generateBatch
      summary: Gera múltiplos CADOCs em uma única requisição.
      description: |
        Útil para fechamento mensal onde múltiplos CADOCs precisam ser
        gerados juntos. Executa em paralelo e retorna o resultado de cada
        um. Opcionalmente executa validação cross-doc após a geração.
      tags: [Generation]
      security:
        - BearerAuth: []
        - IFIDHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchGenerateRequest"
      responses:
        "200":
          description: Resultados do batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGenerateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /generate/history:
    get:
      operationId: listGenerateHistory
      summary: Retorna histórico de gerações do IF autenticado.
      description: |
        Lista envios anteriores com status. Status: pending, validated,
        sent, accepted, rejected, error, processing, dead_letter.
        `passed=true` para: validated, sent, accepted.
      tags: [Generation]
      security:
        - BearerAuth: []
        - IFIDHeader: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: cadoc
          in: query
          schema: { type: string }
          description: Filtro opcional por tipo CADOC.
      responses:
        "200":
          description: Histórico paginado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationHistoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Banco de dados não configurado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # =====================================================================
  # Cross-Document Validation
  # =====================================================================

  /crossdoc/validate:
    post:
      operationId: crossdocValidate
      summary: Executa validação cross-document (L3) — consistência entre CADOCs.
      description: |
        Valida consistência entre documentos relacionados (ex: 4111.XDRR01IPOC
        ↔ 3040, 4111.XDRR01SCR ↔ SCR). Regras cross-doc definidas no
        Schema Registry e executadas após validação individual.
      tags: [CrossDoc]
      security:
        - BearerAuth: []
        - IFIDHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documents]
              properties:
                documents:
                  type: array
                  items:
                    $ref: "#/components/schemas/CrossDocInput"
      responses:
        "200":
          description: Resultado da validação cross-doc.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossDocValidateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /crossdoc/rules:
    get:
      operationId: listCrossDocRules
      summary: Lista todas as regras cross-doc disponíveis.
      tags: [CrossDoc]
      responses:
        "200":
          description: Catálogo de regras cross-doc.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossDocRulesResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # =====================================================================
  # STA — Integração BACEN
  # =====================================================================

  /sta/submit:
    post:
      operationId: staSubmit
      summary: Submete um documento ao STA do BACEN.
      description: |
        Submete o XML gerado ao Sistema de Transferência de Arquivos do BACEN.
        No modo stub (default em dev), apenas armazena localmente.
        Em produção, usa STA-h (HTTPS) ou STA-ws (WebSocket).
      tags: [STA]
      security:
        - BearerAuth: []
        - IFIDHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaSubmitRequest"
      responses:
        "200":
          description: Submissão aceita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: STA BACEN retornou erro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: STA indisponível.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sta/disponiveis:
    get:
      operationId: staDisponiveis
      summary: Lista documentos disponíveis para download no STA.
      tags: [STA]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Lista de documentos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaDisponiveisResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /sta/situacao:
    post:
      operationId: staSituacao
      summary: Consulta a situação (status de aceitação/rejeição) de um documento.
      tags: [STA]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [protocolo]
              properties:
                protocolo:
                  type: string
                  description: Número de protocolo do STA.
      responses:
        "200":
          description: Situação do documento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaSituacaoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # =====================================================================
  # Radar Regulatório
  # =====================================================================

  /radar/alerts:
    get:
      operationId: listRadarAlerts
      summary: Lista alertas de mudança de leiaute detectados pelo Radar.
      tags: [Radar]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved, dismissed] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Lista de alertas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarAlertsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /radar/alerts/{id}:
