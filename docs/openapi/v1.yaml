        "500":
          $ref: "#/components/responses/InternalError"

# =====================================================================
# Components
# =====================================================================

components:

  parameters:
    Cadoc:
      name: cadoc
      in: path
      required: true
      description: "Código CADOC (4 dígitos, ex: 3040, 4111)."
      schema: { type: string, pattern: "^[0-9]{4}$" }

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token emitido pelo endpoint de autenticação.
        Claims esperados: `if_id`, `cnpj`, `role`.
    IFIDHeader:
      type: apiKey
      in: header
      name: X-IF-ID
      description: |
        Fallback de autenticação para ambientes onde JWT não está
        disponível (ex: integrações simples). Preferir Bearer JWT.

  schemas:

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Código de erro machine-readable.
          example: "INVALID_CADOC"
        message:
          type: string
          description: Mensagem legível para debugging (não exponha em prod).
          example: "invalid cadoc_code \"30400\" (expected 4 digits)"

    # ---- Validation ----

    ValidateRequest:
      type: object
      required: [cadoc_code, xml]
      properties:
        cadoc_code:
          type: string
          pattern: "^[0-9]{4}$"
          description: Aceita também "cadoc" como alias.
          example: "3040"
        data_base:
          type: string
          format: date
          description: "YYYY-MM-DD. Opcional se inferível do XML."
          example: "2026-06-30"
        xml:
          type: string
          description: Documento XML (ou JSON para 3044).
          example: "<SCRDocumento>...</SCRDocumento>"
        content_type:
          type: string
          default: "application/xml"
          enum: [application/xml, application/json]
          description: "application/xml para CADOCs normais, application/json para 3044."

    ValidateResponse:
      type: object
      properties:
        cadoc_code:
          type: string
          example: "3040"
        data_base:
          type: string
          example: "2026-06-30"
        xml_hash:
          type: string
          description: SHA-256 do XML recebido.
          example: "a3f2c1..."
        passed:
          type: boolean
          description: "true se zero erros."
        errors:
          type: array
          items: { $ref: "#/components/schemas/ValidationError" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ValidationError" }
        executed_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          description: Tempo de execução em milissegundos.
        disabled_rules:
          type: array
          items: { type: string }
          description: Regras puladas porque desabilitadas pelo IF.

    ValidationError:
      type: object
      properties:
        code:
          type: string
          description: 'Codigo da regra (ex: B12, F23)'
          example: "B12"
        severity:
          type: string
          enum: [error, warning, info]
          example: "error"
        field:
          type: string
          description: Campo XPath ou JSON path onde o erro ocorre.
          example: "/SCRDocumento/Modalidade[1]/Valor"
        message:
          type: string
          description: Mensagem descritiva.
          example: "Valor debe ser maior que zero"
        position:
          type: string
          description: Posição no documento (XPath ou linha).
          example: "line 42, col 15"

    # ---- Schema ----

    SchemaVersion:
      type: object
      properties:
        cadoc:
          type: string
        version:
          type: string
          example: "3.0"
        effective_from:
          type: string
          format: date
        source_uri:
          type: string
          description: URI do XSD fonte (BACEN ou interno).

    SchemaChangelogEntry:
      type: object
      properties:
        version:
          type: string
        effective_from:
          type: string
          format: date
        changes:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              change_type:
                type: string
                enum: [added, removed, modified]
              description:
                type: string

    SchemaListResponse:
      type: object
      properties:
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/SchemaInfo"
        total:
          type: integer

    SchemaInfo:
      type: object
      properties:
        cadoc_code:
          type: string
          example: "3040"
        latest_version:
          type: string
          example: "3.2"
        effective_from:
          type: string
          description: Data de vigência do layout mais recente.
          example: "2026-01-01"
        source_uri:
          type: string
        supported_versions:
          type: array
          items: { type: string }
          example: ["3.0","3.1","3.2"]
        field_count:
          type: integer
          description: Número de campos no leiaute.
        complexity:
          $ref: "#/components/schemas/ComplexityScore"

    ComplexityScore:
      type: object
      properties:
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: "0.0 (trivial) a 1.0 (muito complexo)."
          example: 0.72
        num_operacoes:
          type: integer
          description: Número estimado de operações no documento.
          example: 1540
        num_participantes:
          type: integer
          description: Número de participantes.
          example: 230
        estimated_api_calls:
          type: integer
          description: Chamadas de API necessárias para conectar dados.
          example: 3
        estimated_time_ms:
          type: integer
          description: Tempo estimado de geração em ms.
          example: 450

    # ---- Rules ----

    RuleListResponse:
      type: object
      properties:
        cadoc:
          type: string
        rules:
          type: array
          items: { $ref: "#/components/schemas/Rule" }
        total:
          type: integer

    Rule:
      type: object
      properties:
        code:
          type: string
          example: "B12"
        description:
          type: string
          example: "Valor da operação deve ser maior que zero"
        severity:
          type: string
          enum: [error, warning, info]
        category:
          type: string
          description: "Categoria: B (Balanço), F (Financeiro), C (Cliente), S (Sistema), I (Inadimplência), H (Historicamente inadimplente)."
          example: "B"
        required_docs:
          type: array
          items: { type: string }
          description: Documentos complementares exigidos por esta regra.

    # ---- Generation ----

    GenerateRequest:
      type: object
      required: [cadoc_code, if_id]
      properties:
        cadoc_code:
          type: string
          example: "3040"
        if_id:
          type: string
          example: "if_demo"
        cnpj:
          type: string
          example: "12.345.678/0001-90"
        nome_if:
          type: string
          example: "Banco Demo S.A."
        versao_layout:
          type: string
          description: Opcional — default é a versão efetiva mais recente.
          example: "3.0"
        data_base:
          type: string
          format: date-time
          description: "AAAA-MM-DDTHH:MM:SSZ"
          example: "2026-06-30T00:00:00Z"
        extra:
          type: object
          additionalProperties: true
          description: Campos extras específicos do CADOC.
        participantes:
          type: array
          items: { $ref: "#/components/schemas/Participante" }
        operacoes:
          type: array
          items: { $ref: "#/components/schemas/Operacao" }
        source:
          type: string
          enum: [manual, api, file, db, mcp]
          description: Fonte dos dados.
          example: "manual"

    Participante:
      type: object
      properties:
        id:
          type: string
        tipo:
          type: string
          enum: [PF, PJ]
          description: "Pessoa Física ou Jurídica."
        nome:
          type: string
        cpf:
          type: string
        cnpj:
          type: string
        rating:
          type: string
          description: 'Classificacao de risco (ex: AA, BB, CCC)'
        # ...outros campos dependem do CADOC

    Operacao:
      type: object
      properties:
        id:
          type: string
        tipo:
          type: string
          description: Tipo de operação (depende do CADOC).
        valor:
          type: number
          format: double
        prazo:
          type: integer
        taxa:
          type: number
          format: double
        # ...outros campos dependem do CADOC

    GenerateResponse:
      type: object
      properties:
        cadoc_code:
          type: string
        data_base:
          type: string
          format: date-time
        generated:
          type: object
          description: Documento gerado.
          properties:
            xml:
              type: string
              description: XML final do CADOC.
            xml_hash:
              type: string
              description: SHA-256 do XML.
            explain:
              type: object
              additionalProperties: true
              description: Explain campo-a-campo do que foi gerado.
        status:
          type: string
          enum: [generated, error]
        message:
          type: string
          description: Mensagem descritiva (erro ou info).

    FieldsResponse:
      type: object
      properties:
        cadoc_code:
          type: string
        fields:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string }
              required: { type: boolean }
              example: {}
        versions:
          type: array
          items: { type: string }
        complexity:
          $ref: "#/components/schemas/ComplexityScore"

    SourceType:
      type: string
      enum: [manual, api, file, db, mcp]
      description: |
        - **manual**: preenchimento direto no console
        - **api**: conector REST/GraphQL
        - **file**: upload CSV/XLSX/PDF
        - **db**: conector JDBC/Postgres
        - **mcp**: Model Context Protocol (agente IA)

    SourceConfigResponse:
      type: object
      properties:
        cadoc_code: { type: string }
        source_type: { $ref: "#/components/schemas/SourceType" }
        source_name: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/FieldDescriptor" }
        status: { type: string }
        message: { type: string }

    FieldDescriptor:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        type: { type: string }
        required: { type: boolean }
        example: { type: string }

    AdapterInfo:
      type: object
      properties:
        type: { $ref: "#/components/schemas/SourceType" }
        name: { type: string }

    L4Comparison:
      type: object
      properties:
        current:
          $ref: "#/components/schemas/L4SubmissionSnapshot"
        previous:
          $ref: "#/components/schemas/L4SubmissionSnapshot"
        new_failures:
          type: array
          items: { $ref: "#/components/schemas/L4FailedRule" }
        fixed_rules:
          type: array
          items: { $ref: "#/components/schemas/L4FailedRule" }
        changed_fields:
          type: array
          items: { $ref: "#/components/schemas/L4FieldChange" }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/L4Alert" }

    L4SubmissionSnapshot:
      type: object
      properties:
        id: { type: string }
        cadoc_code: { type: string }
        data_base: { type: string }
        xml_hash: { type: string }
        submitted_at: { type: string, format: date-time }
        passed: { type: boolean }

    L4FailedRule:
      type: object
      properties:
        code: { type: string }
        severity: { type: string }
        message: { type: string }

    L4FieldChange:
      type: object
      properties:
        cadoc_code: { type: string }
        field: { type: string }
        previous: { type: number, format: double }
        current: { type: number, format: double }
        delta_pct: { type: number, format: double }

    L4Alert:
      type: object
      properties:
        type: { type: string }
        code: { type: string }
        severity: { type: string }
        message: { type: string }

    FileParseResponse:
      type: object
      properties:
        cadoc_code: { type: string }
        data_base: { type: string }
        document:
          $ref: "#/components/schemas/CanonicalDocument"
        status: { type: string }
        message: { type: string }

    CanonicalDocument:
      type: object
      description: Modelo canônico independente de CADOC.
      properties:
        cadoc_code: { type: string }
        data_base: { type: string }
        participantes: { type: array, items: { $ref: "#/components/schemas/Participante" } }
        operacoes: { type: array, items: { $ref: "#/components/schemas/Operacao" } }
        extra: { type: object, additionalProperties: true }

    BatchGenerateRequest:
      type: object
      required: [cadocs]
      properties:
        cadocs:
          type: array
          items: { $ref: "#/components/schemas/GenerateRequest" }
          minItems: 1
          maxItems: 50
        run_crossdoc:
          type: boolean
          default: false
          description: Executa validação cross-doc após geração.

    BatchGenerateResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/BatchResult" }
        crossdoc_errors:
          type: array
          items: { $ref: "#/components/schemas/CrossDocError" }
        crossdoc_warnings:
          type: array
          items: { $ref: "#/components/schemas/CrossDocError" }
        passed:
          type: boolean
        message:
          type: string

    BatchResult:
      type: object
      properties:
        cadoc_code: { type: string }
        status: { type: string }
        xml_hash: { type: string }
        message: { type: string }

    GenerationHistoryResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GenerationHistoryItem" }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    GenerationHistoryItem:
      type: object
      properties:
        id: { type: string }
        cadoc_code: { type: string }
        data_base: { type: string }
        generated_at: { type: string, format: date-time }
        sha256: { type: string }
        status:
          type: string
          enum: [pending, validated, sent, accepted, rejected, error, processing, dead_letter]
        passed: { type: boolean }

    # ---- Cross-Doc ----

    CrossDocInput:
      type: object
      required: [cadoc_code, xml]
      properties:
        cadoc_code: { type: string }
        xml: { type: string }
        data_base: { type: string }

    CrossDocError:
      type: object
      properties:
        code: { type: string }
        severity: { type: string, enum: [error, warning] }
        message: { type: string }
        involved_docs:
          type: array
          items: { type: string }
          description: Códigos dos documentos envolvidos na inconsistência.

    CrossDocValidateResponse:
      type: object
      properties:
        passed:
          type: boolean
        errors:
          type: array
          items: { $ref: "#/components/schemas/CrossDocError" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/CrossDocError" }
        rules_executed:
          type: integer
        duration_ms: { type: integer }

    CrossDocRulesResponse:
      type: object
      properties:
        rules:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              severity: { type: string }
              required_docs: { type: array, items: { type: string } }
        total: { type: integer }

    # ---- STA ----

    StaSubmitRequest:
      type: object
      required: [cadoc_code, xml]
      properties:
        cadoc_code: { type: string }
        data_base: { type: string }
        xml: { type: string }
        xml_hash: { type: string }
        protocolo_sta:
          type: string
          description: "Opcional: protocolo de Retorno STA (para re-submissão)."

    StaSubmitResponse:
      type: object
      properties:
        protocolo:
          type: string
          description: Número de protocolo STA.
          example: "STA-2026-694123"
        status:
          type: string
          enum: [submitted, accepted, pending]
        submitted_at:
          type: string
          format: date-time

    StaDisponiveisResponse:
      type: object
      properties:
        documentos:
          type: array
          items:
            type: object
            properties:
              protocolo: { type: string }
              cadoc_code: { type: string }
              data_base: { type: string }
              received_at: { type: string, format: date-time }
              size_bytes: { type: integer }
        total: { type: integer }

    StaSituacaoResponse:
      type: object
      properties:
        protocolo: { type: string }
        status:
          type: string
          enum: [pending, accepted, rejected, error]
        details:
          type: string
        updated_at:
          type: string
          format: date-time

    # ---- Radar ----

    RadarAlertsResponse:
      type: object
      properties:
        alerts:
          type: array
          items: { $ref: "#/components/schemas/RadarAlert" }
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }

    RadarAlert:
      type: object
      properties:
        id: { type: string }
        cadoc: { type: string }
        version_before: { type: string }
        version_after: { type: string }
        change_type:
          type: string
          enum: [major, minor, xsd_change, rule_change]
        source: { type: string }
        status:
          type: string
          enum: [open, resolved, dismissed]
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }

    # ---- Audit ----

    EnviosResponse:
      type: object
      properties:
        envios:
          type: array
          items: { $ref: "#/components/schemas/Envio" }
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }

    Envio:
      type: object
      properties:
        id: { type: string }
        if_id: { type: string }
        cadoc_code: { type: string }
        data_base: { type: string }
        xml_hash: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
        submitted_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time }

    EnviosStats:
      type: object
      properties:
        total:
          type: integer
        by_status:
          type: object
          additionalProperties: { type: integer }
          example: { pending: 2, accepted: 45, rejected: 3 }
        by_cadoc:
          type: object
          additionalProperties: { type: integer }
        acceptance_rate:
          type: number
          format: float

    AuditLogResponse:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }

    AuditLogEntry:
      type: object
      properties:
        seq: { type: integer }
        timestamp: { type: string, format: date-time }
        if_id: { type: string }
        action: { type: string }
        resource: { type: string }
        prev_hash: { type: string }
        hash: { type: string }
        metadata: { type: object }

    # ---- Insights ----

    KPIResponse:
      type: object
      properties:
        period:
          type: string
          example: "30d"
        total_validations:
          type: integer
        error_rate:
          type: number
          format: float
        top_cadoc:
          type: string
        avg_duration_ms:
          type: number
          format: float
        trend:
          type: string
          enum: [improving, stable, degrading]

    HeatmapResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: array
            description: Matriz [hora][dia] com counts de erros.
        day_labels:
          type: array
          items: { type: string }
          example: ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"]
        hour_labels:
          type: array
          items: { type: integer }

    TopFailingRulesResponse:
      type: object
      properties:
        period: { type: string }
        rules:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              cadoc: { type: string }
              fail_count: { type: integer }
              fail_rate: { type: number, format: float }
              avg_field_value: {}
        total: { type: integer }

    RecommendationsResponse:
      type: object
      properties:
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
        total: { type: integer }

    Recommendation:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        cadoc: { type: string }
        rule_codes: { type: array, items: { type: string } }
        status: { type: string, enum: [pending, acknowledged] }
        created_at: { type: string, format: date-time }

    # ---- Webhooks ----

    Webhook:
      type: object
      properties:
        id: { type: string }
        if_id: { type: string }
        url: { type: string }
        events:
          type: array
          items: { type: string }
          description: "Eventos aceitos: validation.completed, schema.changed, radar.change_detected, submission.accepted, submission.rejected"
        active: { type: boolean }
        created_at: { type: string, format: date-time }

    RegisterWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          description: URL HTTPS do endpoint receptor.
          example: "https://example.com/webhooks/radiant"
        secret:
          type: string
          description: Opcional. Secret usado para HMAC-SHA256. Se omitido, assinaturas não são geradas.
          example: "whsec_abc123xyz"
        events:
          type: array
          items: { type: string }
          minItems: 1
          description: Lista de eventos para assinar.
          example: ["validation.completed", "schema.changed"]

    Delivery:
      type: object
      properties:
        id: { type: string }
        webhook_id: { type: string }
        if_id: { type: string }
        event: { type: string }
        status: { type: string, enum: [pending, success, failed] }
        attempt_count: { type: integer }
        last_attempt: { type: string, format: date-time, nullable: true }
        next_retry: { type: string, format: date-time, nullable: true }
        response_code: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    # ---- Webhook event payloads ----

    EventValidationCompleted:
      type: object
      properties:
        event: { type: string, example: "validation.completed" }
        timestamp: { type: string, format: date-time }
        if_id: { type: string }
        cadoc_code: { type: string }
        data_base: { type: string }
        status: { type: string }
        rule_codes: { type: array, items: { type: string } }
        error_count: { type: integer }

    EventSchemaChanged:
      type: object
      properties:
        event: { type: string, example: "schema.changed" }
        timestamp: { type: string, format: date-time }
        if_id: { type: string }
        cadoc: { type: string }
        effective_from: { type: string }
        changelog: { type: string }

    EventRadarChangeDetected:
      type: object
      properties:
        event: { type: string, example: "radar.change_detected" }
        timestamp: { type: string, format: date-time }
        if_id: { type: string }
        cadoc: { type: string }
        scan_id: { type: string }
        changes:
          type: array
          items:
            type: object
            properties:
              tag: { type: string }
              attr: { type: string }
              kind: { type: string }
              old_value: { type: string }
              new_value: { type: string }

    EventSubmissionAccepted:
      type: object
      properties:
        event: { type: string, example: "submission.accepted" }
        timestamp: { type: string, format: date-time }
        if_id: { type: string }
        cadoc_code: { type: string }
        data_base: { type: string }
        xml_hash: { type: string }

    EventSubmissionRejected:
      type: object
      properties:
        event: { type: string, example: "submission.rejected" }
        timestamp: { type: string, format: date-time }
        if_id: { type: string }
        cadoc_code: { type: string }
        data_base: { type: string }
        xml_hash: { type: string }
        reason: { type: string }

  responses:
    BadRequest:
      description: Requisição mal formada ou campos inválidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Autenticação requerida ou token inválido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Erro interno do servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
