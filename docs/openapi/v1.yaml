      operationId: getRadarAlert
      summary: Detalhes de um alerta específico.
      tags: [Radar]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Alerta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarAlert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /radar/alerts/{id}/resolve:
    post:
      operationId: resolveRadarAlert
      summary: Marca um alerta como resolvido (lido + ação tomada).
      tags: [Radar]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
