      summary: Dispara um scan under-demand do Radar Regulatório.
      description: |
        No modo automático, o Radar roda em background a cada 6h.
        Este endpoint permite forçar um scan imediato (ex: após
        receber notificação do BACEN).
      tags: [Radar]
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
