io – InvestAgro)</strong> do <strong class=\"text-bcb-dark\">Manual de Crédito Rural (MCR)</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória primária é a necessidade de oferecer suporte financeiro emergencial às cooperativas de produção agropecuária do <strong class=\"text-bcb-dark\">estado do Rio Grande do Sul</strong> que foram severamente impactadas por enchentes, alagamentos e outras calamidades ocorridas entre <strong class=\"text-bcb-dark\">26 de abril e 31 de julho de 2024</strong>. O <strong class=\"text-bcb-dark\">CMN</strong> busca com esta medida facilitar a reestruturação financeira e de gestão dessas entidades, crucial para a recuperação econômica da região e para a manutenção da produção da agricultura familiar e do agronegócio, visando mitigar os prejuízos e assegurar a capacidade de pagamento no médio prazo.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5321\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução CMN N° 5.321 de 30/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN Nº 5.321</strong> entrou em vigor na data de sua publicação. As principais datas e prazos a serem observados pelas instituições financeiras e cooperativas são:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Entrada em Vigor:</strong> A norma é imediatamente aplicável a partir da data de sua publicação.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Período de Elegibilidade da Calamidade:</strong> As cooperativas beneficiárias devem ter sido afetadas por eventos climáticos (enchentes, etc.) ocorridos entre <strong class=\"text-bcb-dark\">26 de abril e 31 de julho de 2024</strong> no <strong class=\"text-bcb-dark\">Rio Grande do Sul</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Prazo Limite para Contratação:</strong> O financiamento de capital de giro ao amparo desta norma é admitido <strong class=\"text-bcb-dark\">até 30 de dezembro de 2026</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Dificuldade de Pagamento:</strong> As cooperativas devem demonstrar dificuldade de pagamento em <strong class=\"text-bcb-dark\">2025 e 2026</strong> de parte do valor de suas dívidas de curto prazo.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Prazos de Reembolso:</strong> As operações de crédito rural concedidas sob esta resolução podem ter reembolso de até <strong class=\"text-bcb-dark\">5 anos</strong>, incluídos até <strong class=\"text-bcb-dark\">24 meses</strong> de carência. As instituições devem estar prontas para operacionalizar essas linhas e receber as solicitações de financiamento dentro do período estabelecido, garantindo a conformidade com todos os requisitos.</li>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A norma gerará um impacto operacional significativo para as instituições financeiras que operam com crédito rural, especialmente aquelas com forte atuação no <strong class=\"text-bcb-dark\">Rio Grande do Sul</strong>. Os principais pontos de trabalho e custo, e processos a serem revisados, incluem:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Adaptação de Processos de Crédito:</strong> Necessidade de desenvolver ou adaptar fluxos para a originação e análise de crédito, incorporando os critérios de elegibilidade específicos para as cooperativas afetadas e as condições diferenciadas das linhas <strong class=\"text-bcb-dark\">Pronaf Agroindústria</strong> e <strong class=\"text-bcb-dark\">Procap-Agro</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Análise de Projetos de Reestruturação:</strong> Demandará capacidade de análise e validação dos projetos de reestruturação financeira e de gestão das cooperativas, que devem ser aprovados pelo <strong class=\"text-bcb-dark\">Sescoop/RS</strong> e por <strong class=\"text-bcb-dark\">50%</strong> das instituições financeiras credoras. Isso pode exigir a criação de equipes dedicadas ou o treinamento intensivo das existentes.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Gestão de Concessão e Monitoramento:</strong> Os sistemas de concessão e monitoramento de crédito precisarão ser ajustados para gerenciar os limites de crédito por cooperativa e por associado, os prazos de reembolso e carência, e os encargos financeiros específicos (<strong class=\"text-bcb-dark\">8,0% a.a.</strong> e <strong class=\"text-bcb-dark\">10,0% a.a.</strong>), além de monitorar a utilização dos recursos equalizados.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Treinamento de Equipes:</strong> Equipes de *front-office* (gerentes de relacionamento) e *back-office* (operações, *compliance*) precisarão ser intensivamente treinadas sobre as novas regras, documentação necessária e interações com o <strong class=\"text-bcb-dark\">Sescoop/RS</strong> e outras instituições credoras.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Custos de Tecnologia e Compliance:</strong> Embora não haja alteração direta de layouts de <strong class=\"text-bcb-dark\">CADOCs</strong>, a implementação das novas linhas de crédito implicará em custos de adaptação de sistemas, auditoria de *compliance* e eventuais ajustes em relatórios internos e externos para o <strong class=\"text-bcb-dark\">BCB</strong>.</li>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN Nº 5.321</strong> não especifica alterações diretas em layouts de documentos regulatórios como <strong class=\"text-bcb-dark\">CADOCs</strong>, tabelas de domínios, dicionários de dados, <strong class=\"text-bcb-dark\">tags XML</strong> ou protocolos de transmissão. No entanto, sua implementação exige que as instituições financeiras que atuam com crédito rural, especialmente as que operam com <strong class=\"text-bcb-dark\">Pronaf</strong> e <strong class=\"text-bcb-dark\">Procap-Agro</strong>, adaptem seus sistemas e processos internos.</p><p class=\"mb-4 text-justify\">As principais implicações técnicas incluem:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Configuração de Sistemas:</strong> Necessidade de parametrizar as novas linhas de crédito de capital de giro, incluindo limites específicos (<strong class=\"text-bcb-dark\">R$90.000.000,00</strong> por cooperativa e <strong class=\"text-bcb-dark\">R$90.000,00</strong> por associado), prazos de reembolso (até <strong class=\"text-bcb-dark\">5 anos</strong>, com até <strong class=\"text-bcb-dark\">24 meses</strong> de carência) e encargos financeiros (<strong class=\"text-bcb-dark\">8,0% a.a.</strong> para Pronaf e <strong class=\"text-bcb-dark\">10,0% a.a.</strong> para Procap-Agro).</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Validação de Beneficiários:</strong> Adequação dos sistemas para verificar a localização das unidades industriais/armazenamento no <strong class=\"text-bcb-dark\">Rio Grande do Sul</strong>, comprovação de situação de emergência/calamidade, e dificuldades de pagamento em <strong class=\"text-bcb-dark\">2025 e 2026</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Gestão de Documentação:</strong> Implementação de mecanismos para registrar e acompanhar os projetos de reestruturação financeira validados pelo <strong class=\"text-bcb-dark\">Sescoop/RS</strong> e a aprovação por <strong class=\"text-bcb-dark\">50%</strong> dos credores.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Reportes Internos e Regulatórios:</strong> Embora não haja menção explícita a novos <strong class=\"text-bcb-dark\">CADOCs</strong>, a inclusão dessas operações especiais pode exigir ajustes nos sistemas de *reporting* para garantir a correta classificação, acompanhamento e envio de informações ao <strong class=\"text-bcb-dark\">BCB</strong> sobre essas linhas de crédito equalizadas, conforme as diretrizes do <strong class=\"text-bcb-dark\">MCR</strong> e eventuais orientações futuras. Não há URLs de alterações de layout específicas nesta norma.</li>\n      </div>","title":"BC - Resolução CMN N° 5.321 de 30/06/2026","type":"Resolução","summary":"A Resolução CMN Nº 5.321, de 30 de junho de 2026, introduz medidas emergenciais. Ela estabelece novas linhas de crédito de capital de giro para cooperativas agropecuárias do Rio Grande do Sul impactadas pelas calamidades de 2024, sob o guarda-chuva do Pronaf Agroindústria e Procap-Agro. O objetivo é facilitar a reestruturação financeira e a continuidade das operações até 30 de dezembro de 2026. Instituições financeiras devem se atentar aos novos requisitos de elegibilidade e prazos.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5321","isFeatured":false,"tags":[],"date":"2026-06-30","number":"CMN N° 5.321","updated_at":"2026-06-30T23:04:20.517Z","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52954.pdf","thumb_v":"v4"}],"homeStats":null,"recentDestaques":null,"recentDias":null,"recentMeses":null,"pixPosts":null,"spsavPosts":null,"riscosPosts":null,"openFinancePosts":null,"pixSummary":null,"spsavSummary":null,"slidesFilters":null,"path":"/todas","blogVersion":"v9"}</script>
