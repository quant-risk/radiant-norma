<script id="SERVER_STATE" type="application/json">{"postData":null,"destaqueData":null,"diaData":null,"mesData":null,"anoData":null,"postsMap":null,"homePosts":[{"id":"normativos_52965","slug":"instrucao-normativa-bcb-756","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 756</strong>, publicada em <strong class=\"text-bcb-dark\">02 de julho de 2026</strong>, tem como principal objetivo retificar o cronograma para a remessa de informações ao <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong> referentes à prestação de <strong class=\"text-bcb-dark\">serviços de ativos virtuais</strong> no mercado de câmbio. Esta norma altera especificamente o <strong class=\"text-bcb-dark\">Art. 2º</strong> da <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 693, de 19 de dezembro de 2025</strong>, que originalmente estabelecia o início da remessa para a <strong class=\"text-bcb-dark\">data-base de maio de 2026</strong>.</p><p class=\"mb-4 text-justify\">A necessidade desta correção surge em decorrência da <strong class=\"text-bcb-dark\">Resolução BCB nº 574, de 18 de junho de 2026</strong>, que promoveu alterações na redação da <strong class=\"text-bcb-dark\">Resolução BCB nº 277, de 31 de dezembro de 2022</strong>. A modificação normativa de hierarquia superior postergou a data para o início das operações a serem reportadas, passando a valer para as transações realizadas a partir de <strong class=\"text-bcb-dark\">3 de novembro de 2026</strong>. Assim, a <strong class=\"text-bcb-dark\">IN BCB nº 756/2026</strong> assegura o alinhamento e a consistência do arcabouço regulatório.</p><p class=\"mb-4 text-justify\">Com a promulgação desta <strong class=\"text-bcb-dark\">Instrução Normativa</strong>, todas as instituições financeiras e demais entidades autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong> que operam com <strong class=\"text-bcb-dark\">ativos virtuais</strong> devem se adequar ao novo prazo. A remessa das informações ao <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong> para os dados de <strong class=\"text-bcb-dark\">serviços de ativos virtuais</strong> no mercado de câmbio deverá ocorrer a partir da <strong class=\"text-bcb-dark\">data-base de novembro de 2026</strong>, garantindo que as operações sejam reportadas em estrita conformidade com a legislação vigente.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">BAIXO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto sistêmico é <strong class=\"text-bcb-dark\">BAIXO</strong> pois a <strong class=\"text-bcb-dark\">Instrução Normativa</strong> não introduz novas obrigações ou complexidades de reporte, mas sim um adiamento do prazo de remessa de informações já estabelecidas. Isso concede mais tempo para as instituições se adequarem, minimizando riscos de descumprimento e sobrecarga na implementação.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Instrução Normativa BCB N° 756, de 02 de julho de 2026</strong></p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Esta <strong class=\"text-bcb-dark\">Instrução Normativa</strong> altera o <strong class=\"text-bcb-dark\">Art. 2º</strong> da <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 693, de 19 de dezembro de 2025</strong>. A motivação para esta alteração deriva da <strong class=\"text-bcb-dark\">Resolução BCB nº 574, de 18 de junho de 2026</strong>, que por sua vez alterou a <strong class=\"text-bcb-dark\">Resolução BCB nº 277, de 31 de dezembro de 2022</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória primária é harmonizar o <strong class=\"text-bcb-dark\">cronograma de remessa</strong> de informações sobre a prestação de <strong class=\"text-bcb-dark\">serviços de ativos virtuais</strong> no mercado de câmbio. A <strong class=\"text-bcb-dark\">Resolução BCB nº 574/2026</strong> alterou o prazo de início das operações a serem reportadas, mudando-o para <strong class=\"text-bcb-dark\">3 de novembro de 2026</strong>, conforme a <strong class=\"text-bcb-dark\">Resolução BCB nº 277/2022</strong>. Esta <strong class=\"text-bcb-dark\">IN BCB nº 756</strong> assegura que a <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 693/2025</strong> esteja alinhada com essa nova diretriz, proporcionando segurança jurídica e tempo adequado para a adaptação das instituições do ecossistema financeiro nacional.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=756\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Instrução Normativa BCB N° 756 de 02/07/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">O <strong class=\"text-bcb-dark\">cronograma de adequação</strong> e os prazos importantes são os seguintes:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Prazo Anterior (Revogado)</strong>: A remessa de informações sobre <strong class=\"text-bcb-dark\">serviços de ativos virtuais</strong> era prevista a partir da <strong class=\"text-bcb-dark\">data-base de maio de 2026</strong>, conforme a redação original da <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 693/2025</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Novo Prazo para Operações</strong>: As informações sobre a prestação de <strong class=\"text-bcb-dark\">serviços de ativos virtuais</strong> no mercado de câmbio devem ser enviadas ao <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong> para operações realizadas a partir de <strong class=\"text-bcb-dark\">3 de novembro de 2026</strong>, conforme alterado pela <strong class=\"text-bcb-dark\">Resolução BCB nº 574/2026</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Novo Prazo para Remessa</strong>: As informações de que trata o <strong class=\"text-bcb-dark\">Art. 1º, caput, incisos I a IV</strong> da <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 693/2025</strong> devem ser remetidas ao <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong> a partir da <strong class=\"text-bcb-dark\">data-base de novembro de 2026</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Vigência da Norma</strong>: A <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 756</strong> entrou em vigor na data de sua publicação, em <strong class=\"text-bcb-dark\">02 de julho de 2026</strong>.</li>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">Esta <strong class=\"text-bcb-dark\">Instrução Normativa</strong> gera um impacto operacional mitigado, pois prorroga o <strong class=\"text-bcb-dark\">prazo de remessa</strong>, concedendo às instituições financeiras e demais entidades autorizadas pelo <strong class=\"text-bcb-dark\">BCB</strong> mais tempo para ajustar seus processos. O principal trabalho e custo agora estarão relacionados à revisão e validação dos sistemas e fluxos de dados para coleta e transmissão de informações de <strong class=\"text-bcb-dark\">serviços de ativos virtuais</strong>, garantindo que estejam prontos para a nova <strong class=\"text-bcb-dark\">data-base de novembro de 2026</strong>. Os processos de <strong class=\"text-bcb-dark\">compliance</strong>, TI e as equipes operacionais devem aproveitar esse tempo adicional para realizar testes mais aprofundados, aprimorar a qualidade dos dados e garantir a conformidade integral para o novo prazo de reporte.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">Esta <strong class=\"text-bcb-dark\">Instrução Normativa</strong> não detalha alterações diretas em <strong class=\"text-bcb-dark\">layouts</strong> de arquivos, dicionários de dados, <strong class=\"text-bcb-dark\">tags XML</strong> ou protocolos de transmissão, nem especifica novos <strong class=\"text-bcb-dark\">CADOCs</strong>. Seu foco é exclusivamente na alteração da data de início da remessa de informações relativas à prestação de <strong class=\"text-bcb-dark\">serviços de ativos virtuais</strong> no mercado de câmbio, conforme estabelecido anteriormente pela <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 693, de 19 de dezembro de 2025</strong>. As instituições devem garantir que seus sistemas estejam configurados para iniciar o envio dos dados, utilizando os <strong class=\"text-bcb-dark\">layouts</strong> e especificações técnicas já definidos pela <strong class=\"text-bcb-dark\">IN BCB nº 693/2025</strong>, a partir da nova <strong class=\"text-bcb-dark\">data-base</strong> indicada.</p>\n      </div>","title":"BC - Instrução Normativa BCB N° 756 de 02/07/2026","type":"Instrução Normativa","summary":"Esta Instrução Normativa BCB N° 756, de 02/07/2026, ajusta o prazo para a remessa de informações relativas à prestação de serviços de ativos virtuais no mercado de câmbio. Ela adia o início da obrigatoriedade de envio, que agora passa a ser a partir da data-base de novembro de 2026. É essencial que todas as instituições autorizadas pelo BCB revisem seus cronogramas de implementação para estarem em conformidade com o novo prazo, que é formalizado em alinhamento com a Resolução BCB nº 574/2026.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=756","isFeatured":true,"tags":["SPSAV"],"date":"2026-07-02","number":"BCB N° 756","updated_at":"2026-07-02T19:01:58.213Z","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52965.pdf","thumb_v":"v4"},{"id":"normativos_52964","slug":"instrucao-normativa-bcb-755","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Instrução Normativa BCB N° 755, de 1º de julho de 2026</strong>, representa uma atualização crucial nas diretrizes de reporte para o <strong class=\"text-bcb-dark\">Demonstrativo de Risco de Liquidez (DRL)</strong>, modelo I, modificando a <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 399, de 29 de junho de 2023</strong>. Esta norma visa aprimorar a supervisão do <strong class=\"text-bcb-dark\">risco de liquidez</strong> no Sistema Financeiro Nacional, expandindo e detalhando as responsabilidades de envio de informações. As alterações impactam diretamente a forma como as instituições financeiras e demais entidades autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong> reportam suas posições de liquidez.</p><p class=\"mb-4 text-justify\">Um dos pontos centrais da <strong class=\"text-bcb-dark\">IN BCB nº 755/2026</strong> é a extensão da obrigatoriedade do <strong class=\"text-bcb-dark\">DRL</strong> a <strong class=\"text-bcb-dark\">TODOS</strong> os conglomerados prudenciais, abrangendo os segmentos <strong class=\"text-bcb-dark\">S1, S2, S3 e S4</strong>, em linha com as classificações da <strong class=\"text-bcb-dark\">Resolução CMN nº 4.553/2017</strong> e <strong class=\"text-bcb-dark\">Resolução BCB nº 436/2024</strong>. Além disso, a norma introduz e detalha a exigência de reporte em base <strong class=\"text-bcb-dark\">subconsolidada</strong> para as instituições enquadradas no segmento <strong class=\"text-bcb-dark\">S1</strong>, especificamente no âmbito do subconglomerado prudencial, conforme definido pelo <strong class=\"text-bcb-dark\">Art. 13-A da Resolução CMN nº 4.950/2021</strong>. Essa medida busca uma visão mais granular e precisa da liquidez em diferentes estruturas organizacionais.</p><p class=\"mb-4 text-justify\">A norma também oficializa a disponibilidade de novas versões das Instruções de Preenchimento e do Leiaute para o <strong class=\"text-bcb-dark\">CADOC 2160 – Demonstrativo de Risco de Liquidez – DRL</strong>, modelo I, válidas a partir da <strong class=\"text-bcb-dark\">data-base de julho de 2026</strong>. Instituições líderes de conglomerados prudenciais e cooperativas, conforme suas estruturas específicas, terão responsabilidades claras sobre a elaboração e o envio dessas informações, seja em base consolidada, subconsolidada ou individual. É fundamental que as equipes técnicas e de gestão estejam atentas às especificações para garantir a conformidade.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é <strong class=\"text-bcb-dark\">MÉDIO</strong> pois, embora se trate de uma atualização de um reporte já existente (<strong class=\"text-bcb-dark\">DRL</strong>), a extensão da obrigatoriedade a todos os conglomerados prudenciais (<strong class=\"text-bcb-dark\">S1, S2, S3, S4</strong>) e a introdução da base <strong class=\"text-bcb-dark\">subconsolidada</strong> para o segmento <strong class=\"text-bcb-dark\">S1</strong> exigirão adaptações significativas nos sistemas e processos de coleta e consolidação de dados. Para as instituições <strong class=\"text-bcb-dark\">S1</strong> que não faziam o reporte subconsolidado, há um novo desafio de implementação.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Instrução Normativa BCB N° 755, de 1º de julho de 2026</strong></p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Altera a <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 399, de 29 de junho de 2023</strong>. É fundamentada nas <strong class=\"text-bcb-dark\">Resoluções BCB ns. 207, de 22 de março de 2022</strong>, <strong class=\"text-bcb-dark\">436, de 28 de novembro de 2024</strong>, e <strong class=\"text-bcb-dark\">577, de 23 de junho de 2026</strong>, bem como nas <strong class=\"text-bcb-dark\">Resoluções CMN nº 4.553, de 30 de janeiro de 2017</strong>, e <strong class=\"text-bcb-dark\">4.950, de 2021</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória reside na necessidade de aprimorar o monitoramento do <strong class=\"text-bcb-dark\">risco de liquidez</strong> no Sistema Financeiro Nacional. Ao expandir o escopo do reporte do <strong class=\"text-bcb-dark\">DRL</strong> para todos os segmentos de conglomerados prudenciais (<strong class=\"text-bcb-dark\">S1, S2, S3, S4</strong>) e introduzir a base <strong class=\"text-bcb-dark\">subconsolidada</strong> para o <strong class=\"text-bcb-dark\">S1</strong>, o <strong class=\"text-bcb-dark\">BCB</strong> busca obter uma visão mais precisa e completa da exposição de liquidez das instituições, alinhando-se às estruturas de supervisão prudencial mais recentes. Isso fortalece a estabilidade financeira e a capacidade regulatória de identificar e mitigar riscos sistêmicos, especialmente diante de um cenário macroeconômico que exige maior rigor na gestão de liquidez.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=755\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Instrução Normativa BCB N° 755 de 01/07/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Instrução Normativa BCB N° 755</strong> entra em vigor na data de sua publicação: <strong class=\"text-bcb-dark\">1º de julho de 2026</strong>. As novas versões das Instruções de Preenchimento e do Leiaute do <strong class=\"text-bcb-dark\">CADOC 2160 – DRL</strong>, modelo I, são válidas a partir da <strong class=\"text-bcb-dark\">data-base de julho de 2026</strong>, o que significa que o primeiro reporte com as novas regras já deve considerar essa data. É crucial que as instituições iniciem a adaptação de seus sistemas imediatamente. Para o envio das informações elaboradas em base <strong class=\"text-bcb-dark\">subconsolidada</strong> para o subconglomerado prudencial (<strong class=\"text-bcb-dark\">S1</strong>), é admitido o caráter de homologação, permitindo que as instituições substituam esses envios sem penalidade até <strong class=\"text-bcb-dark\">31 de dezembro de 2026</strong>. Esse prazo final de <strong class=\"text-bcb-dark\">31 de dezembro de 2026</strong> concede uma janela para ajustes e validações operacionais antes que o reporte subconsolidado se torne integralmente mandatório e passível de penalidades.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A implementação da <strong class=\"text-bcb-dark\">IN BCB N° 755/2026</strong> gerará trabalho e custo significativos para as instituições. Operacionalmente, será necessário revisar e adaptar os processos de coleta, tratamento, agregação e consolidação de dados para o <strong class=\"text-bcb-dark\">DRL</strong>. A principal mudança é a necessidade de desenvolver ou ajustar sistemas para gerar o reporte em base <strong class=\"text-bcb-dark\">subconsolidada</strong> para as instituições enquadradas no segmento <strong class=\"text-bcb-dark\">S1</strong>, além de garantir a consolidação para <strong class=\"text-bcb-dark\">S1, S2, S3 e S4</strong>. Isso implica em revisão dos fluxos de trabalho, redefinição de responsabilidades e treinamento das equipes de <strong class=\"text-bcb-dark\">riscos</strong>, <strong class=\"text-bcb-dark\">contabilidade</strong>, <strong class=\"text-bcb-dark\">compliance</strong> e <strong class=\"text-bcb-dark\">TI</strong>.</p><p class=\"mb-4 text-justify\">Os processos de validação interna deverão ser reforçados para garantir a consistência das informações em todas as bases de reporte. A inclusão do subitem <strong class=\"text-bcb-dark\">5.1</strong> e a orientação sobre o <strong class=\"text-bcb-dark\">Domínio 81</strong> no leiaute do <strong class=\"text-bcb-dark\">CADOC 2160</strong> exigirão ajustes específicos nos sistemas e na documentação interna de preenchimento. A fase de homologação até <strong class=\"text-bcb-dark\">31 de dezembro de 2026</strong> para o reporte subconsolidado, embora ofereça flexibilidade, exige recursos dedicados para testes e ajustes, representando um custo adicional de desenvolvimento e validação. Em suma, a norma demandará investimentos em tecnologia, processos e capacitação de pessoal para assegurar a conformidade e a precisão das informações reportadas ao <strong class=\"text-bcb-dark\">BCB</strong>.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">As alterações técnicas se concentram no <strong class=\"text-bcb-dark\">CADOC 2160 – Demonstrativo de Risco de Liquidez – DRL</strong>, modelo I. Novas versões das <strong class=\"text-bcb-dark\">Instruções de Preenchimento</strong> e do <strong class=\"text-bcb-dark\">Leiaute</strong> estão disponíveis na página do <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong> em <strong class=\"text-bcb-dark\">https://www.bcb.gov.br/estabilidadefinanceira/leiautedocumentoscrd</strong>. As modificações incluem:</p><p class=\"mb-4 text-justify\">1.  <strong class=\"text-bcb-dark\">Instruções de Preenchimento</strong>: Inclusão do subitem <strong class=\"text-bcb-dark\">5.1</strong> na seção “Estoque De Ativos Líquidos, Saídas e Entradas de Caixa” para detalhamento de novos campos ou critérios.</p><p class=\"mb-4 text-justify\">2.  <strong class=\"text-bcb-dark\">Leiaute</strong>: No “Anexo 4 - Código do elemento”, houve a inclusão de orientação específica quanto ao <strong class=\"text-bcb-dark\">Domínio 81</strong>. Isso implica na necessidade de atualização dos dicionários de dados e da lógica de validação dos sistemas que geram o <strong class=\"text-bcb-dark\">CADOC 2160</strong>. Além disso, a exigência de reporte em base <strong class=\"text-bcb-dark\">subconsolidada</strong> para instituições <strong class=\"text-bcb-dark\">S1</strong> demandará novas chaves de agregação e identificação de entidades dentro dos arquivos, impactando diretamente as tags <strong class=\"text-bcb-dark\">XML</strong> e/ou a estrutura dos arquivos de texto para transmissão, exigindo adaptação dos sistemas de geração e validação de dados.</p>\n      </div>","title":"BC - Instrução Normativa BCB N° 755 de 01/07/2026","type":"Instrução Normativa","summary":"A Instrução Normativa BCB N° 755, de 1º de julho de 2026, ajusta as regras de reporte do Demonstrativo de Risco de Liquidez (DRL), modelo I, alterando a IN BCB nº 399/2023. Fique atento às novas obrigações para todos os conglomerados prudenciais (S1, S2, S3, S4), especialmente a introdução da base subconsolidada para o segmento S1. O foco é aprimorar a visibilidade do BCB sobre o risco de liquidez.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=755","tags":["Riscos"],"date":"2026-07-01","number":"BCB N° 755","updated_at":"2026-07-01T23:03:10.054Z","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52964.pdf","thumb_v":"v4","isFeatured":true},{"id":"normativos_52963","slug":"resolucao-bcb-582","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB Nº 582, de 01/07/2026</strong>, detalha os mecanismos de gestão, sustentabilidade e custeio do <strong class=\"text-bcb-dark\">Programa de Assistência à Saúde dos Servidores do Banco Central (PASBC)</strong>. Este programa, de modelo associativo fechado e caráter social sem fins lucrativos, visa oferecer assistência à saúde aos servidores ativos e inativos do <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong>, bem como a seus dependentes e pensionistas, mediante adesão voluntária. A norma formaliza a responsabilidade do <strong class=\"text-bcb-dark\">BCB</strong> pela manutenção do programa, incluindo disponibilização de estruturas físicas, tecnológicas e de pessoal, e estabelece a base legal a partir do art. 15 da <strong class=\"text-bcb-dark\">Lei nº 9.650, de 27 de maio de 1998</strong>.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">BAIXO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto sistêmico desta norma é <strong class=\"text-bcb-dark\">BAIXO</strong> para o sistema financeiro nacional como um todo, pois se trata de uma regulamentação <strong class=\"text-bcb-dark\">interna</strong> do <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong> referente ao seu programa de saúde para servidores. Não há implicações diretas para a atuação, regulação ou conformidade de outras <strong class=\"text-bcb-dark\">instituições financeiras</strong> ou <strong class=\"text-bcb-dark\">entidades autorizadas</strong> a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong>.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução BCB Nº 582, de 01/07/2026</strong></p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Esta resolução não altera ou revoga normas diretamente aplicáveis ao mercado financeiro externo ao <strong class=\"text-bcb-dark\">BCB</strong>. Ela se baseia e regulamenta o disposto no art. 15 da <strong class=\"text-bcb-dark\">Lei nº 9.650, de 27 de maio de 1998</strong>, que trata do plano de carreira dos servidores do <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong>, especialmente quanto à assistência à saúde.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória reside na necessidade de formalizar, atualizar e garantir a <strong class=\"text-bcb-dark\">sustentabilidade econômico-financeira</strong> do <strong class=\"text-bcb-dark\">PASBC</strong>, o programa de assistência à saúde dos servidores do <strong class=\"text-bcb-dark\">BCB</strong>. Esta normatização visa proporcionar clareza e solidez na gestão e custeio do programa, assegurando o cumprimento das disposições legais pertinentes e otimizando a governança interna para um benefício essencial aos seus colaboradores.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=582\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução BCB N° 582 de 01/07/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">Esta Resolução entra em vigor na data de sua publicação, que é <strong class=\"text-bcb-dark\">01/07/2026</strong>. Para o <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong>, isso implica a aplicação imediata das regras de gestão, custeio e governança do <strong class=\"text-bcb-dark\">PASBC</strong>. Não há prazos ou datas de adequação para as demais <strong class=\"text-bcb-dark\">instituições financeiras</strong> ou <strong class=\"text-bcb-dark\">entidades reguladas</strong>, uma vez que a norma não se aplica diretamente a elas.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">Para as <strong class=\"text-bcb-dark\">instituições financeiras</strong> e outras <strong class=\"text-bcb-dark\">entidades autorizadas</strong> a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong>, a <strong class=\"text-bcb-dark\">Resolução BCB Nº 582/2026</strong> <strong class=\"text-bcb-dark\">não gera nenhum trabalho ou custo direto</strong>, nem exige revisão de processos operacionais, uma vez que se trata de uma norma interna do <strong class=\"text-bcb-dark\">BCB</strong>. Internamente ao <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong>, contudo, a norma gera trabalho significativo, demandando a revisão de processos de gestão financeira (contabilidade separada, aplicações), governança (atuação do Depes, Comitê Gestor, Conselho Fiscal) e operacionais (promoção de saúde, avaliação de sustentabilidade), além da estimativa orçamentária para as contribuições do <strong class=\"text-bcb-dark\">BCB</strong> ao <strong class=\"text-bcb-dark\">PASBC</strong>.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB Nº 582, de 01/07/2026</strong>, por ser uma norma de caráter <strong class=\"text-bcb-dark\">interno</strong> ao <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong> e referente à gestão de seu programa de assistência à saúde para servidores, <strong class=\"text-bcb-dark\">NÃO</strong> introduz quaisquer alterações em documentos regulatórios externos como <strong class=\"text-bcb-dark\">CADOCs</strong>, layouts de sistemas, tabelas de domínios, dicionários de dados, tags <strong class=\"text-bcb-dark\">XML</strong> ou protocolos de transmissão para as <strong class=\"text-bcb-dark\">instituições financeiras</strong> e demais <strong class=\"text-bcb-dark\">entidades autorizadas</strong> a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong>. Não há, portanto, impacto técnico de desenvolvimento ou sustentação de sistemas para essas instituições.</p>\n      </div>","title":"BC - Resolução BCB N° 582 de 01/07/2026","type":"Resolução","summary":"A Resolução BCB Nº 582, de 01/07/2026, estabelece a estrutura de gestão, custeio e sustentabilidade do Programa de Assistência à Saúde dos Servidores do Banco Central – PASBC. É crucial entender que esta norma é predominantemente interna ao BCB, regulando um benefício de autogestão para seus colaboradores. Portanto, seu impacto direto sobre as instituições financeiras e demais entidades autorizadas a funcionar pelo BCB é praticamente nulo, focando na organização e financiamento do plano de saúde de seus próprios servidores.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=582","tags":[],"date":"2026-07-01","number":"BCB N° 582","updated_at":"2026-07-01T23:03:10.054Z","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52963.pdf","thumb_v":"v4","isFeatured":false},{"id":"normativos_52962","slug":"resolucao-bcb-581","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB Nº 581, de 1º de julho de 2026</strong>, representa uma atualização crucial no <strong class=\"text-bcb-dark\">Regulamento do Programa de Assistência à Saúde dos Servidores do Banco Central – PASBC</strong>, anexo à <strong class=\"text-bcb-dark\">Resolução BCB nº 415, de 24 de setembro de 2024</strong>. Seu principal objetivo é fortalecer a governança, a sustentabilidade econômico-financeira e a transparência da gestão do programa, introduzindo um novo capítulo dedicado a diretrizes rigorosas para a constituição de reserva de contingência e um acompanhamento financeiro detalhado.</p><p class=\"mb-4 text-justify\">Entre as inovações, destaca-se a criação da <strong class=\"text-bcb-dark\">Reserva de Contingência (RC)</strong>, um mecanismo vital para cobrir eventuais insuficiências entre as contribuições e as despesas assistenciais do <strong class=\"text-bcb-dark\">PASBC</strong>. Sua metodologia de cálculo envolve o <strong class=\"text-bcb-dark\">Fator de Insuficiência de Contraprestações (FIC)</strong>, que considera os últimos <strong class=\"text-bcb-dark\">24 meses</strong> de despesas e contribuições. A norma estabelece, ainda, as regras para a destinação de resultados positivos do balanço anual e a cobertura de resultados negativos, priorizando a estabilidade patrimonial do programa.</p><p class=\"mb-4 text-justify\">Complementarmente, a resolução introduz o <strong class=\"text-bcb-dark\">Patrimônio Líquido de Referência (PLR)</strong> e o <strong class=\"text-bcb-dark\">Índice de Suficiência Calculado (IScalc)</strong>, ferramentas prudenciais que asseguram a estabilidade do <strong class=\"text-bcb-dark\">PASBC</strong> frente a riscos estruturais e operacionais. O <strong class=\"text-bcb-dark\">PLR</strong> é calculado com base no <strong class=\"text-bcb-dark\">Capital Mínimo baseado em Riscos (CMR)</strong>, alinhado conceitualmente a modelos da <strong class=\"text-bcb-dark\">Agência Nacional de Saúde Suplementar (ANS)</strong>, adaptados à realidade do <strong class=\"text-bcb-dark\">BCB</strong>. São definidas responsabilidades trimestrais para o monitoramento desses indicadores por departamentos como <strong class=\"text-bcb-dark\">Deafi</strong> e <strong class=\"text-bcb-dark\">Depes</strong>, além de gatilhos para atenção prudencial e a necessidade de avaliação e proposição de medidas em caso de insuficiência patrimonial.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">BAIXO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">A <strong class=\"text-bcb-dark\">Resolução BCB Nº 581</strong> impacta exclusivamente a gestão interna do <strong class=\"text-bcb-dark\">Programa de Assistência à Saúde dos Servidores do Banco Central (PASBC)</strong>. Não há impacto direto ou indireto para outras instituições financeiras ou demais entidades autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong>. As alterações são de natureza administrativa e de governança para a sustentabilidade do plano de saúde dos colaboradores do próprio <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong>, não afetando o ecossistema financeiro nacional.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução BCB Nº 581, de 1º de julho de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Altera o <strong class=\"text-bcb-dark\">Regulamento do Programa de Assistência à Saúde dos Servidores do Banco Central – PASBC</strong>, anexo à <strong class=\"text-bcb-dark\">Resolução BCB nº 415, de 24 de setembro de 2024</strong>. Especificamente, revoga os <strong class=\"text-bcb-dark\">incisos I e VIII do caput do art. 68</strong> do referido Regulamento e adiciona um novo Capítulo VII-A e várias seções e artigos (Art. 60-A ao Art. 60-I) detalhando a sustentabilidade econômico-financeira.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A principal motivação regulatória é fortalecer a governança, a sustentabilidade econômico-financeira e a transparência na gestão do <strong class=\"text-bcb-dark\">PASBC</strong>. Isso se manifesta pela criação de mecanismos mais robustos para a constituição e gestão de reservas financeiras (como a <strong class=\"text-bcb-dark\">Reserva de Contingência</strong>), além de um sistema de acompanhamento prudencial que garante a solvência e a capacidade de cobertura de riscos do programa. A medida visa assegurar a longo prazo a qualidade e a continuidade da assistência à saúde oferecida aos servidores do <strong class=\"text-bcb-dark\">Banco Central</strong>, sem ter uma motivação macroeconômica ou prudencial para o sistema financeiro em geral.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=581\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução BCB N° 581 de 01/07/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB Nº 581</strong> entrou em vigor na data de sua publicação, ou seja, em <strong class=\"text-bcb-dark\">1º de julho de 2026</strong>. A partir dessa data, os departamentos do <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong> responsáveis pelo <strong class=\"text-bcb-dark\">PASBC</strong> devem iniciar imediatamente as adequações. Dentre os prazos importantes, destacam-se:</p><li class=\"text-justify\">Cálculo da <strong class=\"text-bcb-dark\">Reserva de Contingência (RC)</strong> e do <strong class=\"text-bcb-dark\">Fator de Insuficiência de Contraprestações (FIC)</strong>: Metodologia baseada nos últimos <strong class=\"text-bcb-dark\">24 meses</strong> de dados.</li><li class=\"text-justify\">Apuração <strong class=\"text-bcb-dark\">Trimestral</strong> do <strong class=\"text-bcb-dark\">Patrimônio Líquido de Referência (PLR)</strong> e do <strong class=\"text-bcb-dark\">Capital Mínimo baseado em Riscos (CMR)</strong> pelo <strong class=\"text-bcb-dark\">Departamento de Contabilidade, Orçamento e Execução Financeira – Deafi</strong>.</li><li class=\"text-justify\">Apuração <strong class=\"text-bcb-dark\">Trimestral</strong> do <strong class=\"text-bcb-dark\">Índice de Suficiência Calculado (IScalc)</strong> pelo <strong class=\"text-bcb-dark\">Deafi</strong>.</li><li class=\"text-justify\">Monitoramento <strong class=\"text-bcb-dark\">Trimestral</strong> dos gatilhos de atenção prudencial pelo <strong class=\"text-bcb-dark\">Depes</strong>.</li><li class=\"text-justify\">Estabelecimento <strong class=\"text-bcb-dark\">Anual</strong> do <strong class=\"text-bcb-dark\">Índice de Suficiência Definido (ISdef)</strong> pelo <strong class=\"text-bcb-dark\">Comitê Gestor</strong>, com base em recomendação do <strong class=\"text-bcb-dark\">Conselho Fiscal</strong> formulada preferencialmente até <strong class=\"text-bcb-dark\">setembro</strong> do exercício anterior, para ser observado no exercício subsequente.</li><li class=\"text-justify\">Análise da suficiência patrimonial pelo <strong class=\"text-bcb-dark\">Conselho Fiscal</strong> no <strong class=\"text-bcb-dark\">primeiro semestre</strong> de cada exercício e avaliação do patamar de referência do <strong class=\"text-bcb-dark\">ISdef</strong> no <strong class=\"text-bcb-dark\">segundo semestre</strong>, preferencialmente até <strong class=\"text-bcb-dark\">setembro</strong>.</li>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">Para o <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong>, esta norma gera um trabalho significativo de revisão e adaptação de processos operacionais e de gestão do <strong class=\"text-bcb-dark\">PASBC</strong>. Os departamentos envolvidos (<strong class=\"text-bcb-dark\">Deafi</strong>, <strong class=\"text-bcb-dark\">Depes</strong>, <strong class=\"text-bcb-dark\">Comitê Gestor</strong>, <strong class=\"text-bcb-dark\">Conselho Fiscal</strong>) deverão:</p><li class=\"text-justify\">Implementar as novas metodologias de cálculo para <strong class=\"text-bcb-dark\">Reserva de Contingência</strong>, <strong class=\"text-bcb-dark\">Patrimônio Líquido de Referência</strong>, <strong class=\"text-bcb-dark\">Capital Mínimo baseado em Riscos</strong> e <strong class=\"text-bcb-dark\">Índice de Suficiência</strong>.</li><li class=\"text-justify\">Revisar e adaptar sistemas internos para suportar as apurações e o monitoramento <strong class=\"text-bcb-dark\">trimestral</strong> dos indicadores de sustentabilidade econômico-financeira.</li><li class=\"text-justify\">Estabelecer novos fluxos de comunicação e relatórios para o acompanhamento da suficiência patrimonial e dos gatilhos prudenciais.</li><li class=\"text-justify\">Desenvolver ou ajustar procedimentos para a destinação de resultados anuais do <strong class=\"text-bcb-dark\">PASBC</strong> e a cobertura de eventuais insuficiências.</li><li class=\"text-justify\">Realizar treinamentos para as equipes envolvidas nas novas responsabilidades e processos.</li><p class=\"mb-4 text-justify\">Este esforço operacional implica em custos relacionados a desenvolvimento de sistemas, treinamento de pessoal e revisão de governança interna.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">Esta norma não introduz alterações em layouts de documentos regulatórios (como <strong class=\"text-bcb-dark\">CADOCs</strong>) ou em especificações técnicas (tabelas de domínios, dicionários de dados, tags XML ou protocolos de transmissão) que afetem as instituições financeiras e demais entidades autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong>. As mudanças são de natureza interna ao <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong>, para os sistemas e processos que gerenciam o <strong class=\"text-bcb-dark\">PASBC</strong>. Portanto, não há necessidade de adaptações em sistemas ou layouts externos para o mercado financeiro.</p>\n      </div>","title":"BC - Resolução BCB N° 581 de 01/07/2026","type":"Resolução","summary":"A Resolução BCB Nº 581, de 1º de julho de 2026, foca exclusivamente no Programa de Assistência à Saúde dos Servidores do Banco Central (PASBC). Esta norma não possui impacto direto sobre outras instituições financeiras ou entidades autorizadas a funcionar pelo BCB, sendo uma medida de governança interna para a sustentabilidade do plano de saúde de seus próprios colaboradores. Atenção: evite direcionar esforços de análise ou compliance para esta norma, caso sua instituição não seja o próprio Banco Central do Brasil.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=581","isFeatured":false,"tags":[],"date":"2026-07-01","number":"BCB N° 581","updated_at":"2026-07-01T23:03:10.054Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52962.pdf"},{"id":"normativos_52961","slug":"resolucao-bcb-580","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB N° 580, de 1º de julho de 2026</strong>, representa um avanço significativo na regulamentação do mercado de <strong class=\"text-bcb-dark\">ativos virtuais</strong> no Brasil, integrando formalmente as <strong class=\"text-bcb-dark\">Sociedades Prestadoras de Serviços de Ativos Virtuais</strong> (<strong class=\"text-bcb-dark\">VASPs</strong>) e seus conglomerados prudenciais ao arcabouço de supervisão do <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong> (<strong class=\"text-bcb-dark\">BCB</strong>). A norma altera as <strong class=\"text-bcb-dark\">Resoluções BCB nº 436, de 28 de novembro de 2024</strong>, e <strong class=\"text-bcb-dark\">Resolução BCB nº 201, de 11 de março de 2022</strong>, para classificar as <strong class=\"text-bcb-dark\">VASPs</strong> como <strong class=\"text-bcb-dark\">Tipo 3</strong> e vedar a prestação de serviços de <strong class=\"text-bcb-dark\">ativos virtuais</strong> para instituições que optem pelo enquadramento no <strong class=\"text-bcb-dark\">Segmento 5 – S5</strong>.</p><p class=\"mb-4 text-justify\">Um dos pontos centrais da Resolução é a determinação de que as <strong class=\"text-bcb-dark\">VASPs</strong> devem observar um extenso rol de regramentos prudenciais, detalhados no <strong class=\"text-bcb-dark\">Art. 5º</strong>, a partir de <strong class=\"text-bcb-dark\">1º de janeiro de 2027</strong>. Essas normas abrangem áreas como gerenciamento de riscos, capital, governança e reporte de informações, consolidando uma supervisão mais rigorosa sobre essas entidades. A medida visa garantir a estabilidade do sistema financeiro, mitigar riscos e promover um ambiente de negócios mais seguro e transparente para a operação com <strong class=\"text-bcb-dark\">ativos virtuais</strong>.</p><p class=\"mb-4 text-justify\">Adicionalmente, a norma estabelece que, até <strong class=\"text-bcb-dark\">30 de junho de 2028</strong>, as <strong class=\"text-bcb-dark\">Sociedades Prestadoras de Serviços de Ativos Virtuais</strong> singulares e os conglomerados prudenciais por elas liderados deverão enquadrar-se obrigatoriamente no <strong class=\"text-bcb-dark\">Segmento 4 – S4</strong>, independentemente de seu porte. Essa exigência assegura que mesmo as <strong class=\"text-bcb-dark\">VASPs</strong> de menor porte sejam submetidas a um nível adequado de exigências prudenciais e de supervisão, alinhando a regulamentação brasileira às melhores práticas internacionais no combate à lavagem de dinheiro e financiamento ao terrorismo e na proteção dos investidores.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">ALTO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é <strong class=\"text-bcb-dark\">ALTO</strong> para as <strong class=\"text-bcb-dark\">Sociedades Prestadoras de Serviços de Ativos Virtuais</strong> (<strong class=\"text-bcb-dark\">VASPs</strong>) e seus conglomerados, que enfrentarão complexidade considerável na adaptação a um novo e robusto regime prudencial. Para o sistema financeiro em geral, o impacto é significativo ao formalizar e trazer sob supervisão um segmento crescente do mercado, aumentando a segurança e a integridade, mas também alterando a dinâmica competitiva.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução BCB N° 580, de 1º de julho de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Altera as <strong class=\"text-bcb-dark\">Resoluções BCB nº 436, de 28 de novembro de 2024</strong>, e <strong class=\"text-bcb-dark\">Resolução BCB nº 201, de 11 de março de 2022</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória reside na necessidade de integrar o mercado de <strong class=\"text-bcb-dark\">ativos virtuais</strong> ao escopo de supervisão prudencial do <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong> (<strong class=\"text-bcb-dark\">BCB</strong>). Ao classificar as <strong class=\"text-bcb-dark\">Sociedades Prestadoras de Serviços de Ativos Virtuais</strong> (<strong class=\"text-bcb-dark\">VASPs</strong>) como <strong class=\"text-bcb-dark\">Tipo 3</strong> e sujeitá-las a um regime prudencial mais rigoroso, o <strong class=\"text-bcb-dark\">BCB</strong> busca fortalecer a estabilidade financeira, mitigar riscos sistêmicos, coibir atividades ilícitas como lavagem de dinheiro e financiamento ao terrorismo, e proteger os participantes do mercado, alinhando a regulamentação brasileira às tendências e padrões internacionais para esse setor em constante expansão.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=580\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução BCB N° 580 de 01/07/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB N° 580</strong> entrou em vigor na data de sua publicação, em <strong class=\"text-bcb-dark\">1º de julho de 2026</strong>. Os principais prazos para adequação são:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">1º de janeiro de 2027</strong>: A partir desta data, as <strong class=\"text-bcb-dark\">Sociedades Prestadoras de Serviços de Ativos Virtuais</strong> singulares e seus conglomerados prudenciais deverão observar as diversas circulares e resoluções prudenciais listadas no <strong class=\"text-bcb-dark\">Art. 5º</strong>. Além disso, as instituições enquadradas no <strong class=\"text-bcb-dark\">S5</strong> que, na data de entrada em vigor da Resolução, estavam prestando serviços de <strong class=\"text-bcb-dark\">ativos virtuais</strong>, devem observar a restrição de não prestação desses serviços para fins de enquadramento no <strong class=\"text-bcb-dark\">S5</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">30 de junho de 2028</strong>: Até esta data, as <strong class=\"text-bcb-dark\">Sociedades Prestadoras de Serviços de Ativos Virtuais</strong> singulares e os conglomerados prudenciais liderados por elas devem se enquadrar no <strong class=\"text-bcb-dark\">Segmento 4 – S4</strong>, independentemente do seu porte.</li>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A norma gera um <strong class=\"text-bcb-dark\">trabalho</strong> e <strong class=\"text-bcb-dark\">custo</strong> significativos para as <strong class=\"text-bcb-dark\">Sociedades Prestadoras de Serviços de Ativos Virtuais</strong> (<strong class=\"text-bcb-dark\">VASPs</strong>). Os principais <strong class=\"text-bcb-dark\">processos</strong> que devem ser revisados e adaptados incluem:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Governança Corporativa</strong>: Necessidade de reestruturação para atender às exigências prudenciais, incluindo a criação ou fortalecimento de comitês de risco e compliance.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Gestão de Riscos</strong>: Implementação de frameworks robustos para gerenciar riscos de crédito, mercado, operacional, liquidez e capital, conforme as Circulares e Resoluções aplicáveis.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Controles Internos</strong>: Adequação e fortalecimento dos sistemas de controles internos para assegurar a conformidade regulatória.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Tecnologia da Informação</strong>: Investimento em sistemas e softwares para coletar, processar e reportar dados conforme os <strong class=\"text-bcb-dark\">CADOCs</strong> e exigências prudenciais, além de garantir a segurança cibernética.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Recursos Humanos</strong>: Contratação ou capacitação de profissionais especializados em compliance regulatório, finanças e tecnologia para o setor bancário.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Adequação de Capital</strong>: Revisão e manutenção da estrutura de capital para atender aos requisitos de Patrimônio de Referência e Capital Requerido.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Segregação de Atividades</strong>: Para instituições no <strong class=\"text-bcb-dark\">Segmento 5 – S5</strong>, será necessário cessar a prestação de serviços de <strong class=\"text-bcb-dark\">ativos virtuais</strong> para manter o enquadramento simplificado, exigindo revisão de modelos de negócios e estratégias.</li>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB N° 580</strong> não detalha alterações específicas em <strong class=\"text-bcb-dark\">layouts</strong> de documentos regulatórios (<strong class=\"text-bcb-dark\">CADOCs</strong>), tabelas de domínios, dicionários de dados, tags <strong class=\"text-bcb-dark\">XML</strong> ou protocolos de transmissão. No entanto, ao sujeitar as <strong class=\"text-bcb-dark\">Sociedades Prestadoras de Serviços de Ativos Virtuais</strong> (<strong class=\"text-bcb-dark\">VASPs</strong>) a um vasto conjunto de normas prudenciais listadas no <strong class=\"text-bcb-dark\">Art. 5º</strong> (incluindo diversas Circulares e Resoluções), implicitamente exige que essas instituições adaptem seus sistemas para reportar as informações exigidas por esses normativos já existentes. Isso significa que as <strong class=\"text-bcb-dark\">VASPs</strong> precisarão consultar os manuais e documentos técnicos de cada circular e resolução prudencial mencionada (por exemplo, sobre capital, gerenciamento de riscos e demonstrações financeiras) para identificar os respectivos <strong class=\"text-bcb-dark\">CADOCs</strong> e seus <strong class=\"text-bcb-dark\">layouts</strong> de preenchimento e envio, garantindo a conformidade com as exigências de reporte de informações ao <strong class=\"text-bcb-dark\">BCB</strong>.</p>\n      </div>","title":"BC - Resolução BCB N° 580 de 01/07/2026","type":"Resolução","summary":"Esta norma é um divisor de águas para as Sociedades Prestadoras de Serviços de Ativos Virtuais (VASPs) e seus conglomerados no Brasil. Ela estabelece a classificação compulsória dessas entidades como Tipo 3 no sistema de supervisão do Banco Central do Brasil (BCB) e as submete a um regime prudencial robusto. Fiquem atentos aos prazos de adequação, especialmente a partir de 1º de janeiro de 2027, e à necessidade de enquadramento no Segmento 4 – S4 até 30 de junho de 2028. Revise as Resoluções BCB nº 436/2024 e 201/2022 para compreender as alterações.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=580","isFeatured":false,"tags":["SPSAV"],"date":"2026-07-01","number":"BCB N° 580","updated_at":"2026-07-01T23:03:10.054Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52961.pdf"},{"id":"normativos_52960","slug":"instrucao-normativa-bcb-754","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Instrução Normativa BCB N° 754, de 01 de julho de 2026</strong>, representa um passo estratégico do <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong> para fortalecer a supervisão e o monitoramento do sistema financeiro nacional. Esta norma altera a <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 330, de 24 de novembro de 2022</strong>, que estabelece os procedimentos para o registro e a atualização de informações no sistema <strong class=\"text-bcb-dark\">Unicad</strong>. O objetivo central é integrar novas obrigações de reporte em uma base de dados unificada, facilitando a gestão e análise de riscos por parte do regulador.</p><p class=\"mb-4 text-justify\">A norma introduz três novos procedimentos de registro essenciais para <strong class=\"text-bcb-dark\">TODAS as instituições financeiras</strong> e demais entidades autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong>. Primeiramente, exige a comunicação de categorias de atividades operacionais para o cálculo de capital mínimo, conforme a <strong class=\"text-bcb-dark\">Resolução BCB nº 517, de 3 de novembro de 2025</strong>. Em segundo lugar, estabelece o registro e a atualização das informações sobre entidades tomadoras de serviços de <strong class=\"text-bcb-dark\">Banking as a Service (BaaS)</strong> com contratos vigentes, em alinhamento com a <strong class=\"text-bcb-dark\">Resolução Conjunta nº 16, de 28 de novembro de 2025</strong>. Por fim, demanda o registro da possibilidade de transferência de liquidez entre participantes do mesmo conglomerado prudencial, em conformidade com as exigências da <strong class=\"text-bcb-dark\">Resolução CMN nº 4.557, de 23 de fevereiro de 2017</strong>, e da <strong class=\"text-bcb-dark\">Resolução BCB nº 265, de 25 de novembro de 2022</strong>.</p><p class=\"mb-4 text-justify\">Este conjunto de alterações visa proporcionar ao <strong class=\"text-bcb-dark\">BCB</strong> uma visão mais clara e em tempo real sobre a adequação de capital das instituições, a expansão do mercado de <strong class=\"text-bcb-dark\">BaaS</strong> e a capacidade de resiliência dos conglomerados prudenciais em situações de estresse. A harmonização desses registros no <strong class=\"text-bcb-dark\">Unicad</strong> é crucial para a manutenção da estabilidade financeira, promovendo um ambiente de maior transparência e controle regulatório. As instituições devem revisar seus processos internos e sistemas para garantir a correta e tempestiva comunicação dessas informações.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">ALTO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é <strong class=\"text-bcb-dark\">ALTO</strong> devido à abrangência das alterações, que afetam <strong class=\"text-bcb-dark\">TODAS as instituições autorizadas pelo BCB</strong>, independentemente do segmento. A norma consolida informações críticas sobre capital, <strong class=\"text-bcb-dark\">BaaS</strong> e liquidez no <strong class=\"text-bcb-dark\">Unicad</strong>, impactando diretamente a capacidade de supervisão macroprudencial do <strong class=\"text-bcb-dark\">BCB</strong> e a estabilidade do sistema financeiro. A necessidade de adaptação sistêmica e processual é universal.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Instrução Normativa BCB N° 754, de 01 de julho de 2026</strong></p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Esta norma altera a <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 330, de 24 de novembro de 2022</strong>. Ela implementa exigências contidas nas seguintes normas hierarquicamente superiores:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Resolução BCB nº 517, de 3 de novembro de 2025</strong> (sobre cálculo de capital mínimo).</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Resolução Conjunta nº 16, de 28 de novembro de 2025</strong> (sobre <strong class=\"text-bcb-dark\">BaaS</strong>).</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Resolução CMN nº 4.557, de 23 de fevereiro de 2017</strong>, alterada pela <strong class=\"text-bcb-dark\">Resolução CMN nº 5.222, de 30 de maio de 2025</strong> (sobre estrutura de gerenciamento de riscos e capital).</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Resolução BCB nº 265, de 25 de novembro de 2022</strong>, alterada pela <strong class=\"text-bcb-dark\">Resolução BCB nº 477, de 30 de maio de 2025</strong> (sobre estrutura de gerenciamento de riscos e capital para instituições Tipo 3 dos segmentos S2, S3 ou S4).</li><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória primária é centralizar e padronizar o reporte de informações cruciais no sistema <strong class=\"text-bcb-dark\">Unicad</strong>, permitindo ao <strong class=\"text-bcb-dark\">BCB</strong> um monitoramento mais eficaz da saúde financeira das instituições. Isso se dá em resposta a novas obrigações criadas por regulamentações recentes sobre adequação de capital, a expansão dos serviços de <strong class=\"text-bcb-dark\">Banking as a Service (BaaS)</strong> e a necessidade de aprimorar a gestão do risco de liquidez em conglomerados prudenciais. A norma visa garantir que o <strong class=\"text-bcb-dark\">BCB</strong> possua os dados necessários para avaliar riscos sistêmicos, a solvência das instituições e a higidez do mercado financeiro.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=754\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Instrução Normativa BCB N° 754 de 01/07/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">O cronograma de adequação para as instituições é escalonado:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Na data de sua publicação (01 de julho de 2026)</strong>: Entram em vigor o <strong class=\"text-bcb-dark\">Art. 2º</strong> e a inclusão do <strong class=\"text-bcb-dark\">Art. 10-F</strong>. O <strong class=\"text-bcb-dark\">Art. 2º</strong> estabelece que, para instituições em funcionamento em <strong class=\"text-bcb-dark\">30 de junho de 2026</strong>, o <strong class=\"text-bcb-dark\">BCB</strong> realizará um registro inicial de <strong class=\"text-bcb-dark\">TODAS</strong> as categorias de atividades e serviços da <strong class=\"text-bcb-dark\">Resolução BCB nº 517, de 2025</strong>. As instituições deverão acessar o <strong class=\"text-bcb-dark\">Unicad</strong> para revisar e <strong class=\"text-bcb-dark\">encerrar</strong> as atividades operacionais e serviços que não realizem, nem pretendam realizar. O <strong class=\"text-bcb-dark\">Art. 10-F</strong> exige que novas atividades sejam comunicadas com <strong class=\"text-bcb-dark\">noventa dias de antecedência</strong> ao seu início.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">1º de setembro de 2026</strong>: Entra em vigor a inclusão do <strong class=\"text-bcb-dark\">Art. 10-G</strong>, que trata do registro de tomadoras de serviços de <strong class=\"text-bcb-dark\">Banking as a Service (BaaS)</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">1º de outubro de 2026</strong>: Entra em vigor a inclusão do <strong class=\"text-bcb-dark\">Art. 10-H</strong>, que dispõe sobre o registro da transferência de liquidez no conglomerado prudencial.</li>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A implementação desta <strong class=\"text-bcb-dark\">Instrução Normativa</strong> gerará trabalho e custos significativos para as instituições. Será necessário um esforço considerável para adequação de sistemas internos e processos de <strong class=\"text-bcb-dark\">Compliance</strong>. As principais revisões operacionais incluem:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Revisão de Atividades (Imediato)</strong>: As instituições deverão alocar equipes para revisar e <strong class=\"text-bcb-dark\">encerrar</strong> as categorias de atividades e serviços pré-registrados pelo <strong class=\"text-bcb-dark\">BCB</strong> no <strong class=\"text-bcb-dark\">Unicad</strong> até <strong class=\"text-bcb-dark\">30 de junho de 2026</strong>, assegurando que apenas as atividades realmente exercidas ou planejadas sejam mantidas. Isso exige análise crítica interna e depuração de dados.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Processos Contínuos de Registro</strong>: Instituir processos robustos para o registro e a atualização contínua de novas atividades para cálculo de capital mínimo (com antecedência de <strong class=\"text-bcb-dark\">90 dias</strong>), de informações detalhadas sobre tomadores de <strong class=\"text-bcb-dark\">BaaS</strong>, e da capacidade de transferência de liquidez em conglomerados.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Desenvolvimento de Sistemas</strong>: Investimentos em desenvolvimento ou customização de sistemas para automatizar, quando possível, a coleta, validação e envio das novas informações ao <strong class=\"text-bcb-dark\">Unicad</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Capacitação e Governança</strong>: Treinamento de equipes de <strong class=\"text-bcb-dark\">Compliance</strong>, risco, TI e operações para entender as novas exigências e os fluxos de trabalho associados. Fortalecimento da governança de dados para garantir a qualidade e a integridade das informações reportadas. O não cumprimento pode acarretar em sanções regulatórias.</li>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A norma introduz novas seções e procedimentos de registro no sistema <strong class=\"text-bcb-dark\">Unicad</strong>, que é a base de informações sobre entidades de interesse do <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong>. As instituições deverão adaptar seus sistemas e processos para registrar dados em módulos e opções específicas do <strong class=\"text-bcb-dark\">Unicad</strong>:</p><p class=\"mb-4 text-justify\">1.  <strong class=\"text-bcb-dark\">Módulo 'Operações', opção 'Inclusão'</strong>: Para registrar categorias de atividades operacionais pretendidas e serviços previstos no <strong class=\"text-bcb-dark\">Art. 4º da Resolução BCB nº 517, de 2025</strong>, para fins de cálculo de capital mínimo (<strong class=\"text-bcb-dark\">Art. 10-F</strong>).</p><p class=\"mb-4 text-justify\">2.  <strong class=\"text-bcb-dark\">Módulo 'Vínculos', opção 'Inclusão'</strong>: Para registrar e manter atualizadas as informações das entidades tomadoras de serviços de <strong class=\"text-bcb-dark\">BaaS</strong> com contratos vigentes, conforme o <strong class=\"text-bcb-dark\">Art. 20, inciso I, da Resolução Conjunta nº 16, de 2025</strong> (<strong class=\"text-bcb-dark\">Art. 10-G</strong>). Este registro exige a observância dos campos e regras de validação disponíveis no próprio <strong class=\"text-bcb-dark\">Unicad</strong>.</p><p class=\"mb-4 text-justify\">3.  <strong class=\"text-bcb-dark\">Módulo 'Conglomerados', opção 'Consulta/Alteração'</strong>: Para registrar e atualizar informações sobre a possibilidade de transferência de liquidez entre participantes do conglomerado prudencial, visando o cumprimento do <strong class=\"text-bcb-dark\">Art. 38, inciso I, alínea 'e', da Resolução CMN nº 4.557, de 2017</strong>, e do <strong class=\"text-bcb-dark\">Art. 40, inciso I, alínea 'e', da Resolução BCB nº 265, de 2022</strong> (<strong class=\"text-bcb-dark\">Art. 10-H</strong>).</p><p class=\"mb-4 text-justify\">Não há menção direta a alterações de layouts de <strong class=\"text-bcb-dark\">CADOCs</strong> específicos, mas sim a necessidade de interação e alimentação direta com as interfaces do sistema <strong class=\"text-bcb-dark\">Unicad</strong>.</p>\n      </div>","title":"BC - Instrução Normativa BCB N° 754 de 01/07/2026","type":"Instrução Normativa","summary":"Esta norma (Instrução Normativa BCB N° 754, de 01/07/2026) é fundamental para aprimorar a transparência e o monitoramento regulatório do BCB. Ela atualiza a IN BCB nº 330, de 2022, para incluir novas obrigações de registro no sistema Unicad. Prepare sua instituição para comunicar atividades de capital, registrar tomadores de serviços de BaaS e informar sobre a capacidade de transferência de liquidez em conglomerados prudenciais, garantindo a conformidade e a eficiência no fluxo de informações ao regulador.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=754","tags":[],"date":"2026-07-01","number":"BCB N° 754","updated_at":"2026-07-01T19:03:03.629Z","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52960.pdf","thumb_v":"v4","isFeatured":false},{"id":"normativos_52959","slug":"instrucao-normativa
