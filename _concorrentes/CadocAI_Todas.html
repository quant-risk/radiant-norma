-bcb-753","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Instrução Normativa BCB Nº 753, de 01/07/2026</strong>, emitida pelo <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong>, representa uma atualização crucial na regulamentação de relatórios prudenciais, impactando todas as instituições financeiras e demais entidades autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong> que compõem um conglomerado prudencial. Seu principal objetivo é aprimorar o monitoramento da saúde financeira das instituições, por meio da exigência de informações mais detalhadas sobre os <strong class=\"text-bcb-dark\">subconglomerados prudenciais</strong>.</p><p class=\"mb-4 text-justify\">Essa norma altera a <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 210, de 21/12/2021</strong>, modificando as informações que devem ser reportadas nos <strong class=\"text-bcb-dark\">CADOCs 4060 - Balancete Patrimonial Analítico - Conglomerado Prudencial</strong> e <strong class=\"text-bcb-dark\">4066 - Balanço Patrimonial Analítico - Conglomerado Prudencial</strong>. As mudanças incorporam a necessidade de prestar a posição contábil individual de diversas entidades e, de forma mais significativa, a posição contábil do <strong class=\"text-bcb-dark\">subconglomerado prudencial</strong>, conforme as disposições das <strong class=\"text-bcb-dark\">Resoluções CMN nº 4.950, de 2021</strong>, e <strong class=\"text-bcb-dark\">BCB nº 168, de 2021</strong>, especialmente após as alterações promovidas pelas <strong class=\"text-bcb-dark\">Resoluções CMN nº 5.221, de 30/05/2025</strong>, e <strong class=\"text-bcb-dark\">BCB nº 483, de 11/06/2025</strong>.</p><p class=\"mb-4 text-justify\">A motivação regulatória reside na necessidade de alinhar os procedimentos de reporte do <strong class=\"text-bcb-dark\">BCB</strong> com as recentes alterações nas normas prudenciais superiores que introduziram o conceito de <strong class=\"text-bcb-dark\">subconglomerado prudencial</strong>. Isso permitirá ao <strong class=\"text-bcb-dark\">BCB</strong> uma visão mais granular e precisa dos riscos e da estrutura de capital das instituições que optam por apurar a razão de alavancagem em bases subconsolidadas, contribuindo para a preservação da liquidez, solvência e higidez dos mercados financeiros nacionais.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é considerado <strong class=\"text-bcb-dark\">MÉDIO</strong> devido à necessidade de revisão de sistemas e processos para a coleta e reporte de novas informações para os <strong class=\"text-bcb-dark\">CADOCs 4060</strong> e <strong class=\"text-bcb-dark\">4066</strong>. Embora afete apenas as instituições pertencentes a conglomerados prudenciais, a alteração é fundamental para a conformidade regulatória e demanda esforços de adaptação tecnológica e operacional significativos, especialmente para quem ainda não havia preparado para o novo conceito de <strong class=\"text-bcb-dark\">subconglomerado prudencial</strong>.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Instrução Normativa BCB Nº 753, de 01 de julho de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Altera a <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 210, de 21 de dezembro de 2021</strong>. É motivada e fundamentada em diversas normas superiores, incluindo as <strong class=\"text-bcb-dark\">Resoluções CMN ns. 4.911, de 27 de maio de 2021, 4.924, de 24 de junho de 2021, e 4.950, de 30 de setembro de 2021</strong>, e as <strong class=\"text-bcb-dark\">Resoluções BCB ns. 120, de 27 de julho de 2021, 146, de 28 de setembro de 2021 e 168, de 1º de dezembro de 2021</strong>. As alterações mais diretas para a inclusão do <strong class=\"text-bcb-dark\">subconglomerado prudencial</strong> foram introduzidas pelas <strong class=\"text-bcb-dark\">Resoluções CMN nº 5.221, de 30 de maio de 2025</strong>, e <strong class=\"text-bcb-dark\">BCB nº 483, de 11 de junho de 2025</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A principal motivação regulatória é aprimorar o monitoramento prudencial do <strong class=\"text-bcb-dark\">Sistema Financeiro Nacional (SFN)</strong>, incorporando o conceito de <strong class=\"text-bcb-dark\">subconglomerado prudencial</strong> nos relatórios obrigatórios. Essa medida visa fortalecer a capacidade do <strong class=\"text-bcb-dark\">BCB</strong> de avaliar a liquidez, solvência e higidez das instituições financeiras, especialmente aquelas que optam por apurar a razão de alavancagem em bases subconsolidadas, garantindo a estabilidade e a integridade dos mercados financeiros, de capitais e de câmbio. A norma cumpre determinações de regulamentação hierarquicamente superior, não permitindo alternativas regulatórias distintas.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=753\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Instrução Normativa BCB N° 753 de 01/07/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Instrução Normativa BCB Nº 753</strong> entra em vigor na data de sua publicação (<strong class=\"text-bcb-dark\">01 de julho de 2026</strong>). No entanto, a nova versão do leiaute e as instruções de preenchimento para os <strong class=\"text-bcb-dark\">CADOCs 4060</strong> e <strong class=\"text-bcb-dark\">4066</strong>, com a inclusão do <strong class=\"text-bcb-dark\">bloco de dados 8 - Subconglomerado prudencial</strong>, passam a vigorar a partir da <strong class=\"text-bcb-dark\">data-base de julho de 2026</strong>. Isso significa que as instituições líderes de conglomerados prudenciais que apuram em bases subconsolidadas devem garantir que seus sistemas e processos estejam totalmente adequados para a remessa das informações com o novo leiaute para a referência de <strong class=\"text-bcb-dark\">julho de 2026</strong>, cuja entrega ocorrerá no mês subsequente, conforme a periodicidade de cada documento.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A implementação desta <strong class=\"text-bcb-dark\">Instrução Normativa</strong> gerará trabalho e custo para as instituições financeiras e demais entidades autorizadas que pertencem a conglomerados prudenciais. No âmbito tecnológico, exigirá atualizações nos sistemas de informação e <strong class=\"text-bcb-dark\">RegTech</strong>, envolvendo desenvolvimento de novas funcionalidades, mapeamento de dados, e garantia de integridade das informações do <strong class=\"text-bcb-dark\">subconglomerado prudencial</strong>. Operacionalmente, processos de coleta, consolidação e validação de dados contábeis deverão ser revisados. Será necessário redefinir fluxos de trabalho, treinar equipes de contabilidade, risco e compliance, e adaptar controles internos para assegurar a conformidade com as novas exigências de reporte. A complexidade aumentará, especialmente para conglomerados com estruturas mais intrincadas e com múltiplas entidades que compõem o <strong class=\"text-bcb-dark\">subconglomerado</strong>, demandando atenção à governança de dados e à aderência ao <strong class=\"text-bcb-dark\">Padrão Contábil das Instituições Reguladas pelo Banco Central do Brasil – Cosif</strong> para estas novas perspectivas de consolidação.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">Esta <strong class=\"text-bcb-dark\">Instrução Normativa</strong> estabelece a entrada em vigor de uma nova versão do leiaute e das instruções de preenchimento para os seguintes documentos regulatórios do <strong class=\"text-bcb-dark\">BCB</strong> (CADOCs):</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">4060 - Balancete Patrimonial Analítico - Conglomerado Prudencial</strong></li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">4066 - Balanço Patrimonial Analítico - Conglomerado Prudencial</strong></li><p class=\"mb-4 text-justify\">A alteração técnica principal é a inclusão do <strong class=\"text-bcb-dark\">bloco de dados 8 - Subconglomerado prudencial</strong>. Isso implica na necessidade de adicionar novos campos e estruturas de dados nos arquivos de remessa desses <strong class=\"text-bcb-dark\">CADOCs</strong> para reportar as posições contábeis relativas ao <strong class=\"text-bcb-dark\">subconglomerado prudencial</strong>. As instituições devem consultar a nova versão do leiaute e as instruções de preenchimento, que estarão disponíveis na página do <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong> na internet, no endereço eletrônico <strong class=\"text-bcb-dark\">https://www.bcb.gov.br/estabilidadefinanceira/leiautedocumentoscrd</strong>, para identificar as tabelas de domínios, dicionários de dados, e quaisquer tags <strong class=\"text-bcb-dark\">XML</strong> ou protocolos de transmissão afetados pela inclusão deste novo bloco de dados.</p>\n      </div>","title":"BC - Instrução Normativa BCB N° 753 de 01/07/2026","type":"Instrução Normativa","summary":"A Instrução Normativa BCB Nº 753, de 01/07/2026, altera a forma de prestação de informações prudenciais, demandando a inclusão de dados do subconglomerado prudencial nos CADOCs 4060 e 4066. Prepare-se para atualizar seus sistemas e processos contábeis/financeiros. A nova versão do leiaute e as instruções de preenchimento entram em vigor para a data-base de julho de 2026, visando maior transparência e monitoramento da solidez financeira, em alinhamento com as Resoluções CMN nº 5.221 e BCB nº 483, ambas de 2025.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=753","tags":[],"date":"2026-07-01","number":"BCB N° 753","updated_at":"2026-07-01T19:03:03.629Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52959.pdf","isFeatured":false},{"id":"normativos_52958","slug":"instrucao-normativa-bcb-752","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Instrução Normativa BCB Nº 752, de 01/07/2026</strong>, é um marco regulatório que oficializa a <strong class=\"text-bcb-dark\">versão 8.4</strong> do <strong class=\"text-bcb-dark\">Manual Operacional do Diretório de Identificadores de Contas Transacionais (DICT)</strong>. Este manual é peça chave do <strong class=\"text-bcb-dark\">Regulamento do Pix</strong>, estabelecido pela <strong class=\"text-bcb-dark\">Resolução BCB nº 1, de 12 de agosto de 2020</strong>. A norma reflete o compromisso contínuo do <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong> com a segurança e a eficiência do ecossistema de pagamentos instantâneos, consolidando diversas melhorias e esclarecimentos sobre a operação do <strong class=\"text-bcb-dark\">Pix</strong>.</p><p class=\"mb-4 text-justify\">As principais alterações introduzidas pela <strong class=\"text-bcb-dark\">versão 8.4</strong> e por versões anteriores com prazos de entrada em vigor próximos abrangem a padronização do formato da chave <strong class=\"text-bcb-dark\">CNPJ</strong> para alfanumérico, aprimoramentos significativos nos fluxos do <strong class=\"text-bcb-dark\">Mecanismo Especial de Devolução (MED)</strong> e de recuperação de valores, e a obrigatoriedade da validação de dados cadastrais junto à <strong class=\"text-bcb-dark\">Receita Federal</strong> para a gestão de chaves <strong class=\"text-bcb-dark\">Pix</strong>. Tais mudanças visam fortalecer o combate a fraudes, otimizar a operacionalização de devoluções e garantir a integridade das informações registradas no <strong class=\"text-bcb-dark\">DICT</strong>.</p><p class=\"mb-4 text-justify\">Para todas as instituições financeiras e demais entidades autorizadas a operar pelo <strong class=\"text-bcb-dark\">BCB</strong>, a conformidade com esta instrução normativa é mandatoriamente sistêmica. As adaptações requerem revisão e atualização de sistemas internos, redefinição de processos operacionais e treinamento de equipes, com atenção especial aos prazos escalonados para a implementação das validações de dados da <strong class=\"text-bcb-dark\">Receita Federal</strong> e a entrada em vigor das novas regras do <strong class=\"text-bcb-dark\">MED</strong>. A transparência e a precisão na comunicação com os usuários também são aspectos críticos a serem considerados.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">ALTO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é <strong class=\"text-bcb-dark\">ALTO</strong> devido à natureza contínua e abrangente das atualizações no <strong class=\"text-bcb-dark\">Manual Operacional do DICT</strong>, que afetam diretamente o core do <strong class=\"text-bcb-dark\">Pix</strong>. As alterações no formato da chave <strong class=\"text-bcb-dark\">CNPJ</strong>, nos complexos fluxos do <strong class=\"text-bcb-dark\">MED</strong> e de recuperação de valores, e a integração com dados da <strong class=\"text-bcb-dark\">Receita Federal</strong>, exigem adaptações significativas em sistemas, APIs, processos de compliance e equipes de fraude de <strong class=\"text-bcb-dark\">TODAS</strong> as instituições participantes, sem distinção. A complexidade de implementação é elevada, demandando alocação substancial de recursos técnicos e humanos para garantir a conformidade e a segurança operacional.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> Instrução Normativa BCB Nº 752, de 01 de julho de 2026.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Esta Instrução Normativa <strong class=\"text-bcb-dark\">revoga</strong> expressamente a <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 742, de 9 de junho de 2026</strong>. Adicionalmente, ela atualiza a <strong class=\"text-bcb-dark\">versão 8.4</strong> do <strong class=\"text-bcb-dark\">Manual Operacional do DICT</strong>, que é parte integrante do <strong class=\"text-bcb-dark\">Regulamento do Pix</strong>, anexo à <strong class=\"text-bcb-dark\">Resolução BCB nº 1, de 12 de agosto de 2020</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória primária é o aprimoramento contínuo e a segurança do ecossistema do <strong class=\"text-bcb-dark\">Pix</strong>. As alterações visam fortalecer os mecanismos de combate à fraude e golpes (<strong class=\"text-bcb-dark\">MED</strong> e Recuperação de Valores), aumentar a robustez na gestão de chaves <strong class=\"text-bcb-dark\">Pix</strong> por meio da validação de dados cadastrais da <strong class=\"text-bcb-dark\">Receita Federal</strong>, e otimizar a interoperabilidade do sistema. Há também um foco na adaptação às novas funcionalidades, como o <strong class=\"text-bcb-dark\">Pix Automático</strong>, e na padronização de identificadores, como o formato alfanumérico para a chave <strong class=\"text-bcb-dark\">CNPJ</strong>, garantindo maior eficiência e transparência nas operações e na resolução de incidentes.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=752\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Instrução Normativa BCB N° 752 de 01/07/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">O cronograma de adequação para as instituições financeiras e demais participantes do <strong class=\"text-bcb-dark\">Pix</strong> é composto por diversas datas importantes:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">01 de julho de 2026</strong>: Entrada em vigor da <strong class=\"text-bcb-dark\">Instrução Normativa BCB Nº 752</strong> e de todas as alterações descritas na <strong class=\"text-bcb-dark\">versão 8.4</strong> do <strong class=\"text-bcb-dark\">Manual Operacional do DICT</strong>, incluindo a mudança do formato da chave <strong class=\"text-bcb-dark\">CNPJ</strong> para alfanumérico e os esclarecimentos sobre os fluxos do <strong class=\"text-bcb-dark\">MED</strong> e Recuperação de Valores.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">09 de junho de 2026</strong>: Implementação das regras da <strong class=\"text-bcb-dark\">versão 8.3</strong> do <strong class=\"text-bcb-dark\">Manual Operacional do DICT</strong>, referente ao cancelamento automático de notificações de infração pelo <strong class=\"text-bcb-dark\">DICT</strong> durante a Recuperação de Valores.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">11 de maio de 2026</strong>: Entrada em vigor das regras da <strong class=\"text-bcb-dark\">versão 8.2</strong> do <strong class=\"text-bcb-dark\">Manual Operacional do DICT</strong>, que aprimorou as funcionalidades do <strong class=\"text-bcb-dark\">MED</strong>, incluindo a exclusão da abertura de notificação de infração por `endpoint` específico e a renomeação de processos.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">02 de fevereiro de 2026</strong>: Implementação das regras da <strong class=\"text-bcb-dark\">versão 8.1</strong> do <strong class=\"text-bcb-dark\">Manual Operacional do DICT</strong>, com alterações e detalhamentos significativos nos fluxos do <strong class=\"text-bcb-dark\">MED</strong> e da Recuperação de Valores.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">01 de outubro de 2025</strong>: Entrada em vigor de duas importantes regras:</li><li class=\"text-justify\">A etapa de validação dos dados e situação cadastral do usuário na <strong class=\"text-bcb-dark\">Receita Federal</strong> para os processos de portabilidade e reivindicação de posse de chave (<strong class=\"text-bcb-dark\">Seções 5.1, 5.2, 6.1 e 6.2</strong>).</li><li class=\"text-justify\">A permissão para que o <strong class=\"text-bcb-dark\">PSP</strong> do pagador edite a notificação de infração enquanto ela estiver nos estados “aberta” ou “recebida” (<strong class=\"text-bcb-dark\">Seção 10.1</strong>).</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">01 de julho de 2025</strong>: Entrada em vigor da etapa de validação dos dados e situação cadastral do usuário na <strong class=\"text-bcb-dark\">Receita Federal</strong> durante os processos de registro e alteração de chaves <strong class=\"text-bcb-dark\">Pix</strong> (<strong class=\"text-bcb-dark\">Seções 3.1, 3.2, 7.1 e 7.2</strong>).</li><p class=\"mb-4 text-justify\">As instituições devem planejar suas adequações considerando esses prazos escalonados, priorizando as implementações conforme a data de vigência para garantir a conformidade (Compliance) contínua.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Instrução Normativa BCB Nº 752</strong> e a atualização do <strong class=\"text-bcb-dark\">Manual Operacional do DICT</strong> geram um impacto operacional considerável, com reflexos em custos e revisão de processos para todas as instituições:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Revisão de Sistemas e APIs</strong>: O principal trabalho será a adaptação dos sistemas para o novo formato alfanumérico da chave <strong class=\"text-bcb-dark\">CNPJ</strong> e a adequação às novas lógicas dos fluxos de <strong class=\"text-bcb-dark\">MED</strong> e Recuperação de Valores. Isso inclui ajustes nas <strong class=\"text-bcb-dark\">APIs</strong> de integração com o <strong class=\"text-bcb-dark\">DICT</strong>, no tratamento de notificações de infração e na gestão de bloqueios e devoluções, demandando horas de desenvolvimento, testes e homologação.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Fluxos de Fraude e Prevenção</strong>: Os processos internos de análise e tratamento de fraudes precisarão ser profundamente revisados para incorporar as novas regras sobre notificações de infração, recuperação de valores, contestação de devoluções por fraude e os esclarecimentos sobre o valor total a ser bloqueado. Isso implica em retrabalho nas políticas de segurança e no treinamento das equipes de prevenção a fraudes e <strong class=\"text-bcb-dark\">compliance</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Gestão de Chaves e Cadastros</strong>: A validação obrigatória dos dados e situação cadastral do usuário junto à <strong class=\"text-bcb-dark\">Receita Federal</strong> para registro, alteração, portabilidade e reivindicação de chaves exigirá a implementação de novas etapas de verificação, impactando os fluxos de atendimento e os sistemas de onboarding e manutenção cadastral. Há um custo associado à integração e à consulta a essa base de dados, além de processos de exceção para usuários com inconsistências.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Atendimento ao Cliente e Backoffice</strong>: Equipes de atendimento (call center, digital) e backoffice precisarão ser extensivamente treinadas sobre as novas regras, prazos e fluxos do <strong class=\"text-bcb-dark\">MED</strong>, recuperação de valores e validações da <strong class=\"text-bcb-dark\">Receita Federal</strong>. A comunicação clara com o cliente sobre bloqueios judiciais e os motivos de devoluções ou suas contestações será crucial, exigindo a atualização de roteiros e materiais de suporte.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Redução de Monitoramento</strong>: A exclusão da necessidade de monitoramento contínuo da conta em cenários específicos de devolução ou recuperação de valores por fraude pode gerar uma pequena otimização de recursos, mas requer um ajuste cuidadoso dos sistemas de monitoramento para garantir que apenas os casos aplicáveis sejam descontinuados.</li>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">As alterações técnicas, conforme a <strong class=\"text-bcb-dark\">versão 8.4</strong> do <strong class=\"text-bcb-dark\">Manual Operacional do DICT</strong> e revisões anteriores com datas futuras, impactam diretamente o desenvolvimento e a manutenção de sistemas das instituições:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Formato de Chave CNPJ</strong>: A <strong class=\"text-bcb-dark\">Seção 1</strong> determina a alteração do formato da chave <strong class=\"text-bcb-dark\">CNPJ</strong> para um <strong class=\"text-bcb-dark\">padrão alfanumérico</strong>. Isso requer ajustes em todos os sistemas de cadastro, validação e consulta de chaves <strong class=\"text-bcb-dark\">Pix</strong> que interagem com o <strong class=\"text-bcb-dark\">DICT API</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Mecanismo Especial de Devolução (MED) e Recuperação de Valores</strong>: Houve aprimoramentos extensos desde as versões <strong class=\"text-bcb-dark\">8.1 (02/02/2026)</strong>, <strong class=\"text-bcb-dark\">8.2 (11/05/2026)</strong> e <strong class=\"text-bcb-dark\">8.3 (09/06/2026)</strong>, culminando na <strong class=\"text-bcb-dark\">8.4</strong>. Isso inclui:</li><li class=\"text-justify\">Criação de novas seções e renomeação de fluxos relacionados à instauração, rastreamento, priorização, solicitação de bloqueio, análise, devolução, desbloqueio, cancelamento e alteração de Recuperação de Valores (<strong class=\"text-bcb-dark\">Seção 20</strong> e subseções).</li><li class=\"text-justify\">Inclusão do campo `EffectiveRefundedAmount` nos fluxos de solicitação de devolução (<strong class=\"text-bcb-dark\">Seção 17</strong>).</li><li class=\"text-justify\">Exclusão da abertura de notificação de infração via `endpoint` \"Criar Notificação de Infração\" e da razão `refundCancelled` nos campos de devolução (<strong class=\"text-bcb-dark\">Seção 10</strong> e <strong class=\"text-bcb-dark\">17</strong>).</li><li class=\"text-justify\">Renomeação de \"Cancelamento de devolução\" para \"Contestação de transação de devolução por fraude\" (<strong class=\"text-bcb-dark\">Seção 20.1.9</strong>).</li><li class=\"text-justify\">Regras para cancelamento automático de notificações de infração pelo <strong class=\"text-bcb-dark\">DICT</strong> em Recuperações de Valores (<strong class=\"text-bcb-dark\">Seção 20.1.5</strong>).</li><li class=\"text-justify\">Esclarecimentos sobre os tipos de transação <strong class=\"text-bcb-dark\">pacs.004</strong> e de devolução que podem ser contestadas (<strong class=\"text-bcb-dark\">Seção 20.1.1</strong> e <strong class=\"text-bcb-dark\">20.1.9</strong>).</li><li class=\"text-justify\">Correção da obrigatoriedade do campo `TrackingGraphParameters` (<strong class=\"text-bcb-dark\">Seção 20</strong>).</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Validação de Dados da Receita Federal</strong>: Implementação da validação de dados e situação cadastral do usuário junto à <strong class=\"text-bcb-dark\">Receita Federal</strong> para registro e alteração de chaves (<strong class=\"text-bcb-dark\">Seções 3.1, 3.2, 7.1, 7.2</strong>, a partir de <strong class=\"text-bcb-dark\">01/07/2025</strong>) e para portabilidade e reivindicação de posse (<strong class=\"text-bcb-dark\">Seções 5.1, 5.2, 6.1, 6.2</strong>, a partir de <strong class=\"text-bcb-dark\">01/10/2025</strong>). Isso demanda integração com APIs ou serviços da <strong class=\"text-bcb-dark\">Receita Federal</strong> e ajustes na lógica de criação/alteração/portabilidade de chaves.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Notificações de Infração</strong>: Permissão para edição de notificações de infração nos estados \"aberta\" ou \"recebida\" a partir de <strong class=\"text-bcb-dark\">01/10/2025</strong> (<strong class=\"text-bcb-dark\">Seção 10.1</strong>).</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Monitoramento de Contas</strong>: Exclusão da necessidade de monitoramento da conta após devolução parcial ou rejeição de solicitações de devolução com `RefundReason = FRAUD` e para recuperações de valores finalizadas automaticamente (<strong class=\"text-bcb-dark\">Seção 17</strong> e <strong class=\"text-bcb-dark\">20.1.6</strong>).</li><p class=\"mb-4 text-justify\">Embora a norma não mencione especificamente <strong class=\"text-bcb-dark\">CADOCs</strong> afetados, as alterações nos fluxos de transação, fraude e gerenciamento de chaves podem exigir revisões nas informações reportadas em relatórios regulatórios que utilizam dados do <strong class=\"text-bcb-dark\">Pix</strong> e do <strong class=\"text-bcb-dark\">DICT</strong>.</p>\n      </div>","title":"BC - Instrução Normativa BCB N° 752 de 01/07/2026","type":"Instrução Normativa","summary":"A Instrução Normativa BCB Nº 752, de 01/07/2026, é uma atualização fundamental do Manual Operacional do DICT, que integra o Regulamento do Pix. Ela traz a versão 8.4, focando na segurança, na gestão de chaves e nos aprimoramentos do Mecanismo Especial de Devolução (MED). As instituições devem revisar seus sistemas para adaptar-se às novas regras de formato de chave CNPJ, aos fluxos de recuperação de valores e às validações cadastrais junto à Receita Federal, garantindo a conformidade contínua e a robustez do sistema Pix.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=752","tags":["PIX"],"date":"2026-07-01","number":"BCB N° 752","updated_at":"2026-07-01T16:03:23.921Z","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52958.pdf","thumb_v":"v4","isFeatured":false},{"id":"normativos_52957","slug":"resolucao-cmn-5324","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.324, de 30 de junho de 2026</strong>, representa uma atualização substancial do <strong class=\"text-bcb-dark\">Manual de Crédito Rural (MCR)</strong>, promovida pelo <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong>. Esta norma reformula diversas seções cruciais dos Capítulos 2 e 7 do <strong class=\"text-bcb-dark\">MCR</strong>, que tratam das condições básicas, encargos financeiros e limites de crédito para o setor agropecuário. O objetivo é ajustar as políticas de crédito rural às dinâmicas atuais do mercado e às necessidades do campo, impactando diretamente a forma como o crédito é concedido e gerido pelas instituições financeiras.</p><p class=\"mb-4 text-justify\">As alterações abrangem uma vasta gama de programas e linhas de crédito, incluindo modificações nas metodologias de cálculo das Taxas de Juros do Crédito Rural (<strong class=\"text-bcb-dark\">TCR</strong>) e a redefinição de encargos financeiros e limites para financiamentos sem vinculação a programas específicos. Detalhes minuciosos são apresentados em novas tabelas que discriminam taxas (prefixadas e pós-fixadas, muitas vezes com o <strong class=\"text-bcb-dark\">Fator de Atualização Monetária – FAM</strong>) e limites de crédito em <strong class=\"text-bcb-dark\">R$</strong> para custeio, investimento, comercialização e industrialização, considerando diferentes tipos de beneficiários e fontes de recursos, como <strong class=\"text-bcb-dark\">Recursos Obrigatórios</strong> e Poupança Rural.</p><p class=\"mb-4 text-justify\">Além disso, a resolução introduz revisões específicas e detalhadas para programas federais de grande relevância, como o <strong class=\"text-bcb-dark\">Programa Nacional de Apoio ao Médio Produtor Rural – Pronamp</strong>, o Fundo de Defesa da Economia Cafeeira – <strong class=\"text-bcb-dark\">Funcafé</strong>, o Programa Nacional de Fortalecimento da Agricultura Familiar – <strong class=\"text-bcb-dark\">Pronaf</strong>, e os Programas de Investimento Agropecuário – InvestAgro (<strong class=\"text-bcb-dark\">Procap-Agro</strong>, <strong class=\"text-bcb-dark\">Proirriga</strong>, Inovagro, <strong class=\"text-bcb-dark\">Moderfrota</strong>, Prodecoop, RenovAgro e <strong class=\"text-bcb-dark\">PCA</strong>). Para cada um desses programas, a norma especifica novos patamares de juros, bônus de adimplência e limites de financiamento, com vistas a fomentar o desenvolvimento setorial e regional, garantindo maior eficiência e direcionamento dos recursos. A entrada em vigor é imediata, demandando ações rápidas de todas as instituições envolvidas.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">ALTO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">A norma promove alterações profundas em <strong class=\"text-bcb-dark\">taxas de juros</strong>, <strong class=\"text-bcb-dark\">limites de crédito</strong> e condições de elegibilidade em praticamente todas as principais linhas do <strong class=\"text-bcb-dark\">Crédito Rural</strong>. Para as instituições financeiras que operam neste segmento, a complexidade de adaptação é <strong class=\"text-bcb-dark\">alta</strong>, exigindo revisões sistêmicas e operacionais abrangentes e imediatas.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução CMN N° 5.324, de 30 de junho de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Altera diversas Seções e Capítulos do <strong class=\"text-bcb-dark\">Manual de Crédito Rural (MCR)</strong>, notadamente as Seções 4 do Capítulo 2 e as Seções 1, 3, 4, 5, 6 e 7 do Capítulo 7 do <strong class=\"text-bcb-dark\">MCR</strong>. Não revoga normas anteriores, mas atualiza substancialmente o texto normativo existente.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória visa ajustar e modernizar as políticas de <strong class=\"text-bcb-dark\">crédito rural</strong> para alinhar as condições de financiamento às necessidades do setor agropecuário, promovendo o desenvolvimento e a sustentabilidade. As mudanças em <strong class=\"text-bcb-dark\">taxas de juros</strong> e <strong class=\"text-bcb-dark\">limites de crédito</strong> buscam otimizar o fluxo de recursos, incentivar a produção e garantir a estabilidade econômica no campo, respondendo a cenários macroeconômicos e às diretrizes de apoio aos produtores rurais.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5324\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução CMN N° 5.324 de 30/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.324/2026</strong> entra em vigor na data de sua publicação, que é <strong class=\"text-bcb-dark\">30 de junho de 2026</strong>, conforme Art. 8º. Isso impõe um cronograma de adequação <strong class=\"text-bcb-dark\">imediato</strong> para todas as instituições financeiras e cooperativas que operam com <strong class=\"text-bcb-dark\">crédito rural</strong>.</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">A partir de 30 de junho de 2026</strong>: As novas <strong class=\"text-bcb-dark\">taxas de juros</strong>, <strong class=\"text-bcb-dark\">limites de crédito</strong> e condições de elegibilidade para os programas afetados (<strong class=\"text-bcb-dark\">Pronaf</strong>, <strong class=\"text-bcb-dark\">Pronamp</strong>, <strong class=\"text-bcb-dark\">Funcafé</strong>, InvestAgro, entre outros) devem ser aplicados a todas as novas operações de crédito rural e, quando aplicável, às renegociações.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Urgência na Adaptação</strong>: Não há período de transição. As áreas de TI, Produto, Compliance e Negócios devem trabalhar de forma acelerada para implementar as atualizações sistêmicas e processuais, garantindo que as operações estejam em total conformidade desde o primeiro dia de vigência. Qualquer atraso pode resultar em não conformidade e impactos operacionais e regulatórios.</li>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A implementação da <strong class=\"text-bcb-dark\">Resolução CMN N° 5.324/2026</strong> gerará um <strong class=\"text-bcb-dark\">trabalho e custo significativos</strong> para as instituições financeiras com atuação no <strong class=\"text-bcb-dark\">crédito rural</strong>. Os principais impactos operacionais incluem:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Atualização de Sistemas Core</strong>: Necessidade de reconfigurar os sistemas de originação de crédito, gestão de carteira e contabilidade para incorporar as novas <strong class=\"text-bcb-dark\">taxas de juros</strong> (prefixadas e pós-fixadas com <strong class=\"text-bcb-dark\">FAM</strong>), <strong class=\"text-bcb-dark\">fatores de programa</strong>, e os múltiplos <strong class=\"text-bcb-dark\">limites de crédito</strong> para diferentes finalidades e beneficiários.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Revisão de Processos</strong>: Os processos de análise e concessão de crédito, simulação, contratação e acompanhamento precisarão ser revisados para refletir as novas condições do <strong class=\"text-bcb-dark\">MCR</strong>, os bônus de adimplência e as regras de elegibilidade para cada programa (e.g., <strong class=\"text-bcb-dark\">Pronaf</strong>, <strong class=\"text-bcb-dark\">Pronamp</strong>).</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Treinamento de Equipes</strong>: As equipes comerciais, de crédito e de retaguarda deverão ser intensamente treinadas nas novas regras e condições para evitar erros e garantir a correta aplicação da norma.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Documentação e Modelos de Contrato</strong>: Os modelos de contratos, propostas de crédito e termos aditivos deverão ser atualizados para contemplar as novas condições financeiras e cláusulas exigidas.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Gestão de Riscos e Compliance</strong>: As áreas de risco e compliance precisarão monitorar de perto a implementação para assegurar a aderência à norma e mitigar riscos de não conformidade, que podem levar a sanções ou perdas financeiras.</li>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">As modificações na <strong class=\"text-bcb-dark\">Resolução CMN N° 5.324/2026</strong> implicam em <strong class=\"text-bcb-dark\">alterações técnicas significativas</strong> para as instituições financeiras que atuam com <strong class=\"text-bcb-dark\">crédito rural</strong>. Embora a norma não mencione explicitamente <strong class=\"text-bcb-dark\">CADOCs</strong> ou URLs de layout, as atualizações em <strong class=\"text-bcb-dark\">taxas de juros</strong>, <strong class=\"text-bcb-dark\">fatores de programa</strong>, <strong class=\"text-bcb-dark\">limites de crédito</strong> e <strong class=\"text-bcb-dark\">condições adicionais</strong> para diversas finalidades e beneficiários exigirão ajustes nos sistemas de gestão e na base de dados. As tabelas detalhadas da norma (<strong class=\"text-bcb-dark\">MCR</strong> 2-4, <strong class=\"text-bcb-dark\">MCR</strong> 7-1, <strong class=\"text-bcb-dark\">MCR</strong> 7-3, <strong class=\"text-bcb-dark\">MCR</strong> 7-4, <strong class=\"text-bcb-dark\">MCR</strong> 7-5, <strong class=\"text-bcb-dark\">MCR</strong> 7-6 e <strong class=\"text-bcb-dark\">MCR</strong> 7-7) servem como dicionários de dados e regras de negócio. Será necessária a revisão e atualização de:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Tabelas de Domínios</strong>: Para valores de taxas (prefixadas e pós-fixadas, incluindo o <strong class=\"text-bcb-dark\">FAM</strong>), bônus de adimplência, e novos limites em <strong class=\"text-bcb-dark\">R$</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Dicionários de Dados</strong>: Para refletir os novos campos ou regras de validação para a concessão de crédito rural.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Regras de Negócio e Cálculos</strong>: A lógica de cálculo de juros, aplicação de bônus e verificação de limites deve ser reavaliada e implementada nos sistemas.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Sistemas de Originação de Crédito</strong>: Módulos de cadastro e simulação de operações de crédito rural precisarão ser adaptados.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Sistemas de Reporting Regulatório</strong>: Os <strong class=\"text-bcb-dark\">CADOCs</strong> que capturam informações sobre operações de crédito rural (ex: <strong class=\"text-bcb-dark\">CADOC</strong> 4010, <strong class=\"text-bcb-dark\">CADOC</strong> 4111, <strong class=\"text-bcb-dark\">CADOC</strong> 4120 e outros), embora não citados, precisarão ser verificados para garantir que os dados reportados estejam em conformidade com as novas regras de taxas e limites. A falta de menção direta a layouts específicos ou <strong class=\"text-bcb-dark\">CADOCs</strong> implica que as adaptações serão internas, refletindo as mudanças estruturais do <strong class=\"text-bcb-dark\">MCR</strong>.</li>\n      </div>","title":"BC - Resolução CMN N° 5.324 de 30/06/2026","type":"Resolução","summary":"A Resolução CMN N° 5.324/2026 revisa profundamente as regras de crédito rural no Manual de Crédito Rural (MCR), ajustando taxas e limites em programas como Pronaf, Pronamp e Funcafé. As instituições financeiras devem atualizar urgentemente seus sistemas e processos para garantir a conformidade e a correta operacionalização das novas condições, que impactam diretamente o produtor rural e as cooperativas.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5324","tags":[],"date":"2026-06-30","number":"CMN N° 5.324","updated_at":"2026-06-30T23:04:20.517Z","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52957.pdf","thumb_v":"v4","isFeatured":false},{"id":"normativos_52956","slug":"resolucao-cmn-5323","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.323</strong>, de <strong class=\"text-bcb-dark\">30 de junho de 2026</strong>, representa uma atualização significativa no <strong class=\"text-bcb-dark\">Manual de Crédito Rural (MCR)</strong>, com foco exclusivo no Capítulo 10, que rege o <strong class=\"text-bcb-dark\">Programa Nacional de Fortalecimento da Agricultura Familiar (Pronaf)</strong>. Esta norma visa modernizar e desburocratizar o acesso ao crédito para o público do <strong class=\"text-bcb-dark\">Pronaf</strong>, consolidando o <strong class=\"text-bcb-dark\">Cadastro Nacional da Agricultura Familiar (CAF)</strong> como instrumento central de comprovação de elegibilidade. As alterações abrangem desde os critérios para beneficiários e cooperativas até a expansão das finalidades de financiamento e o detalhamento das condições de assistência técnica.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O nível de impacto é <strong class=\"text-bcb-dark\">MÉDIO</strong> devido à abrangência das alterações nas regras do <strong class=\"text-bcb-dark\">Pronaf</strong>, um programa de grande escala e relevância para o crédito rural. Embora não seja uma mudança estrutural de mercado como um novo sistema de pagamentos, exige adaptações significativas nos sistemas e processos internos de todas as <strong class=\"text-bcb-dark\">instituições financeiras</strong> que operam o <strong class=\"text-bcb-dark\">MCR</strong>, impactando diretamente a originação e gestão de operações de crédito rural e demandando revisão de fluxos e treinamentos.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> Resolução <strong class=\"text-bcb-dark\">CMN N° 5.323</strong> de <strong class=\"text-bcb-dark\">30 de junho de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Esta Resolução altera diversas Seções do Capítulo 10 (<strong class=\"text-bcb-dark\">Pronaf</strong>) do <strong class=\"text-bcb-dark\">Manual de Crédito Rural (MCR)</strong>: Seções 1, 2, 3, 5, 6, 8, 9, 10, 12, 13, 14, 16, 17 e 18. Revoga-se a alínea “c” do item 4 da Seção 2 (Beneficiários) do Capítulo 10 (<strong class=\"text-bcb-dark\">Pronaf</strong>) do <strong class=\"text-bcb-dark\">MCR</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória por trás da <strong class=\"text-bcb-dark\">Resolução CMN N° 5.323</strong> é aprimorar e expandir as condições de financiamento para a agricultura familiar brasileira. Busca-se fomentar o desenvolvimento rural sustentável, a agregação de valor, a inovação tecnológica no campo e a inclusão de grupos específicos como mulheres e jovens. A norma visa adequar o <strong class=\"text-bcb-dark\">Pronaf</strong> às demandas atuais do setor, simplificando a comprovação de elegibilidade por meio do <strong class=\"text-bcb-dark\">CAF</strong> e incentivando práticas mais resilientes e produtivas, contribuindo para a segurança alimentar e o fortalecimento do macroambiente econômico agrário.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5323\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução CMN N° 5.323 de 30/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.323</strong> entra em vigor na data de sua publicação, ou seja, <strong class=\"text-bcb-dark\">30 de junho de 2026</strong>. Todas as instituições financeiras autorizadas a operar o <strong class=\"text-bcb-dark\">Pronaf</strong> devem assegurar conformidade imediata com as novas disposições a partir dessa data. Há prazos específicos para condições transitórias: no <strong class=\"text-bcb-dark\">ano agrícola 2026/2027</strong>, será admitida a concessão de crédito de custeio adicional de até <strong class=\"text-bcb-dark\">R$8.000,00</strong> para mulheres enquadradas no <strong class=\"text-bcb-dark\">Grupo 'B'</strong> do <strong class=\"text-bcb-dark\">Pronaf</strong>. Além disso, até <strong class=\"text-bcb-dark\">30 de junho de 2027</strong>, cooperativas singulares de produção agropecuária podem acessar linhas de crédito específicas do <strong class=\"text-bcb-dark\">MCR 10-6</strong>, <strong class=\"text-bcb-dark\">MCR 10-11</strong> e <strong class=\"text-bcb-dark\">MCR 10-12</strong>, sob condições determinadas. A atenção aos prazos é crucial para evitar não conformidade e garantir a elegibilidade para as novas condições de financiamento.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">As <strong class=\"text-bcb-dark\">instituições financeiras</strong> precisarão revisar e atualizar seus processos de originação, análise e acompanhamento de operações de crédito rural do <strong class=\"text-bcb-dark\">Pronaf</strong>. O destaque para o <strong class=\"text-bcb-dark\">Cadastro Nacional da Agricultura Familiar (CAF)</strong> ativo como requisito central exigirá adaptações nos sistemas para validação e cruzamento de dados. As mudanças nas finalidades de crédito, incluindo a possibilidade de financiar veículos de carga, custos de projetos técnicos e estudos de licenciamento ambiental, bem como itens relacionados à conectividade e tecnologia no campo, demandarão ajustes nos roteiros de aplicação e nos modelos de projeto técnico. Os novos limites e percentuais para a orientação técnica, especialmente para empreendimentos de sociobioeconomia ou agroecologia, implicarão em modificações nos cálculos e exigências contratuais. As adaptações para cooperativas e grupos especiais (<strong class=\"text-bcb-dark\">Pronaf Mulher</strong>, <strong class=\"text-bcb-dark\">Pronaf Jovem</strong>, <strong class=\"text-bcb-dark\">Grupo 'B'</strong>) também gerarão trabalho para parametrização de sistemas e treinamento de equipes, representando custos em desenvolvimento de TI, comunicação interna e capacitação.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.323</strong> foca em alterações textuais e conceituais do <strong class=\"text-bcb-dark\">Manual de Crédito Rural (MCR)</strong>, Capítulo 10 (<strong class=\"text-bcb-dark\">Pronaf</strong>). Não há menção explícita de documentos regulatórios específicos como <strong class=\"text-bcb-dark\">CADOCs</strong> que teriam seus layouts diretamente afetados, nem de mudanças em tabelas de domínios, dicionários de dados, tags <strong class=\"text-bcb-dark\">XML</strong> ou protocolos de transmissão. O impacto será na necessidade de adequação dos sistemas internos das instituições financeiras para refletir as novas regras de elegibilidade (validação do <strong class=\"text-bcb-dark\">CAF</strong>), limites de financiamento, finalidades de crédito e condições de assistência técnica, o que pode implicar em modificações nos formulários e parâmetros de originação e registro de operações de crédito rural. Não foram encontradas URLs que indiquem alterações de layout em particular neste documento normativo.</p>\n      </div>","title":"BC - Resolução CMN N° 5.323 de 30/06/2026","type":"Resolução","summary":"A Resolução CMN N° 5.323, publicada em 30/06/2026, é um marco para o Programa Nacional de Fortalecimento da Agricultura Familiar (Pronaf). Ela moderniza e expande as condições de acesso ao crédito rural, simplificando processos e ampliando as possibilidades de investimento para os agricultores familiares. Atenção especial à centralidade do Cadastro Nacional da Agricultura Familiar (CAF) ativo e aos novos limites de financiamento e assistência técnica, essenciais para a conformidade das instituições financeiras.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5323","tags":[],"date":"2026-06-30","number":"CMN N° 5.323","updated_at":"2026-06-30T23:04:20.517Z","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52956.pdf","thumb_v":"v4","isFeatured":false},{"id":"normativos_52955","slug":"resolucao-cmn-5322","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.322 de 30/06/2026</strong>, editada pelo <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong>, promove alterações significativas no <strong class=\"text-bcb-dark\">Manual de Crédito Rural (MCR)</strong>, visando modernizar e ampliar o escopo do financiamento rural no país. As mudanças abrangem desde a expansão dos beneficiários elegíveis, incluindo agora <strong class=\"text-bcb-dark\">povos indígenas</strong> e <strong class=\"text-bcb-dark\">aquicultores de águas da União</strong> sem propriedade rural, até o estabelecimento de condições mais claras para a renegociação de operações de custeio agrícola que não tenham sido objeto de cobertura pelo Proagro ou por modalidade de seguro rural, exigindo a reclassificação para fontes de recursos livres. A norma também detalha novas exigências para o financiamento da atividade pesqueira, como a apresentação do comprovante de inscrição ativa no <strong class=\"text-bcb-dark\">Registro Geral da Atividade Pesqueira (RGP)</strong> e, para embarcações de pesca extrativa, a <strong class=\"text-bcb-dark\">Permissão Prévia de Pesca (PPP)</strong> ou <strong class=\"text-bcb-dark\">Certificado de Registro e Autorização de Embarcação Pesqueira</strong>.</p><p class=\"mb-4 text-justify\">Um ponto central da normativa é o incentivo à <strong class=\"text-bcb-dark\">sustentabilidade</strong> na produção agropecuária. Para o período de <strong class=\"text-bcb-dark\">1º de julho de 2026 a 30 de junho de 2027</strong>, a resolução estabelece uma redução de 0,5 ponto percentual na taxa de juros para operações de custeio contratadas por produtores rurais enquadrados no <strong class=\"text-bcb-dark\">Programa Nacional de Apoio ao Médio Produtor Rural (Pronamp)</strong> e demais produtores que aderirem a programas de atividades produtivas sustentáveis com certificação válida, como o <strong class=\"text-bcb-dark\">Programa de Boas Práticas Agropecuárias do Mapa (BPA-Mapa)</strong>. Adicionalmente, são expandidos os itens financiáveis em programas de investimento como <strong class=\"text-bcb-dark\">Inovagro</strong>, <strong class=\"text-bcb-dark\">Prodecoop</strong> e <strong class=\"text-bcb-dark\">RenovAgro</strong>, priorizando a implantação de sistemas de <strong class=\"text-bcb-dark\">geração e armazenamento de energia renovável</strong> e soluções de eficiência energética.</p><p class=\"mb-4 text-justify\">Por fim, a resolução ajusta as condições de alguns programas específicos, como a permissão para que até 10% da subexigibilidade <strong class=\"text-bcb-dark\">Pronaf</strong> seja cumprida com operações de industrialização e comercialização. O <strong class=\"text-bcb-dark\">Pronamp</strong> agora permite a contratação de crédito de investimento com recursos equalizáveis para aquisição de animais para reprodução ou cria, limitada a 30% do valor total do projeto. As taxas de juros do <strong class=\"text-bcb-dark\">Funcafé</strong> também foram atualizadas para diversas linhas de crédito, impactando diretamente o setor cafeeiro. As instituições financeiras e demais entidades autorizadas pelo <strong class=\"text-bcb-dark\">BCB</strong> deverão revisar profundamente seus processos e sistemas para se adequar a estas importantes diretrizes, que entraram em vigor na data de sua publicação.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O nível de impacto é <strong class=\"text-bcb-dark\">MÉDIO</strong> devido à abrangência das alterações no <strong class=\"text-bcb-dark\">Manual de Crédito Rural (MCR)</strong>, que afetam diversos aspectos do financiamento rural, desde elegibilidade de beneficiários e condições de renegociação até incentivos à sustentabilidade e prazos de financiamento. Embora não seja uma revolução regulatória, exige revisão de políticas de crédito, atualização de sistemas de informação e treinamento de equipes em todas as instituições com carteira de <strong class=\"text-bcb-dark\">Crédito Rural</strong>.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução CMN N° 5.322 de 30/06/2026</strong></p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> A presente resolução altera diversas seções e capítulos do <strong class=\"text-bcb-dark\">Manual de Crédito Rural (MCR)</strong>, incluindo as Seções 2 do Capítulo 1, 1 do Capítulo 2, 2 do Capítulo 3, 3 do Capítulo 4, 2 do Capítulo 6, 1 do Capítulo 8, 1 do Capítulo 9, 4 do Capítulo 11, 6 do Capítulo 11, 7 do Capítulo 11 e 9 do Capítulo 11. Não revoga normas anteriores, mas as modifica.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória reside na necessidade de adaptar o arcabouço do <strong class=\"text-bcb-dark\">Crédito Rural</strong> às novas realidades e prioridades do cenário agropecuário brasileiro. Isso inclui o fomento à <strong class=\"text-bcb-dark\">inclusão financeira</strong> de grupos específicos (como <strong class=\"text-bcb-dark\">povos indígenas</strong> e <strong class=\"text-bcb-dark\">aquicultores</strong>), o estímulo à <strong class=\"text-bcb-dark\">sustentabilidade</strong> e <strong class=\"text-bcb-dark\">boas práticas ambientais</strong> com incentivos de taxas de juros temporários, a modernização das linhas de financiamento de investimento (notadamente em <strong class=\"text-bcb-dark\">energia renovável</strong>), e a otimização da aplicação de recursos em programas estratégicos (<strong class=\"text-bcb-dark\">Pronaf</strong>, <strong class=\"text-bcb-dark\">Pronamp</strong>, <strong class=\"text-bcb-dark\">Funcafé</strong>, <strong class=\"text-bcb-dark\">Inovagro</strong>, <strong class=\"text-bcb-dark\">Prodecoop</strong>, <strong class=\"text-bcb-dark\">RenovAgro</strong>, <strong class=\"text-bcb-dark\">PCA</strong>), buscando maior eficiência e alinhamento com políticas de desenvolvimento rural.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5322\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução CMN N° 5.322 de 30/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.322 de 30/06/2026</strong> entra em vigor na data de sua publicação, ou seja, <strong class=\"text-bcb-dark\">30 de junho de 2026</strong>. Isso significa que todas as alterações no <strong class=\"text-bcb-dark\">Manual de Crédito Rural (MCR)</strong> são aplicáveis imediatamente a partir desta data. Há um prazo específico para a aplicação da redução de 0,5 ponto percentual na taxa de juros para operações de custeio com foco em sustentabilidade, que se estende de <strong class=\"text-bcb-dark\">1º de julho de 2026 a 30 de junho de 2027</strong>. As instituições financeiras devem assegurar que seus sistemas e processos estejam atualizados para refletir todas as novas condições, elegibilidades e cálculos de taxas a partir de <strong class=\"text-bcb-dark\">30 de junho de 2026</strong>, com atenção especial ao período de vigência da taxa de juros promocional para a qual os limites estabelecidos por portaria do Ministério da Fazenda devem ser observados.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A implementação da <strong class=\"text-bcb-dark\">Resolução CMN N° 5.322 de 30/06/2026</strong> demandará um esforço operacional considerável das instituições financeiras. Será necessário revisar e atualizar as políticas de crédito para incorporar os novos beneficiários (<strong class=\"text-bcb-dark\">povos indígenas</strong>, <strong class=\"text-bcb-dark\">aquicultores</strong> sem propriedade rural) e as condições de financiamento, especialmente as exigências documentais para a atividade pesqueira (<strong class=\"text-bcb-dark\">RGP</strong>, <strong class=\"text-bcb-dark\">PPP</strong>, <strong class=\"text-bcb-dark\">Certificado de Registro e Autorização de Embarcação Pesqueira</strong>). Os processos de análise de crédito deverão ser ajustados para considerar a reclassificação de operações de custeio não cobertas por Proagro/seguro rural e a aplicação da taxa de juros reduzida para operações sustentáveis certificadas, o que pode implicar em novos requisitos de verificação de certificações.</p><p class=\"mb-4 text-justify\">Haverá a necessidade de reprogramar sistemas para refletir as novas taxas do <strong class=\"text-bcb-dark\">Funcafé</strong>, os limites de investimento no <strong class=\"text-bcb-dark\">Pronamp</strong> e a flexibilidade da subexigibilidade <strong class=\"text-bcb-dark\">Pronaf</strong>. Além disso, a inclusão de novos itens financiáveis em programas como <strong class=\"text-bcb-dark\">Inovagro</strong>, <strong class=\"text-bcb-dark\">Prodecoop</strong>, <strong class=\"text-bcb-dark\">RenovAgro</strong> e <strong class=\"text-bcb-dark\">PCA</strong>, principalmente relacionados a <strong class=\"text-bcb-dark\">energia renovável</strong> e <strong class=\"text-bcb-dark\">armazenamento</strong>, exigirá a atualização de manuais internos e o treinamento das equipes de originação e análise de crédito. O custo envolverá a adequação de <strong class=\"text-bcb-dark\">sistemas de TI</strong>, o desenvolvimento de novos controles de <strong class=\"text-bcb-dark\">compliance</strong> e a capacitação de pessoal para garantir a conformidade com as novas diretrizes do <strong class=\"text-bcb-dark\">MCR</strong>.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.322 de 30/06/2026</strong> não especifica diretamente alterações em layouts de arquivos ou protocolos de transmissão, nem menciona <strong class=\"text-bcb-dark\">CADOCs</strong> específicos. No entanto, as profundas mudanças nas regras de elegibilidade, condições de financiamento, taxas de juros e itens financiáveis no <strong class=\"text-bcb-dark\">Manual de Crédito Rural (MCR)</strong> implicam a necessidade de revisão e possíveis adaptações nos sistemas de informação das instituições financeiras. Isso pode gerar a necessidade de atualização em dicionários de dados internos e, consequentemente, afetar indiretamente a forma como as informações sobre as operações de <strong class=\"text-bcb-dark\">Crédito Rural</strong> são coletadas e reportadas ao <strong class=\"text-bcb-dark\">BCB</strong> por meio dos documentos regulatórios apropriados (ex: <strong class=\"text-bcb-dark\">CADOCs</strong> relacionados a operações de crédito e fundos de crédito rural, como o <strong class=\"text-bcb-dark\">CADOC 20XX</strong> para operações de crédito ou o <strong class=\"text-bcb-dark\">CADOC 4010</strong> para informações do MCR, caso existam campos específicos para as novas condições ou beneficiários). As instituições devem realizar uma análise interna para identificar quais campos podem ser impactados e se haverá necessidade de adequação de relatórios regulatórios existentes ou de criação de novos.</p>\n      </div>","title":"BC - Resolução CMN N° 5.322 de 30/06/2026","type":"Resolução","summary":"A Resolução CMN N° 5.322 de 30/06/2026 representa um passo importante na atualização do Manual de Crédito Rural (MCR). Ela visa aprimorar a inclusão, fomentar práticas sustentáveis e modernizar o financiamento agrícola e pesqueiro no Brasil. Fique atento às novas regras para beneficiários, condições de renegociação e, especialmente, à redução temporária de juros para produtores que adotam certificações de sustentabilidade e aos incentivos para energia renovável nos programas de investimento.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5322","isFeatured":false,"tags":[],"date":"2026-06-30","number":"CMN N° 5.322","updated_at":"2026-06-30T23:04:20.517Z","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52955.pdf","thumb_v":"v4"},{"id":"normativos_52954","slug":"resolucao-cmn-5321","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN Nº 5.321, de 30 de junho de 2026</strong>, é uma resposta regulatória do <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong> e do <strong class=\"text-bcb-dark\">Conselho Monetário Nacional (CMN)</strong> para mitigar os impactos das enchentes e calamidades que assolaram o <strong class=\"text-bcb-dark\">Rio Grande do Sul</strong> entre <strong class=\"text-bcb-dark\">26 de abril e 31 de julho de 2024</strong>. Esta norma altera o <strong class=\"text-bcb-dark\">Manual de Crédito Rural (MCR)</strong>, especificamente o <strong class=\"text-bcb-dark\">Capítulo 10 (Pronaf)</strong> e o <strong class=\"text-bcb-dark\">Capítulo 11 (InvestAgro)</strong>, para permitir o financiamento de capital de giro em caráter temporário, visando a reestruturação e sustentabilidade de cooperativas agropecuárias afetadas.</p><p class=\"mb-4 text-justify\">Duas novas linhas de crédito temporárias são criadas: uma sob a <strong class=\"text-bcb-dark\">Seção 6 (Crédito de Investimento para Agregação de Renda – Pronaf Agroindústria)</strong> do <strong class=\"text-bcb-dark\">MCR 10-6</strong> e outra sob a <strong class=\"text-bcb-dark\">Seção 2 (Programa de Capitalização de Cooperativas Agropecuárias – Procap-Agro)</strong> do <strong class=\"text-bcb-dark\">MCR 11-2</strong>. Ambas as linhas são destinadas a cooperativas do <strong class=\"text-bcb-dark\">Rio Grande do Sul</strong> que tenham unidades afetadas, demonstrem dificuldades de pagamento em <strong class=\"text-bcb-dark\">2025 e 2026</strong>, e apresentem projetos de reestruturação financeira validados pelo <strong class=\"text-bcb-dark\">Sescoop/RS</strong>. Há requisitos adicionais, como a aprovação dos projetos por, no mínimo, <strong class=\"text-bcb-dark\">50%</strong> do valor dos créditos de outras instituições financeiras credoras com vencimento nos mesmos períodos.</p><p class=\"mb-4 text-justify\">As condições especiais incluem prazos de reembolso de até <strong class=\"text-bcb-dark\">5 anos</strong>, com carência de até <strong class=\"text-bcb-dark\">24 meses</strong>. O limite de crédito para ambas as linhas é de até <strong class=\"text-bcb-dark\">R$90.000.000,00</strong> (noventa milhões de reais) por cooperativa, com um sublimite de <strong class=\"text-bcb-dark\">R$90.000,00</strong> (noventa mil reais) por associado. Os encargos financeiros são de <strong class=\"text-bcb-dark\">8,0% ao ano</strong> para o Pronaf e <strong class=\"text-bcb-dark\">10,0% ao ano</strong> para o Procap-Agro, ambos a serem exigidos inclusive durante a carência, com recursos exclusivamente equalizados. Essas disposições são válidas para contratações <strong class=\"text-bcb-dark\">até 30 de dezembro de 2026</strong>, reforçando o caráter emergencial e transitório da medida.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">BAIXO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto sistêmico é <strong class=\"text-bcb-dark\">BAIXO</strong> pois a norma introduz linhas de crédito de caráter temporário e altamente segmentado. As alterações são específicas para cooperativas agropecuárias em uma região particular (<strong class=\"text-bcb-dark\">Rio Grande do Sul</strong>) afetada por eventos climáticos, operando dentro dos programas de crédito rural já existentes (<strong class=\"text-bcb-dark\">Pronaf</strong> e <strong class=\"text-bcb-dark\">Procap-Agro</strong>). O foco é na reestruturação de um grupo limitado de entidades, sem alterar fundamentalmente as estruturas de risco ou capital do sistema financeiro como um todo.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução CMN Nº 5.321, de 30 de junho de 2026</strong></p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> A presente resolução altera a <strong class=\"text-bcb-dark\">Seção 18 (Normas Transitórias)</strong> do <strong class=\"text-bcb-dark\">Capítulo 10 (Programa Nacional de Fortalecimento da Agricultura Familiar – Pronaf)</strong> e a <strong class=\"text-bcb-dark\">Seção 10 (Normas Transitórias)</strong> do <strong class=\"text-bcb-dark\">Capítulo 11 (Programas de Investimento Agropecuár
