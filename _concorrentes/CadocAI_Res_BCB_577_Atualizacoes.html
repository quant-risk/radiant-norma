lvo elegível para contratar operações de crédito voltadas à inovação e digitalização, financiadas com recursos do Fundo de Amparo ao Trabalhador (<strong class=\"text-bcb-dark\">FAT</strong>) e operadas via repasses do Banco Nacional de Desenvolvimento Econômico e Social (<strong class=\"text-bcb-dark\">BNDES</strong>), sob remuneração da Taxa Referencial (<strong class=\"text-bcb-dark\">TR</strong>).</p><p class=\"mb-4 text-justify\">Nesta atualização, a norma traz uma clareza operacional fundamental: além das pessoas jurídicas de direito privado, passam a ser expressamente elegíveis as pessoas jurídicas de direito público (com exceção da União) e as pessoas físicas ou empresários individuais que atuam diretamente nos setores agropecuário, florestal, pesqueiro e aquícola. Isso abre um novo vetor de originação de crédito subsidiado, permitindo que prefeituras, estados e produtores rurais acelerem suas jornadas de transformação digital com taxas mais competitivas.</p><p class=\"mb-4 text-justify\">Para a alta gestão das <strong class=\"text-bcb-dark\">Instituições Financeiras</strong>, a mensagem é clara: há um novo mercado endereçável para linhas de repasse do <strong class=\"text-bcb-dark\">BNDES</strong>. É imperativo que as diretorias de Crédito, Produtos e *Compliance* revisem suas políticas internas de concessão. A agilidade em parametrizar as esteiras de crédito para acolher essas novas naturezas jurídicas definirá quais instituições vão liderar a oferta de financiamento tecnológico para o agronegócio e para a gestão pública regional no Brasil.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">BAIXO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto tecnológico direto na infraestrutura do Sistema Financeiro Nacional é <strong class=\"text-bcb-dark\">BAIXO</strong>, pois não altera protocolos estruturais do <strong class=\"text-bcb-dark\">BCB</strong> (como o <strong class=\"text-bcb-dark\">Pix</strong> ou Open Finance). A complexidade restringe-se a adequações paramétricas nos sistemas internos de originação de crédito (LOS) para aceitar novos perfis de tomadores nas linhas específicas do <strong class=\"text-bcb-dark\">BNDES</strong>.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução CMN N° 5.306</strong>, de <strong class=\"text-bcb-dark\">20 de maio de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Altera o artigo 2º da <strong class=\"text-bcb-dark\">Resolução CMN nº 5.097</strong>, de <strong class=\"text-bcb-dark\">24 de agosto de 2023</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A principal motivação macroeconômica do <strong class=\"text-bcb-dark\">CMN</strong> e do <strong class=\"text-bcb-dark\">BCB</strong> é democratizar o acesso ao crédito incentivado do <strong class=\"text-bcb-dark\">FAT</strong>. Ao incluir prefeituras, estados e o produtor rural (pessoa física) no ecossistema de financiamento à inovação via <strong class=\"text-bcb-dark\">BNDES</strong>, o regulador busca fomentar a modernização tecnológica, a eficiência da máquina pública regional e a adoção de tecnologias de precisão no agronegócio brasileiro.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5306\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução CMN N° 5.306 de 20/05/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A norma não prevê período de *vacatio legis*. Sua entrada em vigor é imediata, a partir da data de sua publicação no Diário Oficial, ou seja, <strong class=\"text-bcb-dark\">20 de maio de 2026</strong>. Para as áreas de *Compliance* e Negócios, isso significa que as instituições já estão legalmente autorizadas a protocolar pedidos de repasse para os novos perfis de clientes junto ao <strong class=\"text-bcb-dark\">BNDES</strong> a partir desta data. O cronograma interno deve focar em uma *Sprint* rápida de TI e normativos internos para liberar o produto na ponta o mais rápido possível.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A norma gera a necessidade de revisão da <strong class=\"text-bcb-dark\">Política de Crédito</strong> e das matrizes de risco. Os processos de *Onboarding* (KYC/KYB) precisarão ser ajustados para capturar a documentação comprobatória de produtores rurais pessoas físicas e entes públicos interessados nessa linha de inovação. Haverá um custo em horas-homem (HH) das equipes de TI para parametrizar os sistemas e da equipe comercial que precisará ser treinada sobre as novas regras de elegibilidade das linhas do <strong class=\"text-bcb-dark\">FAT/BNDES</strong>, a fim de ofertar o produto corretamente na ponta sem gerar retrabalho nas mesas de análise.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A norma não institui novos manuais de integração, APIs ou schemas XML de envio obrigatório ao <strong class=\"text-bcb-dark\">BCB</strong> de forma direta. No entanto, as equipes de Arquitetura e Engenharia de Software precisam atuar nas <strong class=\"text-bcb-dark\">tabelas de domínios</strong> e <strong class=\"text-bcb-dark\">dicionários de dados</strong> dos sistemas de *Core Banking* e de Originação de Crédito. Será necessário criar ou atualizar os vínculos de regras de negócio (*Business Rules*) que associam as linhas de crédito do <strong class=\"text-bcb-dark\">BNDES</strong> (lastro <strong class=\"text-bcb-dark\">FAT</strong> indexado à <strong class=\"text-bcb-dark\">TR</strong>) aos códigos de natureza jurídica de Entes Públicos Municipais/Estaduais e Pessoas Físicas/Produtores Rurais. Além disso, a parametrização do <strong class=\"text-bcb-dark\">CADOC 3040</strong> do Sistema de Informações de Créditos (<strong class=\"text-bcb-dark\">SCR</strong>) deve ser validada para garantir que as novas operações concedidas a esses públicos sob este programa sejam reportadas com as *tags XML* corretas referentes à modalidade, origem de recursos (<strong class=\"text-bcb-dark\">FAT</strong>) e indexador (<strong class=\"text-bcb-dark\">TR</strong>), evitando rejeições de lotes por inconsistência de regras de elegibilidade na base do regulador.</p>\n      </div>","summary":"A Resolução CMN N° 5.306/2026 atua como um catalisador de crédito, expandindo a elegibilidade para financiamentos de inovação com recursos do FAT repassados ao BNDES. A grande dica é: estruture sua prateleira comercial para capturar imediatamente as demandas de digitalização de entes públicos (exceto a União) e do produtor rural pessoa física, novos alvos diretos desta norma.","updated_at":"2026-05-21T10:11:45.819Z","thumb_v":"v4","isFeatured":false}},"homePosts":null,"homeStats":null,"recentDestaques":[{"slug":"edicao-26-26","label":"22 a 26 | Junho 2026"},{"slug":"edicao-25-26","label":"15 a 19 | Junho 2026"},{"slug":"edicao-24-26","label":"8 a 12 | Junho 2026"},{"slug":"edicao-23-26","label":"1 a 5 | Junho 2026"}],"recentDias":null,"recentMeses":null,"pixPosts":null,"spsavPosts":null,"riscosPosts":null,"openFinancePosts":null,"pixSummary":null,"spsavSummary":null,"slidesFilters":null,"path":"/destaques/edicao-21-26","blogVersion":"v9"}</script>
