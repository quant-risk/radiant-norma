<script id="SERVER_STATE" type="application/json">{"postData":null,"destaqueData":{"id":"edicao-21-26","briefing":{"temas_tags":["Prevenção a Fraudes","Pix","Ativos Virtuais","Apostas Não Autorizadas","Cosif","Cooperativismo de Crédito","Repasses BNDES","ESG","CADOC 2061","CADOC 3040","CADOC 4010","CADOC 4016","CADOC 4040","CADOC 4046"],"pontos_chave":["Atualizar matrizes de risco e integrações de segurança do Pix para identificar e compartilhar indícios de fraude envolvendo ativos virtuais e apostas não autorizadas.","Revisar parametrizações contábeis (Cosif) e dicionários de dados de câmbio para garantir maior granularidade e precisão no envio dos relatórios mensais ao Bacen.","Parametrizar os sistemas de originação de crédito (LOS) para atender às novas regras de repasse do BNDES, mapeando corretamente garantias, indexadores e perfis subsidiados no SCR."]},"slug":"edicao-21-26","stats":{"docs_afetados":7,"alto_impacto":1,"total_normativas":7},"thumb_destaque_G":"https://storage.googleapis.com/cadoc-ai-cloud-storage/thumb_destaques/thumb_destaque_edicao-21-26_G.jpg","timeline_items":[{"impacto":"medio","thumb_cache":"https://storage.googleapis.com/cadoc-ai-cloud-storage/thumbnails/thumb_normativos_52907_v4.jpg","tipo_cache":"Normativa","dica_norma":"Ajuste imediatamente as tags de leiaute nos reportes cambiais para detalhar pagamentos internacionais e recargas de cartões com ativos virtuais, mitigando rejeições sistêmicas.","titulo_cache":"BC - Instrução Normativa BCB N° 736 de 19/05/2026","post_id":"normativos_52907","dia_semana":"Terça-feira, 19/05"},{"impacto":"alto","thumb_cache":"https://storage.googleapis.com/cadoc-ai-cloud-storage/thumbnails/thumb_normativos_52908.jpg","tipo_cache":"Normativa","dica_norma":"Programe a atualização do seu motor de fraudes para identificar e reportar no intercâmbio de dados de fraude do Pix contas ligadas a bets ilegais e corretoras cripto irregulares.","titulo_cache":"BC - Resolução BCB N° 569 de 19/05/2026","post_id":"normativos_52908","dia_semana":"Terça-feira, 19/05"},{"dia_semana":"Terça-feira, 19/05","thumb_cache":"https://storage.googleapis.com/cadoc-ai-cloud-storage/thumbnails/thumb_normativos_52909_v4.jpg","tipo_cache":"Normativa","impacto":"medio","titulo_cache":"BC - Resolução BCB N° 570 de 19/05/2026","post_id":"normativos_52909","dica_norma":"Se sua instituição liquida transações Pix no cooperativismo, ajuste o cálculo do capital regulatório e zere parcelas duplicadas das filiadas no CADOC 2061."},{"thumb_cache":"https://storage.googleapis.com/cadoc-ai-cloud-storage/thumbnails/thumb_normativos_52910.jpg","tipo_cache":"Normativa","impacto":"medio","titulo_cache":"BC - Instrução Normativa BCB N° 737 de 20/05/2026","post_id":"normativos_52910","dica_norma":"Antecipe o mapeamento contábil. Fracione rubricas de auditoria e parametrize os novos níveis de Valor Justo nos CADOCs 4010, 4016, 4040 e 4046 para a data-base de julho de 2026.","dia_semana":"Quarta-feira, 20/05"},{"impacto":"medio","thumb_cache":"https://storage.googleapis.com/cadoc-ai-cloud-storage/thumbnails/thumb_normativos_52911_v4.jpg","tipo_cache":"Normativa","dica_norma":"Habilite seus sistemas de crédito para capturar operações ESG e registrar limites de taxas e financiamento de segurança para mulheres sob repasse do BNDES no CADOC 3040.","titulo_cache":"BC - Resolução CMN N° 5.304 de 20/05/2026","post_id":"normativos_52911","dia_semana":"Quarta-feira, 20/05"},{"dia_semana":"Quarta-feira, 20/05","thumb_cache":"https://storage.googleapis.com/cadoc-ai-cloud-storage/thumbnails/thumb_normativos_52912.jpg","tipo_cache":"Normativa","impacto":"baixo","titulo_cache":"BC - Resolução CMN N° 5.305 de 20/05/2026","post_id":"normativos_52912","dica_norma":"Utilize a base de dados do SCR (CADOC 3040) para reprecificar rapidamente o risco de crédito de companhias aéreas domésticas face às novas dívidas na modalidade bullet."},{"titulo_cache":"BC - Resolução CMN N° 5.306 de 20/05/2026","post_id":"normativos_52913","dica_norma":"Adeque o onboarding e as regras de LOS para estender as linhas do FAT/BNDES a entes públicos estaduais e produtores rurais PF, mapeando o indexador TR no CADOC 3040.","thumb_cache":"https://storage.googleapis.com/cadoc-ai-cloud-storage/thumbnails/thumb_normativos_52913_v4.jpg","tipo_cache":"Normativa","impacto":"baixo","dia_semana":"Quarta-feira, 20/05"}],"periodo_texto":"18 a 22 | Maio 2026","thumb_destaque":"https://storage.googleapis.com/cadoc-ai-cloud-storage/thumb_destaques/thumb_destaque_edicao-21-26.jpg","parecer_agente":"A semana de 18 a 22 de maio de 2026 sinaliza um cerco regulatório direto aos mercados não regulados e emergentes, com foco na blindagem do sistema financeiro tradicional. A Resolução BCB 569 e a Instrução Normativa BCB 736 demonstram que o Banco Central não tolera mais a assimetria informacional envolvendo operações cambiais e transferências via Pix ligadas a ativos virtuais e plataformas de apostas não autorizadas (bets ilegais). Instituições financeiras precisarão acelerar seus investimentos em detecção de fraude e higienização de sua base de chaves Pix para cumprir os rigorosos prazos fatais impostos até o final do ano.\n\nParalelamente, observamos um forte vetor de granularidade contábil e eficiência de capital. Com a IN BCB 737, o regulador exige abertura em nível cirúrgico para a precificação a Valor Justo e despesas de consultoria no Cosif, obrigando os bancos a revisarem o 'de-para' de seus sistemas ERP sob pena de reprovação em múltiplos CADOCs (como 4010 e 4040). Ao mesmo tempo, no ambiente do cooperativismo (Resolução 570), o esforço de capital focado nos serviços do Pix foi consolidado nas centrais liquidantes, aliviando o balanço e otimizando a distribuição de liquidez pelas singulares através da correção algorítmica do CADOC 2061.\n\nPor fim, as Resoluções do CMN trouxeram medidas anticíclicas e direcionadas para destravar a economia via BNDES. As iniciativas focadas em capital de giro emergencial, tecnologia verde para motoristas de aplicativos (com incentivos de gênero notáveis) e ampliação de financiamento à inovação para entidades subnacionais indicam um papel cada vez mais pró-ativo do crédito subsidiado na retomada macroeconômica e transição ESG. O grande desafio dos bancos comerciais residirá na integração parametrizada dessas condições especiais às suas esteiras transacionais e ao seu fluxo natural de submissão do CADOC 3040 (SCR).","criado_em":"2026-05-22T23:32:25.037Z","linkedin_post":"YES","data_postagem_linkedin":"2026-05-25 10:21:26"},"diaData":null,"mesData":null,"anoData":null,"postsMap":{"normativos_52907":{"id":"normativos_52907","slug":"instrucao-normativa-bcb-736","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Instrução Normativa BCB N° 736, de 19 de maio de 2026</strong>, representa um importante ajuste na regulamentação do <strong class=\"text-bcb-dark\">mercado de câmbio</strong> e de <strong class=\"text-bcb-dark\">ativos virtuais</strong> no Brasil. Esta norma tem como objetivo principal alterar a <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 693, de 19 de dezembro de 2025</strong>, que já estabelecia os procedimentos para a remessa de informações ao <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong> (<strong class=\"text-bcb-dark\">BCB</strong>) sobre a prestação de serviços de <strong class=\"text-bcb-dark\">ativos virtuais</strong>, conforme delineado pela <strong class=\"text-bcb-dark\">Resolução BCB nº 521, de 10 de novembro de 2025</strong>.</p><p class=\"mb-4 text-justify\">As alterações introduzidas pela <strong class=\"text-bcb-dark\">IN BCB nº 736/2026</strong> são focadas na ampliação do escopo de informações a serem reportadas. Especificamente, o <strong class=\"text-bcb-dark\">Art. 1º</strong> e o <strong class=\"text-bcb-dark\">Art. 4º</strong> da <strong class=\"text-bcb-dark\">IN BCB nº 693/2025</strong> são modificados para incluir explicitamente a necessidade de reportar dados relacionados a <strong class=\"text-bcb-dark\">\"pagamento ou transferência internacional com ativos virtuais\"</strong>. Além disso, a norma passa a exigir o reporte de informações referentes ao <strong class=\"text-bcb-dark\">\"carregamento ou descarregamento de ativos virtuais em cartão ou outro meio de pagamento eletrônico de uso internacional\"</strong>, solidificando a supervisão sobre a integração de <strong class=\"text-bcb-dark\">criptoativos</strong> com métodos de pagamento tradicionais em transações transfronteiriças.</p><p class=\"mb-4 text-justify\">Com essas modificações, o <strong class=\"text-bcb-dark\">BCB</strong> reforça seu arcabouço regulatório para o <strong class=\"text-bcb-dark\">mercado de ativos virtuais</strong>, buscando maior transparência e controle sobre as operações que envolvem esses ativos, especialmente aquelas com potencial impacto no <strong class=\"text-bcb-dark\">mercado de câmbio</strong> e na estabilidade do <strong class=\"text-bcb-dark\">Sistema Financeiro Nacional</strong>. As instituições autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong> devem, portanto, adaptar seus processos e sistemas para atender às novas exigências de reporte, garantindo a conformidade e a integridade das informações remetidas.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é <strong class=\"text-bcb-dark\">MÉDIO</strong> pois, embora a <strong class=\"text-bcb-dark\">IN BCB nº 736/2026</strong> não crie um novo regime de reporte do zero, ela expande significativamente as categorias de transações com <strong class=\"text-bcb-dark\">ativos virtuais</strong> que devem ser monitoradas e reportadas. Isso exige <strong class=\"text-bcb-dark\">adaptações nos sistemas</strong> e <strong class=\"text-bcb-dark\">processos</strong> das instituições, que deverão capturar e classificar novos tipos de dados, mas dentro de um framework de reporte já existente (<strong class=\"text-bcb-dark\">IN BCB nº 693/2025</strong>). O nível de complexidade é elevado para a implementação dessas novas granularidades, afetando a infraestrutura de dados e a cadeia de valor dos serviços de <strong class=\"text-bcb-dark\">ativos virtuais</strong>.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Instrução Normativa BCB N° 736, de 19 de maio de 2026</strong></p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> A <strong class=\"text-bcb-dark\">Instrução Normativa BCB N° 736/2026</strong> altera a <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 693, de 19 de dezembro de 2025</strong>. A <strong class=\"text-bcb-dark\">IN BCB nº 693/2025</strong> é referenciada pela <strong class=\"text-bcb-dark\">Resolução BCB nº 521, de 10 de novembro de 2025</strong>, que por sua vez, altera a <strong class=\"text-bcb-dark\">Resolução BCB nº 277, de 31 de dezembro de 2022</strong>. O arcabouço regulatório também considera as <strong class=\"text-bcb-dark\">Resoluções BCB ns. 519, 520 e 521</strong>, todas de <strong class=\"text-bcb-dark\">10 de novembro de 2025</strong>, como base para as atribuições do <strong class=\"text-bcb-dark\">BCB</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória por trás da <strong class=\"text-bcb-dark\">IN BCB nº 736/2026</strong> reflete a crescente preocupação do <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong> (<strong class=\"text-bcb-dark\">BCB</strong>) em aprimorar a supervisão sobre o mercado de <strong class=\"text-bcb-dark\">ativos virtuais</strong>, especialmente em suas interfaces com o <strong class=\"text-bcb-dark\">mercado de câmbio</strong> e os <strong class=\"text-bcb-dark\">meios de pagamento internacionais</strong>. A norma busca fechar lacunas de informação e garantir que as operações envolvendo <strong class=\"text-bcb-dark\">criptoativos</strong>, que possuem potencial para afetar a estabilidade financeira e o controle cambial, sejam devidamente reportadas. Essa medida visa fortalecer o <strong class=\"text-bcb-dark\">monitoramento prudencial</strong> e de <strong class=\"text-bcb-dark\">riscos</strong>, além de combater atividades ilícitas, promovendo maior transparência e segurança para o <strong class=\"text-bcb-dark\">Sistema Financeiro Nacional</strong> diante da evolução tecnológica e da popularização dos <strong class=\"text-bcb-dark\">ativos virtuais</strong>.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=736\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Instrução Normativa BCB N° 736 de 19/05/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Instrução Normativa BCB N° 736, de 19 de maio de 2026</strong>, entra em vigor na <strong class=\"text-bcb-dark\">data de sua publicação</strong>. Isso significa que as instituições financeiras e demais entidades autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong> que operam com <strong class=\"text-bcb-dark\">ativos virtuais</strong> devem estar em <strong class=\"text-bcb-dark\">conformidade imediata</strong> com as novas exigências de reporte a partir de <strong class=\"text-bcb-dark\">19 de maio de 2026</strong>. Não há um período de carência explicitamente concedido para a adequação. A <strong class=\"text-bcb-dark\">celeridade</strong> na adaptação dos sistemas e processos é, portanto, essencial para evitar não-conformidades e garantir que as informações sobre as novas categorias de transações comecem a ser reportadas sem interrupções desde a data de vigência.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">IN BCB nº 736/2026</strong> gerará <strong class=\"text-bcb-dark\">trabalho e custo</strong> significativos para as instituições financeiras e demais entidades que atuam com <strong class=\"text-bcb-dark\">ativos virtuais</strong>, especialmente aquelas envolvidas em operações internacionais e integração com <strong class=\"text-bcb-dark\">meios de pagamento</strong>. Os <strong class=\"text-bcb-dark\">processos</strong> que devem ser revisados incluem:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Desenvolvimento e Manutenção de Sistemas</strong>: Necessidade de <strong class=\"text-bcb-dark\">atualizar sistemas</strong> de registro, processamento e remessa de dados para capturar as novas granularidades e categorias de <strong class=\"text-bcb-dark\">transações com ativos virtuais</strong>, como <strong class=\"text-bcb-dark\">pagamentos/transferências internacionais</strong> e operações com <strong class=\"text-bcb-dark\">cartões/meios de pagamento eletrônicos internacionais</strong>. Isso pode envolver <strong class=\"text-bcb-dark\">custos de desenvolvimento e infraestrutura</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Compliance e Risco</strong>: Revisão de políticas e procedimentos de <strong class=\"text-bcb-dark\">Know Your Customer (KYC)</strong>, <strong class=\"text-bcb-dark\">Anti-Lavagem de Dinheiro (AML)</strong> e <strong class=\"text-bcb-dark\">monitoramento de transações</strong> para identificar, classificar e reportar corretamente as novas operações. Aumenta a complexidade na avaliação de <strong class=\"text-bcb-dark\">riscos operacionais e cambiais</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Treinamento de Equipes</strong>: Capacitação das equipes de <strong class=\"text-bcb-dark\">compliance</strong>, operações, TI e áreas de negócio sobre as novas exigências regulatórias e as adaptações nos processos e sistemas.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Validação e Qualidade dos Dados</strong>: Implementação de novos controles para garantir a <strong class=\"text-bcb-dark\">qualidade e integridade</strong> das informações reportadas, evitando erros que poderiam gerar penalidades.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Gestão de Dados</strong>: Aumento do volume de dados a serem armazenados e processados, impactando estratégias de <strong class=\"text-bcb-dark\">gestão de dados</strong> e infraestrutura.</li>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Instrução Normativa BCB N° 736/2026</strong> não especifica diretamente quais documentos regulatórios (<strong class=\"text-bcb-dark\">CADOCs</strong>) ou layouts técnicos são afetados, nem fornece URLs para detalhes de implementação. No entanto, ao alterar o escopo da <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 693/2025</strong>, que estabelece \"procedimentos para a remessa... de informações\", subentende-se que as estruturas de dados e <strong class=\"text-bcb-dark\">CADOCs</strong> utilizados para o reporte de <strong class=\"text-bcb-dark\">ativos virtuais</strong> deverão ser adaptados.</p><p class=\"mb-4 text-justify\">As principais mudanças técnicas implicarão na necessidade de: (i) inclusão de novas classificações ou detalhamentos para <strong class=\"text-bcb-dark\">\"pagamento ou transferência internacional com ativos virtuais\"</strong>; e (ii) introdução de campos para registro de operações de <strong class=\"text-bcb-dark\">\"carregamento ou descarregamento de ativos virtuais em cartão ou outro meio de pagamento eletrônico de uso internacional\"</strong>. Isso pode exigir a criação de novos códigos em <strong class=\"text-bcb-dark\">tabelas de domínios</strong>, a atualização de <strong class=\"text-bcb-dark\">dicionários de dados</strong> para refletir as novas categorias de transações, e possíveis modificações em <strong class=\"text-bcb-dark\">tags XML</strong> ou <strong class=\"text-bcb-dark\">protocolos de transmissão</strong> caso a <strong class=\"text-bcb-dark\">IN BCB nº 693/2025</strong> já faça uso desses formatos para as remessas de informações. As instituições deverão aguardar comunicações adicionais do <strong class=\"text-bcb-dark\">BCB</strong> ou verificar os <strong class=\"text-bcb-dark\">manuais de instruções</strong> dos <strong class=\"text-bcb-dark\">CADOCs</strong> para obter as especificações técnicas detalhadas, que deverão ser publicadas em breve.</p>\n      </div>","title":"BC - Instrução Normativa BCB N° 736 de 19/05/2026","type":"Instrução Normativa","summary":"A IN BCB nº 736, de 19 de maio de 2026, é crucial para instituições que operam com ativos virtuais. Ela expande os requisitos de reporte ao Banco Central do Brasil (BCB), focando em pagamentos e transferências internacionais com esses ativos, e no carregamento/descarregamento em meios de pagamento eletrônicos de uso internacional. Garanta que seus sistemas de compliance e reporte estejam atualizados para cobrir essas novas categorias de transações. A conformidade imediata é essencial.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=736","isFeatured":false,"tags":["SPSAV"],"date":"2026-05-19","number":"BCB N° 736","updated_at":"2026-05-19T22:02:37.304Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52907.pdf","NR_GCS":"https://storage.googleapis.com/cadoc-ai-storage-private/NR_compiladas/NR_normativos_52907.pdf","url_spotify":"https://open.spotify.com/episode/68ekPTHTQ7gTPdDuoiWbwh"},"normativos_52908":{"id":"normativos_52908","slug":"resolucao-bcb-569","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB N° 569, de 19 de maio de 2026</strong>, emitida pela Diretoria Colegiada do <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong> (<strong class=\"text-bcb-dark\">BCB</strong>), promove alterações significativas na <strong class=\"text-bcb-dark\">Resolução BCB nº 343, de 4 de outubro de 2023</strong>, que regulamenta o compartilhamento de dados e informações sobre indícios de fraudes entre instituições financeiras e demais entidades autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong>. Esta medida visa aprimorar o arcabouço regulatório existente, fortalecendo as defesas do sistema financeiro nacional contra atividades ilícitas, lavagem de dinheiro e financiamento ao terrorismo, em consonância com as diretrizes da <strong class=\"text-bcb-dark\">Resolução Conjunta nº 6, de 23 de maio de 2023</strong>.</p><p class=\"mb-4 text-justify\">As modificações introduzidas pela nova resolução ampliam o rol de situações que exigem o compartilhamento de informações sobre indícios de fraude. Especificamente, a norma passa a incluir explicitamente a prestação de serviços de <strong class=\"text-bcb-dark\">ativos virtuais</strong> e, de forma crucial, a prestação de serviços financeiros e de pagamentos a pessoas naturais ou jurídicas que atuam como <strong class=\"text-bcb-dark\">operadoras de apostas não autorizadas</strong>, conforme o <strong class=\"text-bcb-dark\">Art. 24-A, caput, inciso I, da Lei nº 14.790, de 29 de dezembro de 2023</strong>. Essa expansão reflete a necessidade de adaptar as regulamentações à evolução dos mercados e aos novos vetores de risco.</p><p class=\"mb-4 text-justify\">Para garantir a conformidade, todas as instituições abrangidas pela <strong class=\"text-bcb-dark\">Resolução BCB nº 343</strong> deverão implementar as medidas necessárias para se adequar às novas disposições. Os prazos estabelecidos para essa adequação são: até <strong class=\"text-bcb-dark\">30 de outubro de 2026</strong> para as atividades de serviços de <strong class=\"text-bcb-dark\">ativos virtuais</strong> e até <strong class=\"text-bcb-dark\">1º de dezembro de 2026</strong> para as atividades relacionadas a <strong class=\"text-bcb-dark\">operadoras de apostas não autorizadas</strong>. Essas datas impõem um cronograma apertado e exigem que as instituições revisem e adaptem seus processos, sistemas e controles internos de forma célere e eficaz.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">ALTO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O nível de impacto é <strong class=\"text-bcb-dark\">ALTO</strong> devido à abrangência das alterações e à complexidade dos novos escopos regulados. A inclusão de transações com <strong class=\"text-bcb-dark\">ativos virtuais</strong> e, principalmente, com <strong class=\"text-bcb-dark\">operadoras de apostas não autorizadas</strong>, exige um aprofundamento na capacidade de monitoramento, identificação e reporte de fraudes para todas as instituições. Isso demanda investimentos em tecnologia, revisão de políticas de <strong class=\"text-bcb-dark\">KYC</strong> e <strong class=\"text-bcb-dark\">AML/CFT</strong>, e treinamentos, impactando o risco operacional e de conformidade em todo o sistema financeiro.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução BCB N° 569, de 19 de maio de 2026</strong></p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Altera a <strong class=\"text-bcb-dark\">Resolução BCB nº 343, de 4 de outubro de 2023</strong>. Fundamenta-se no <strong class=\"text-bcb-dark\">Art. 9º da Resolução Conjunta nº 6, de 23 de maio de 2023</strong>, e no <strong class=\"text-bcb-dark\">Art. 24-A da Lei nº 14.790, de 29 de dezembro de 2023</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória reside na necessidade de fortalecer as defesas do sistema financeiro nacional contra crimes financeiros, como fraude, lavagem de dinheiro e financiamento ao terrorismo. A inclusão de <strong class=\"text-bcb-dark\">ativos virtuais</strong> responde à evolução tecnológica e à emergência de novos canais de transação. Já a inclusão de <strong class=\"text-bcb-dark\">operadoras de apostas não autorizadas</strong> visa coibir a utilização do sistema financeiro para atividades ilegais em um contexto de regulamentação do mercado de apostas, alinhando a prevenção de fraudes à necessidade de manter a integridade e estabilidade do cenário macroeconômico e prudencial.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=569\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução BCB N° 569 de 19/05/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">As instituições mencionadas no <strong class=\"text-bcb-dark\">Art. 1º</strong> da <strong class=\"text-bcb-dark\">Resolução BCB nº 343</strong> devem implementar as medidas necessárias ao cumprimento do disposto na nova resolução de acordo com o seguinte cronograma:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Até 30 de outubro de 2026</strong>: Para a atividade de prestação de serviços de <strong class=\"text-bcb-dark\">ativos virtuais</strong>, conforme o <strong class=\"text-bcb-dark\">Art. 2º, caput, inciso V</strong> da <strong class=\"text-bcb-dark\">Resolução BCB nº 343</strong> (alterada).</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Até 1º de dezembro de 2026</strong>: Para a atividade de prestação de serviços financeiros e de pagamentos a pessoas naturais ou jurídicas como <strong class=\"text-bcb-dark\">operadoras de apostas não autorizadas</strong>, conforme o <strong class=\"text-bcb-dark\">Art. 2º, caput, inciso VI</strong> da <strong class=\"text-bcb-dark\">Resolução BCB nº 343</strong> (alterada).</li><p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB N° 569</strong> entrou em vigor na data de sua publicação, em <strong class=\"text-bcb-dark\">19 de maio de 2026</strong>, iniciando o período de adequação para as instituições.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A implementação desta norma gerará trabalho e custos significativos para as instituições financeiras e demais entidades reguladas. Operacionalmente, os principais processos que devem ser revisados incluem:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Monitoramento de Transações e Detecção de Fraudes</strong>: Os sistemas de detecção de fraudes precisarão ser aprimorados e reconfigurados para identificar padrões, perfis e transações atípicas associadas a serviços de <strong class=\"text-bcb-dark\">ativos virtuais</strong> e, de forma crítica, transações com <strong class=\"text-bcb-dark\">operadoras de apostas não autorizadas</strong>. Isso demandará o desenvolvimento de novas regras de negócio e algoritmos.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Processos de Conheça Seu Cliente (</strong>KYC<strong class=\"text-bcb-dark\">) e Due Diligence</strong>: Será necessário revisar os procedimentos de <strong class=\"text-bcb-dark\">onboarding</strong> e <strong class=\"text-bcb-dark\">due diligence</strong> para incluir a identificação e avaliação de riscos relacionados à atuação de clientes como prestadores de serviços de <strong class=\"text-bcb-dark\">ativos virtuais</strong> ou como <strong class=\"text-bcb-dark\">operadoras de apostas</strong> (e a verificação de sua autorização).</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Fluxos de Reporte e Compartilhamento de Informações</strong>: Os processos internos de registro, análise e compartilhamento de indícios de fraude deverão ser adaptados para contemplar as novas categorias, exigindo integração com os canais de comunicação estabelecidos com outras instituições e com o <strong class=\"text-bcb-dark\">BCB</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Treinamento e Capacitação</strong>: As equipes de <strong class=\"text-bcb-dark\">compliance</strong>, risco, segurança e operações deverão receber treinamento aprofundado sobre as novas diretrizes, tipologias de fraude em <strong class=\"text-bcb-dark\">ativos virtuais</strong> e <strong class=\"text-bcb-dark\">apostas não autorizadas</strong>, e sobre os procedimentos revisados, gerando custos com desenvolvimento de pessoal e consultoria.</li>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB N° 569</strong>, por si só, não detalha alterações diretas em layouts de documentos regulatórios específicos (<strong class=\"text-bcb-dark\">CADOCs</strong>), tabelas de domínios ou dicionários de dados. No entanto, ao expandir o escopo de dados e informações sobre indícios de fraudes, a norma implicitamente exigirá adaptações significativas nos sistemas internos das instituições para a identificação, classificação e registro dessas novas categorias de fraude. É esperado que futuras atualizações ou orientações do <strong class=\"text-bcb-dark\">BCB</strong> detalhem as mudanças técnicas necessárias em <strong class=\"text-bcb-dark\">CADOCs</strong> relacionados ao reporte de informações de segurança e combate à fraude, bem como em eventuais especificações para o compartilhamento de dados via <strong class=\"text-bcb-dark\">APIs</strong> ou outros protocolos. As instituições devem antecipar a necessidade de adequar seus modelos de dados para incorporar identificadores de transações envolvendo serviços de <strong class=\"text-bcb-dark\">ativos virtuais</strong> e <strong class=\"text-bcb-dark\">operadoras de apostas não autorizadas</strong>.</p>\n      </div>","title":"BC - Resolução BCB N° 569 de 19/05/2026","type":"Resolução","summary":"A Resolução BCB N° 569, de 19 de maio de 2026, expande o escopo de dados a serem compartilhados sobre indícios de fraude. As principais inclusões são as transações envolvendo serviços de ativos virtuais e a prestação de serviços financeiros a operadoras de apostas não autorizadas. Instituições financeiras e de pagamentos devem se adequar aos novos requisitos para combate à lavagem de dinheiro e financiamento ao terrorismo, com prazos até outubro e dezembro de 2026.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=569","tags":[],"date":"2026-05-19","number":"BCB N° 569","updated_at":"2026-05-19T22:02:37.304Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52908.pdf","NR_GCS":"https://storage.googleapis.com/cadoc-ai-storage-private/NR_compiladas/NR_normativos_52908.pdf","isFeatured":false},"normativos_52909":{"id":"normativos_52909","slug":"resolucao-bcb-570","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB nº 570, de 19 de maio de 2026</strong>, representa um aprimoramento na regulamentação de capital mínimo para o setor financeiro brasileiro, com foco particular nas cooperativas de crédito. Esta norma altera pontualmente a <strong class=\"text-bcb-dark\">Resolução BCB nº 517, de 3 de novembro de 2025</strong>, que estabelece os procedimentos para a apuração do limite mínimo de capital social integralizado e de patrimônio líquido que as instituições financeiras e demais entidades autorizadas pelo <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong> devem observar.</p><p class=\"mb-4 text-justify\">O principal ajuste introduzido pela <strong class=\"text-bcb-dark\">Resolução BCB nº 570/2026</strong> reside na explicitação de que os serviços de liquidação no âmbito do <strong class=\"text-bcb-dark\">Pix</strong> devem ser considerados no cálculo dos requisitos adicionais de capital para as confederações de crédito (em sistemas de três níveis) e cooperativas centrais de crédito (em sistemas de dois níveis). A norma também esclarece a aplicação desses requisitos para as cooperativas de crédito integrantes de sistemas de dois ou três níveis, direcionando a aplicação do adicional de serviço especificamente para o novo inciso V.</p><p class=\"mb-4 text-justify\">Em essência, a alteração visa aprimorar a avaliação de risco e a adequação de capital das cooperativas, reconhecendo a crescente relevância e o potencial impacto sistêmico dos serviços de liquidação do <strong class=\"text-bcb-dark\">Pix</strong>. As mudanças garantem que a estrutura de capital dessas instituições reflita de forma mais precisa os riscos operacionais e de liquidez associados à sua participação ativa no sistema de pagamentos instantâneo, promovendo assim maior estabilidade e segurança para todo o ecossistema financeiro.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é <strong class=\"text-bcb-dark\">MÉDIO</strong>, pois a norma ajusta requisitos de capital prudencial especificamente para cooperativas de crédito, incluindo explicitamente a consideração dos serviços de liquidação do <strong class=\"text-bcb-dark\">Pix</strong>. Embora não altere fundamentalmente a estrutura de capital para todas as instituições, a clarificação para o ecossistema cooperativo e a menção direta ao <strong class=\"text-bcb-dark\">Pix</strong>, um sistema de pagamentos de alta relevância sistêmica, exigem atenção e potenciais reavaliações de riscos e adequação de capital para as entidades afetadas.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução BCB N° 570, de 19 de maio de 2026</strong></p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Altera a <strong class=\"text-bcb-dark\">Resolução BCB nº 517, de 3 de novembro de 2025</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória visa aprimorar a estrutura prudencial do sistema financeiro, garantindo que as instituições financeiras, em particular as cooperativas de crédito, mantenham capital adequado para suportar os riscos inerentes às suas operações. A inclusão explícita dos serviços de liquidação no âmbito do <strong class=\"text-bcb-dark\">Pix</strong> reflete a crescente relevância e o volume transacional do sistema de pagamentos instantâneos, exigindo uma calibragem precisa dos requisitos de capital para cobrir os riscos operacionais e de liquidez associados a essa atividade essencial, promovendo a estabilidade e a solidez do segmento cooperativo.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=570\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução BCB N° 570 de 19/05/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB nº 570, de 19 de maio de 2026</strong>, entra em vigor na data de sua publicação, ou seja, em <strong class=\"text-bcb-dark\">19 de maio de 2026</strong>. Isso significa que as instituições financeiras e demais instituições autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong>, especialmente as cooperativas de crédito e suas centrais/confederações, devem aplicar imediatamente os novos critérios para a apuração do limite mínimo de capital social integralizado e de patrimônio líquido a partir desta data. Não há um cronograma escalonado; a adequação deve ser implementada de forma contínua a partir da entrada em vigor da norma.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A norma exige que as instituições financeiras, notadamente as cooperativas de crédito e seus sistemas (centrais e confederações), revisem suas metodologias internas de apuração de capital social integralizado e patrimônio líquido. Os processos de gestão de risco e compliance deverão ser atualizados para incorporar os novos parâmetros, especialmente no que tange à avaliação dos serviços de liquidação no âmbito do <strong class=\"text-bcb-dark\">Pix</strong>. Isso pode gerar custos com adaptações em sistemas de cálculo prudencial, treinamento de equipes e, eventualmente, a necessidade de adequar os níveis de capital para atender aos novos requisitos, impactando o planejamento financeiro e estratégico das cooperativas. A revisão de políticas e procedimentos internos é mandatória para garantir a conformidade.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB nº 570/2026</strong> não detalha alterações diretas em layouts de documentos regulatórios específicos como os <strong class=\"text-bcb-dark\">CADOCs</strong>. A norma foca na revisão dos critérios de apuração do limite mínimo de capital social e patrimônio líquido, especialmente para cooperativas de crédito. Quaisquer reflexos em <strong class=\"text-bcb-dark\">CADOCs</strong> relacionados a capital (como o <strong class=\"text-bcb-dark\">CADOC 4016</strong> ou outros relatórios de Basileia) seriam consequência indireta da aplicação dos novos critérios de cálculo, exigindo revisão interna dos parâmetros das instituições, mas não uma mudança de *layout* por esta norma isoladamente. Não há indicação de alterações em tabelas de domínios, dicionários de dados, tags <strong class=\"text-bcb-dark\">XML</strong> ou protocolos de transmissão diretamente nesta Resolução.</p>\n      </div>","title":"BC - Resolução BCB N° 570 de 19/05/2026","type":"Resolução","summary":"A Resolução BCB nº 570/2026 ajusta as regras de capital mínimo para cooperativas de crédito, enfatizando a necessidade de considerar a prestação de serviços de liquidação no âmbito do Pix. Atente-se à Resolução BCB nº 517/2025 para o contexto completo dos procedimentos de apuração de capital social e patrimônio líquido. Esta medida visa fortalecer a solidez e a prudência no segmento cooperativo.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=570","tags":[],"date":"2026-05-19","number":"BCB N° 570","updated_at":"2026-05-19T22:02:37.304Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52909.pdf","NR_GCS":"https://storage.googleapis.com/cadoc-ai-storage-private/NR_compiladas/NR_normativos_52909.pdf","isFeatured":false},"normativos_52910":{"id":"normativos_52910","slug":"instrucao-normativa-bcb-737","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 737</strong>, publicada em <strong class=\"text-bcb-dark\">20 de maio de 2026</strong>, promove ajustes cirúrgicos no Padrão Contábil das Instituições Reguladas pelo <strong class=\"text-bcb-dark\">Banco Central do Brasil (Cosif)</strong>. O objetivo regulatório é aprimorar a qualidade e a granularidade das informações financeiras submetidas ao regulador, facilitando o monitoramento contínuo e a análise prudencial conduzida pela <strong class=\"text-bcb-dark\">Diretoria de Fiscalização</strong> do <strong class=\"text-bcb-dark\">BCB</strong>.</p><p class=\"mb-4 text-justify\">A norma exige mobilização das áreas de Controladoria, Finanças e TI, pois introduz o detalhamento minucioso de rubricas relacionadas a <strong class=\"text-bcb-dark\">Despesas com Auditoria, Asseguração e Consultoria</strong> (separando escopos como auditoria cooperativa e relatórios de sustentabilidade). Adicionalmente, ajusta a contabilização de <strong class=\"text-bcb-dark\">Mercados Futuros</strong>, <strong class=\"text-bcb-dark\">Ativos Fiscais Diferidos</strong> originados pela <strong class=\"text-bcb-dark\">Lei nº 14.467/2022</strong>, abertura de níveis de <strong class=\"text-bcb-dark\">Valor Justo (Nível 1, 2 e 3)</strong> e elimina rubricas que se tornaram obsoletas para o segmento de cooperativas de crédito.</p><p class=\"mb-4 text-justify\">Para a alta gestão, este movimento do <strong class=\"text-bcb-dark\">BCB</strong> sinaliza um escrutínio mais agudo sobre despesas acessórias e integridade patrimonial das instituições autorizadas. A transição não é meramente sistêmica, mas sim uma mudança de governança de dados, exigindo um esforço transversal para garantir total <strong class=\"text-bcb-dark\">Compliance</strong> no envio dos relatórios regulatórios oficiais a partir da data-base de <strong class=\"text-bcb-dark\">julho de 2026</strong>.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é <strong class=\"text-bcb-dark\">MÉDIO</strong> pois, embora não altere as regras de cálculo de capital (Basileia), exige um mapeamento rigoroso no plano de contas interno (Sistemas Core/ERP) para refletir os novos códigos do <strong class=\"text-bcb-dark\">Cosif</strong>. A maior complexidade sistêmica reside na reclassificação retroativa de saldos e na granularidade inédita exigida para a captura de despesas de auditoria e categorização de <strong class=\"text-bcb-dark\">Valor Justo</strong>.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 737</strong>, de <strong class=\"text-bcb-dark\">20 de maio de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Altera e revoga dispositivos das <strong class=\"text-bcb-dark\">Instruções Normativas BCB ns. 426, 428, 429, 430, 431, 432 e 433</strong>, todas de <strong class=\"text-bcb-dark\">1º de dezembro de 2023</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação do <strong class=\"text-bcb-dark\">BCB</strong> foca na preservação da higidez do Sistema Financeiro Nacional. O regulador busca aprimorar o monitoramento prudencial, exigindo total transparência em despesas sensíveis e atualizando o arcabouço contábil para refletir exigências recentes da <strong class=\"text-bcb-dark\">Receita Federal</strong> (perdas recuperadas) e padronizações internacionais de precificação a <strong class=\"text-bcb-dark\">Valor Justo</strong>.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=737\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Instrução Normativa BCB N° 737 de 20/05/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A norma entra em vigor oficialmente em <strong class=\"text-bcb-dark\">1º de julho de 2026</strong>. O <strong class=\"text-bcb-dark\">Compliance</strong> regulatório será exigido já na elaboração dos documentos contábeis referentes à <strong class=\"text-bcb-dark\">data-base de julho de 2026</strong> (cujo envio ao <strong class=\"text-bcb-dark\">BCB</strong> ocorre em agosto). A regra de transição mais crítica determina que, logo na virada para esta data-base, a instituição tem a obrigação de realizar a <strong class=\"text-bcb-dark\">reclassificação contábil</strong> de eventuais saldos que estavam agrupados em contas genéricas para as novas rubricas granulares criadas por esta norma.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A normativa gera esforço operacional direto para as células de <strong class=\"text-bcb-dark\">Contabilidade</strong>, <strong class=\"text-bcb-dark\">Controladoria</strong>, <strong class=\"text-bcb-dark\">TI</strong> e <strong class=\"text-bcb-dark\">Reporte Regulatório</strong>. O custo oculto da adequação está na revisão de processos operacionais: a área de Compras/Suprimentos e Contas a Pagar deverá classificar as notas fiscais de serviços com alta precisão (separando o que é auditoria financeira do que é asseguração de tecnologia ou <strong class=\"text-bcb-dark\">ESG</strong>), para que o dado chegue mastigado ao ERP e, consequentemente, ao <strong class=\"text-bcb-dark\">CADOC</strong>. Haverá consumo de horas (OPEX) para o mapeamento 'de-para' e testes de homologação dos relatórios.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">As equipes de TI e Sustentação devem atualizar as tabelas de domínio e os dicionários de dados dos módulos contábeis. As alterações impactam a geração e validação de tags XML dos <strong class=\"text-bcb-dark\">CADOCs</strong> contábeis, especificamente os documentos <strong class=\"text-bcb-dark\">4010 (Balancete Patrimonial)</strong>, <strong class=\"text-bcb-dark\">4016 (Balancete Patrimonial - Conglomerado Prudencial)</strong> e <strong class=\"text-bcb-dark\">4040/4046 (Estatística Bancária - Estban)</strong>. É necessário habilitar os novos identificadores para os três níveis de <strong class=\"text-bcb-dark\">Valor Justo (3.2.4.30.99.10-5, 30.99.20-8 e 30.99.30-1)</strong>, segregar a <strong class=\"text-bcb-dark\">Participação de Não Controladores (6.4.1.10.x)</strong> e implementar a nova árvore do grupo <strong class=\"text-bcb-dark\">8.1.7.62 (Auditoria e Asseguração)</strong>. Além da criação, deve-se aplicar o encerramento sistêmico das contas revogadas de captação de municípios (ex: <strong class=\"text-bcb-dark\">3.0.9.13.00.00-8</strong> e <strong class=\"text-bcb-dark\">9.0.9.13.00.00-2</strong>). Não há alteração no protocolo de transmissão via mensageria do <strong class=\"text-bcb-dark\">BCB</strong>, apenas atualização do esquema de validação contábil.</p>\n      </div>","title":"BC - Instrução Normativa BCB N° 737 de 20/05/2026","type":"Instrução Normativa","summary":"A IN BCB nº 737/2026 traz uma atualização crítica na estrutura do Cosif, exigindo maior granularidade contábil. A dica de ouro é iniciar imediatamente o mapeamento de contas (de-para), com atenção especial ao fracionamento das despesas de auditoria e consultoria (incluindo tecnologia e sustentabilidade), garantindo a reclassificação de saldos exigida para julho de 2026.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=737","tags":[],"date":"2026-05-20","number":"BCB N° 737","updated_at":"2026-05-20T19:03:05.878Z","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52910.pdf","thumb_v":"v4","NR_GCS":"https://storage.googleapis.com/cadoc-ai-storage-private/NR_compiladas/NR_normativos_52910.pdf","isFeatured":false},"normativos_52911":{"id":"normativos_52911","slug":"resolucao-cmn-5304","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.304</strong>, publicada em <strong class=\"text-bcb-dark\">20 de maio de 2026</strong>, regulamenta uma nova linha de crédito estruturada pelo <strong class=\"text-bcb-dark\">Conselho Monetário Nacional (CMN)</strong>. O objetivo central é viabilizar o financiamento de <strong class=\"text-bcb-dark\">veículos automotores novos</strong> que atendam a rígidos critérios de <strong class=\"text-bcb-dark\">sustentabilidade ambiental, social e econômica</strong>. O público-alvo abrange motoristas de aplicativos, taxistas e cooperativas de táxi. Trata-se de uma regulamentação que dá tração operacional à <strong class=\"text-bcb-dark\">Medida Provisória nº 1.359</strong>, de <strong class=\"text-bcb-dark\">19 de maio de 2026</strong>.</p><p class=\"mb-4 text-justify\">As condições financeiras estabelecidas são altamente competitivas e segmentadas, exigindo atenção na originação de crédito. O custo da fonte principal de recursos é fixado em <strong class=\"text-bcb-dark\">2,5% a.a.</strong>, com uma expressiva redução para <strong class=\"text-bcb-dark\">1,5% a.a.</strong> quando o tomador final for mulher. Além disso, a arquitetura de precificação permite que as instituições financeiras credenciadas cobrem um spread de até <strong class=\"text-bcb-dark\">8,5% a.a.</strong>, somado à taxa de repasse do <strong class=\"text-bcb-dark\">BNDES</strong> de até <strong class=\"text-bcb-dark\">1,25% a.a.</strong>. O teto nominal do financiamento é de <strong class=\"text-bcb-dark\">R$ 150.000,00</strong>, com prazos de amortização alongados de até <strong class=\"text-bcb-dark\">72 meses</strong>, contemplando carência de até <strong class=\"text-bcb-dark\">6 meses</strong> para o principal (sendo expressamente vedada a capitalização de juros nesse período).</p><p class=\"mb-4 text-justify\">Para as instituições autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong>, a norma representa uma excelente alavanca comercial para a expansão de carteiras vinculadas à <strong class=\"text-bcb-dark\">agenda ESG</strong>. Contudo, o <strong class=\"text-bcb-dark\">risco de crédito</strong> é transferido integralmente para a instituição repassadora. O pacote financiável foi estruturado de forma holística: além do veículo, permite incluir seguros associados (auto e prestamista), a tarifa do programa de garantias (<strong class=\"text-bcb-dark\">Peac-FGI</strong>) e itens de segurança exclusivos para mulheres motoristas, desde que limitados a <strong class=\"text-bcb-dark\">10%</strong> do valor total da operação.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é <strong class=\"text-bcb-dark\">MÉDIO</strong>, pois exige que as <strong class=\"text-bcb-dark\">instituições financeiras</strong> credenciadas ao <strong class=\"text-bcb-dark\">BNDES</strong> parametrizem novos produtos de crédito em seus sistemas, implantem travas algorítmicas (teto de valor, teto de prazo, taxas subsidiadas condicionadas ao gênero) e estruturem a integração da esteira com o fundo garantidor <strong class=\"text-bcb-dark\">Peac-FGI</strong>.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução CMN N° 5.304</strong>, de <strong class=\"text-bcb-dark\">20 de maio de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Não altera nem revoga normativas anteriores do <strong class=\"text-bcb-dark\">BCB</strong> diretamente; ela atua como a regulamentação primária e operacional do <strong class=\"text-bcb-dark\">art. 2º</strong> da recém-editada <strong class=\"text-bcb-dark\">Medida Provisória nº 1.359</strong>, de <strong class=\"text-bcb-dark\">19 de maio de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação prudencial e macroeconômica é dupla: estimular a renovação da frota nacional de transporte de passageiros sob o prisma da <strong class=\"text-bcb-dark\">sustentabilidade (ESG)</strong> e promover a <strong class=\"text-bcb-dark\">inclusão produtiva</strong>. A redução de juros para mulheres busca corrigir assimetrias de gênero no mercado de trabalho, enquanto o uso do <strong class=\"text-bcb-dark\">Peac-FGI</strong> visa mitigar o risco sistêmico para os bancos repassadores.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5304\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução CMN N° 5.304 de 20/05/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">O relógio de <strong class=\"text-bcb-dark\">Compliance</strong> já está correndo: a resolução entra em vigor imediatamente, em <strong class=\"text-bcb-dark\">20 de maio de 2026</strong>. Instituições que desejam surfar esta onda comercial devem aprovar os manuais de crédito e atualizar os sistemas o mais rápido possível. Atenção ao prazo limite de concessão: a possibilidade de contratar essas operações de financiamento tem validade condicionada à data de encerramento estipulada no <strong class=\"text-bcb-dark\">art. 9º</strong> da <strong class=\"text-bcb-dark\">Medida Provisória nº 1.359/2026</strong>. Operações registradas após essa data de corte estarão em desconformidade regulatória.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">As áreas operacionais enfrentarão aumento de carga de trabalho na revisão do <strong class=\"text-bcb-dark\">KYC (Know Your Customer)</strong>, sendo obrigatório validar documentações públicas de permissionários (taxistas) ou os registros em plataformas de tecnologia (motoristas de app). O custo aumenta na adaptação do <strong class=\"text-bcb-dark\">Backoffice</strong>, que precisará conciliar e segregar as taxas compostas (Fonte de Recurso + <strong class=\"text-bcb-dark\">BNDES</strong> + Spread Instituição) nos contratos. O processo de auditoria de garantias exigirá revisão nos checklists para assegurar que o valor do automóvel não ultrapasse <strong class=\"text-bcb-dark\">R$ 150.000,00</strong> e que seguros e taxas do <strong class=\"text-bcb-dark\">ECG (Encargo por Concessão de Garantia)</strong> sejam devidamente discriminados na Cédula de Crédito.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A norma não publica um link com novos schemas de layout, mas gera impacto direto e imediato nos sistemas de <strong class=\"text-bcb-dark\">Core Banking</strong> e reportes regulatórios. Em nível de banco de dados, as equipes de TI devem adicionar campos binários para identificação de gênero e tags de categoria profissional (Taxista vs. App) nas APIs de originação. No reporte ao <strong class=\"text-bcb-dark\">CADOC 3040 (SCR - Sistema de Informações de Crédito)</strong>, essas operações devem ser rigorosamente mapeadas nas modalidades de <strong class=\"text-bcb-dark\">repasse BNDES</strong> e atreladas aos códigos de garantia do <strong class=\"text-bcb-dark\">Peac-FGI</strong>. Sistemas de faturamento devem receber um 'hard-block' para impedir a <strong class=\"text-bcb-dark\">capitalização de juros</strong> durante os <strong class=\"text-bcb-dark\">6 meses de carência</strong> e limitar a concessão de crédito complementar de itens de segurança a exatos <strong class=\"text-bcb-dark\">10%</strong> da proposta (tag XML: `<PercentualItensSeguranca>`).</p>\n      </div>","title":"BC - Resolução CMN N° 5.304 de 20/05/2026","type":"Resolução","summary":"A Resolução CMN N° 5.304 cria regras para linhas de financiamento via repasse do BNDES, focadas em taxistas e motoristas de aplicativo para aquisição de veículos novos e sustentáveis. O grande destaque é a política de inclusão de gênero, oferecendo taxas de juros reduzidas e financiamento de itens de segurança especificamente para motoristas mulheres.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5304","isFeatured":false,"tags":[],"date":"2026-05-20","number":"CMN N° 5.304","updated_at":"2026-05-20T22:05:13.997Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52911.pdf"},"normativos_52912":{"id":"normativos_52912","summary":"A Resolução CMN N° 5.305 cria uma linha emergencial de capital de giro focada em companhias aéreas domésticas para mitigar o choque de preços dos combustíveis. Para a maioria das instituições financeiras autorizadas pelo BCB, o impacto é indireto: exige monitoramento de risco e reprecificação de crédito dessas empresas através da atualização de seus passivos no Sistema de Informações de Créditos (SCR).","number":"CMN N° 5.305","tags":[],"title":"BC - Resolução CMN N° 5.305 de 20/05/2026","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.305</strong>, publicada em <strong class=\"text-bcb-dark\">20 de maio de 2026</strong>, regulamenta a concessão de financiamentos direcionados a <strong class=\"text-bcb-dark\">capital de giro</strong> para empresas prestadoras de serviços aéreos de transporte doméstico regular. Derivada da <strong class=\"text-bcb-dark\">Medida Provisória nº 1.349/2026</strong>, a norma autoriza a injeção de até <strong class=\"text-bcb-dark\">R$ 1 bilhão</strong> na economia, com o claro objetivo de fornecer liquidez a um setor severamente penalizado pela escalada internacional dos preços de petróleo oriunda de tensões geopolíticas.</p><p class=\"mb-4 text-justify\">Estruturalmente, o programa desenha um modelo de crédito de curto prazo agressivo: limites travados em <strong class=\"text-bcb-dark\">1,6% do faturamento bruto anual de 2025</strong> (teto de <strong class=\"text-bcb-dark\">R$ 330 milhões</strong> por conglomerado), custo atrelado a <strong class=\"text-bcb-dark\">100% do CDI</strong> e prazo de liquidação fixado em <strong class=\"text-bcb-dark\">seis meses</strong> em parcela única (<strong class=\"text-bcb-dark\">bullet</strong>). A norma inova ao transferir a carga probatória do impacto econômico para o mutuário, exigindo declarações formais de viabilidade e necessidade que devem constar obrigatoriamente nos contratos de financiamento, mitigando o risco sistêmico da operação.</p><p class=\"mb-4 text-justify\">No panorama macro, embora a operacionalização e o desembolso sejam exclusividade do <strong class=\"text-bcb-dark\">Banco do Brasil S.A.</strong> (agindo como braço da União), a injeção desse volume de crédito altera instantaneamente o perfil de endividamento das companhias aéreas. Todo o ecossistema financeiro regulado pelo <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong> — incluindo bancos privados, debenturistas e fundos — deverá ajustar seus modelos de *Credit Scoring* para refletir esse novo compromisso de curto prazo, mapeando os movimentos de alavancagem declarados no <strong class=\"text-bcb-dark\">SCR</strong>.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">BAIXO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">Para a esmagadora maioria do Sistema Financeiro Nacional, o impacto técnico e operacional é <strong class=\"text-bcb-dark\">BAIXO</strong>. A complexidade de implementação sistêmica (desenvolvimento de esteiras e parametrização) está restrita ao <strong class=\"text-bcb-dark\">Banco do Brasil S.A.</strong>. As demais instituições terão apenas impacto analítico.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução CMN N° 5.305, de 20 de maio de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Trata-se de uma norma originária, sem revogação ou alteração explícita de atos normativos anteriores do <strong class=\"text-bcb-dark\">Conselho Monetário Nacional (CMN)</strong> ou do <strong class=\"text-bcb-dark\">BCB</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> Ação regulatória de caráter anticíclico e prudencial. O agravamento das tensões geopolíticas elevou drasticamente o custo internacional do petróleo, impactando o querosene de aviação (QAV). O objetivo primário é evitar rupturas na continuidade do transporte aéreo doméstico regular, provendo <strong class=\"text-bcb-dark\">capital de giro</strong> emergencial.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5305\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução CMN N° 5.305 de 20/05/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A norma entra em vigor imediatamente após sua publicação em <strong class=\"text-bcb-dark\">20 de maio de 2026</strong>. O <strong class=\"text-bcb-dark\">Compliance</strong> do banco operador tem um prazo curtíssimo para adequar contratos e esteiras, visto que a data-limite fatal para o desembolso integral dos recursos é <strong class=\"text-bcb-dark\">28 de junho de 2026</strong>. Após a liberação do recurso na conta de depósitos do mutuário, corre o prazo máximo de <strong class=\"text-bcb-dark\">seis meses</strong> para o vencimento do reembolso contratual, que ocorrerá em parcela única (<strong class=\"text-bcb-dark\">bullet</strong>), estendendo o ciclo de vida desta regulação, em sua fase ativa, até dezembro de <strong class=\"text-bcb-dark\">2026</strong>.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A norma gera um alto custo e volume de trabalho para o <strong class=\"text-bcb-dark\">Banco do Brasil S.A.</strong>, que precisará parametrizar sistemas de crédito para absorver regras de juros de mora (<strong class=\"text-bcb-dark\">1% ao mês</strong>) e multa atípica (<strong class=\"text-bcb-dark\">2% sobre valores amortizados</strong>) em caso de inadimplência, além de revisar controles jurídicos para recepcionar as declarações obrigatórias dos mutuários. Para as demais entidades do mercado de capitais e bancário, o esforço resume-se à revisão dos processos das diretorias de <strong class=\"text-bcb-dark\">Risco de Crédito</strong>, que precisarão recalcular os limites (*covenants*) e avaliar a saúde financeira das empresas aéreas, cujos balanços assumirão uma dívida pesada a ser liquidada em menos de um semestre.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">Sendo uma linha de crédito operada por um único banco estatal repassador, não há emissão de novos manuais ou alterações sistêmicas abertas no <strong class=\"text-bcb-dark\">Catálogo de Documentos (CADOCs)</strong> para o mercado geral. Para o <strong class=\"text-bcb-dark\">Banco do Brasil S.A.</strong>, há a necessidade técnica de taguear corretamente a origem dos recursos e os encargos atrelados ao <strong class=\"text-bcb-dark\">CDI</strong> no <strong class=\"text-bcb-dark\">Documento 3040 (SCR)</strong> através de arquivos XML no formato de envio mensal. Para os desenvolvedores e analistas de dados das demais instituições do ecossistema, não há adequação de APIs ou dicionários de dados requerida pelo <strong class=\"text-bcb-dark\">BCB</strong> neste momento. O foco das equipes técnicas de risco das demais casas deverá ser a calibração de consumo do <strong class=\"text-bcb-dark\">SCR</strong> para monitorar a rápida evolução do passivo de curtíssimo prazo destas companhias de aviação e de seus grupos econômicos.</p>\n      </div>","slug":"resolucao-cmn-5305","date":"2026-05-20","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5305","type":"Resolução","updated_at":"2026-05-21T10:11:45.819Z","thumb_v":"v4","isFeatured":false},"normativos_52913":{"id":"normativos_52913","type":"Resolução","date":"2026-05-20","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5306","slug":"resolucao-cmn-5306","number":"CMN N° 5.306","tags":[],"title":"BC - Resolução CMN N° 5.306 de 20/05/2026","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.306</strong>, editada pelo <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong> em <strong class=\"text-bcb-dark\">20 de maio de 2026</strong>, é um marco estratégico para o fomento tecnológico nacional. Ela atualiza a <strong class=\"text-bcb-dark\">Resolução CMN nº 5.097/2023</strong>, redefinindo e ampliando o público-a
