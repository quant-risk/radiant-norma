solução CMN N° 5.317/2026 é uma atualização fundamental para aprimorar a governança e o fluxo de dados contábeis. Ela redefine as responsabilidades de elaboração e remessa de documentos, especialmente para instituições em conglomerados e sistemas cooperativos. A atenção aos prazos (1º de janeiro de 2028 e 1º de julho de 2028) é crucial.","tipo_cache":"Normativa","thumb_cache":"https://storage.googleapis.com/cadoc-ai-cloud-storage/thumbnails/thumb_normativos_52950_v4.jpg","titulo_cache":"BC - Resolução CMN N° 5.317 de 25/06/2026","post_id":"normativos_52950","impacto":"MÉDIO"},{"dia_semana":"Quinta-feira, 25/06","dica_norma":"Esta Resolução CMN nº 5.318/2026 é crucial para bancos comerciais controlados por bolsas. Ela reforça a segregação de atividades, impedindo a captação de depósitos a prazo, concessão de crédito amplo e manutenção de posição própria em valores mobiliários. Fique atento ao prazo de entrada em vigor em 1º de julho de 2026 para garantir a conformidade.","tipo_cache":"Normativa","thumb_cache":"https://storage.googleapis.com/cadoc-ai-cloud-storage/thumbnails/thumb_normativos_52951.jpg","titulo_cache":"BC - Resolução CMN N° 5.318 de 25/06/2026","post_id":"normativos_52951","impacto":"MÉDIO"},{"dia_semana":"Quinta-feira, 25/06","dica_norma":"A Resolução CMN nº 5.319/2026 atualiza a Resolução CMN nº 5.304/2026, reforçando a permissão para cobrança de encargos usuais pelo BNDES e instituições habilitadas, mas reitera a vedação explícita à 'tarifa de cadastro'. É essencial revisar as políticas de cobrança para conformidade imediata.","tipo_cache":"Normativa","thumb_cache":"https://storage.googleapis.com/cadoc-ai-cloud-storage/thumbnails/thumb_normativos_52952_v4.jpg","titulo_cache":"BC - Resolução CMN N° 5.319 de 25/06/2026","post_id":"normativos_52952","impacto":"MÉDIO"},{"dia_semana":"Quinta-feira, 25/06","dica_norma":"A Resolução CMN N° 5.320/2026 estabelece novo arcabouço para combate à operação irregular de apostas de quota fixa. Instituições financeiras devem se preparar para o bloqueio ágil de contas e rejeição de transações de pessoas/empresas não autorizadas, com prazos de 24 a 48 horas.","tipo_cache":"Normativa","thumb_cache":"https://storage.googleapis.com/cadoc-ai-cloud-storage/thumbnails/thumb_normativos_52953.jpg","titulo_cache":"BC - Resolução CMN N° 5.320 de 25/06/2026","post_id":"normativos_52953","impacto":"ALTO"},{"dia_semana":"Quinta-feira, 25/06","dica_norma":"A Resolução CMN nº 5.315/2026 ajusta o Proagro, flexibilizando a comprovação de perdas com única vistoria em casos graves e exigindo fotos geoespaciais de alta resolução. As alíquotas básicas de adicional foram atualizadas, otimizando a gestão do programa a partir de 1º de julho de 2026.","tipo_cache":"Normativa","thumb_cache":"https://storage.googleapis.com/cadoc-ai-cloud-storage/thumbnails/thumb_normativos_52948_v4.jpg","titulo_cache":"BC - Resolução CMN N° 5.315 de 25/06/2026","post_id":"normativos_52948","impacto":"MÉDIO"}],"briefing":{"pontos_chave":["Implementar e revisar políticas de sucessão para a alta administração, garantindo conformidade e revisões periódicas.","Adaptar sistemas para reporte prudencial em base subconsolidada, com atenção à granularidade e prazos para conglomerados S1.","Revisar os guias de procedimentos e as alçadas decisórias do BCB para pleitos de autorização, credenciamento e descredenciamento.","Atualizar sistemas contábeis com as novas rubricas Cosif para o cálculo das contribuições ao FGC e do MATPF.","Reestruturar processos de reporte contábil, incluindo a exigência de Balancete Patrimonial Analítico mensal para entidades no exterior e consolidação por líderes de conglomerados.","Ajustar sistemas para o recálculo de dívidas de crédito rural Procera OGU, aplicando rebates e descontos específicos.","Incorporar a nova Tabela de Preços de Garantia do PGPAF no MCR e ajustar a lógica de cálculo de bônus, verificando o status ativo do CAF.","Revisar a metodologia de cálculo de taxas de juros em contratos de financiamento, convertendo encargos em fatores multiplicáveis.","Adaptar sistemas e processos para as novas classificações de fontes de recursos no MCR e implementar vedação a financiamentos com supressão de vegetação nativa.","Reprojetar processos de consolidação do Balancete Combinado do Sistema Cooperativo, integrando documentos contábeis individuais.","Revisar e reestruturar portfólios de produtos e serviços para segregação de atividades em bancos comerciais controlados por bolsas.","Assegurar a vedação expressa da 'tarifa de cadastro' em todas as operações de crédito e a correta divulgação de encargos.","Implementar funcionalidades para bloqueio ágil de contas e rejeição de transações de pessoas e empresas que operam apostas de quota fixa irregularmente.","Atualizar procedimentos de vistoria do Proagro, incorporando exigências de fotos geoespaciais e de alta resolução, além das novas alíquotas de adicional."],"temas_tags":["Governança","Supervisão Prudencial","Crédito Rural","Sustentabilidade","Sistemas de Informação","Compliance","Gestão de Riscos","Contabilidade","Conglomerados Prudenciais","Cooperativas de Crédito","Ativos Virtuais","Segregação de Atividades","Cálculo de Juros","COSIF","FGC","PGPAF","MCR","PLD","Detecção de Fraudes","RegTech","TI","Balancete Patrimonial Analítico","Apostas","Bloqueio de Contas","Tarifa de Cadastro","Política de Sucessão","Gestão de Pessoas","Subconsolidação","Autorizações BCB","Instituições de Pagamento","Corretoras","CADOC 2010","CADOC 4010","CADOC 21XX","CADOC 23XX","CADOC 27XX","CADOC 4016","CADOC 4040"]},"stats":{"alto_impacto":2,"total_normativas":15,"docs_afetados":34},"thumb_destaque_G":"https://storage.googleapis.com/cadoc-ai-cloud-storage/thumb_destaques/thumb_destaque_edicao-26-26_G.jpg","parecer_agente":"A semana de 22 a 26 de junho de 2026 demonstrou uma agenda regulatória robusta e multifacetada do Banco Central do Brasil (BCB) e do Conselho Monetário Nacional (CMN), com um foco nítido no fortalecimento da governança e gestão de riscos no sistema financeiro. Observa-se uma intensificação na supervisão prudencial, exigindo relatórios mais granulares e consolidados para estruturas complexas, como conglomerados prudenciais e sistemas cooperativos, o que demanda uma profunda integração de dados contábeis e sistemas de informação. As Resoluções BCB nº 577, 579 e CMN nº 5.316, 5.317 exemplificam essa tendência, impactando CADOCs como o 2010, 4010, 4016 e 4040. \n\nAlém da estabilidade financeira, a sustentabilidade ambiental ganhou destaque com a vedação de financiamentos que prevejam supressão de vegetação nativa no crédito rural (Res. CMN nº 5.314), alinhando o setor a princípios ESG. Paralelamente, o combate à ilegalidade e a proteção da integridade financeira foram reforçados pela Resolução CMN nº 5.320, que impõe o bloqueio ágil de contas e a rejeição de transações de operadores de apostas irregulares, exigindo investimentos significativos em RegTech e sistemas de PLD. Por fim, houve aprimoramentos na eficiência interna do BCB (Res. BCB nº 578) e na padronização dos cálculos de taxas de juros (Res. CMN nº 5.313), visando maior transparência no mercado. \n\nEm suma, as instituições financeiras enfrentam uma agenda de compliance intensa, que exige esforços coordenados nas áreas jurídica, de TI, contabilidade e operações. A adaptação a essas novas normativas, muitas com prazos de entrada em vigor imediatos ou de curto a médio prazo, será crucial para garantir a conformidade e a resiliência operacional no cenário regulatório em constante evolução.","criado_em":"2026-06-26T23:32:45.911Z","linkedin_post":"YES","data_postagem_linkedin":"2026-06-29 10:19:43"},"diaData":null,"mesData":null,"anoData":null,"postsMap":{"normativos_52938":{"id":"normativos_52938","slug":"resolucao-bcb-576","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB nº 576, de 23 de junho de 2026</strong>, estabelece a obrigatoriedade para diversas instituições de implementar e manter uma <strong class=\"text-bcb-dark\">política de sucessão de administradores</strong> aplicável aos cargos da alta administração. O principal objetivo desta normativa é assegurar que os ocupantes dos cargos de liderança possuam as competências necessárias para o desempenho eficaz de suas funções, promovendo, assim, o fortalecimento da <strong class=\"text-bcb-dark\">governança corporativa</strong> e a <strong class=\"text-bcb-dark\">continuidade de gestão</strong> dentro do <strong class=\"text-bcb-dark\">Sistema Financeiro Nacional (SFN)</strong>.</p><p class=\"mb-4 text-justify\">Esta regulamentação abrange um leque de entidades, incluindo <strong class=\"text-bcb-dark\">administradoras de consórcio</strong>, <strong class=\"text-bcb-dark\">sociedades corretoras de títulos e valores mobiliários</strong>, <strong class=\"text-bcb-dark\">sociedades distribuidoras de títulos e valores mobiliários</strong>, <strong class=\"text-bcb-dark\">sociedades corretoras de câmbio</strong>, <strong class=\"text-bcb-dark\">sociedades prestadoras de serviços de ativos virtuais</strong> e <strong class=\"text-bcb-dark\">instituições de pagamento</strong>. A política de sucessão deve ser meticulosamente adaptada à natureza, porte, complexidade, estrutura, perfil de risco e modelo de negócio de cada instituição, detalhando processos claros e formalizados de <strong class=\"text-bcb-dark\">recrutamento, promoção, eleição e retenção</strong>.</p><p class=\"mb-4 text-justify\">É fundamental que a política considere aspectos como as condições legais para o exercício do cargo, capacidade técnica e gerencial, habilidades interpessoais, conhecimento da legislação e regulamentação pertinentes, e experiência. A <strong class=\"text-bcb-dark\">aprovação, supervisão e controle</strong> dos processos relacionados a essa política são de responsabilidade do <strong class=\"text-bcb-dark\">conselho de administração</strong> ou, na sua ausência, da <strong class=\"text-bcb-dark\">diretoria da instituição</strong>. A documentação comprobatória deve ser mantida à disposição do <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong> e a política deve ser revisada periodicamente, com frequência mínima de a cada <strong class=\"text-bcb-dark\">cinco anos</strong>.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é <strong class=\"text-bcb-dark\">MÉDIO</strong> pois exige a formalização de uma <strong class=\"text-bcb-dark\">política robusta de sucessão</strong> e a criação ou adaptação de <strong class=\"text-bcb-dark\">processos internos</strong> de recrutamento, avaliação e treinamento para a alta administração. Embora não demande grandes investimentos em tecnologia ou alterações de <strong class=\"text-bcb-dark\">layouts</strong> de dados, requer um envolvimento significativo da <strong class=\"text-bcb-dark\">alta gestão</strong> e do <strong class=\"text-bcb-dark\">conselho de administração</strong> (ou diretoria) na aprovação e supervisão, além da alocação de recursos para a revisão periódica da política. Afeta a <strong class=\"text-bcb-dark\">governança</strong> e <strong class=\"text-bcb-dark\">gestão de pessoas</strong> estratégicas de diversas entidades reguladas.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução BCB Nº 576, de 23 de junho de 2026</strong></p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Não altera nem revoga normas anteriores diretamente, mas estabelece uma nova obrigação para as instituições mencionadas no seu Art. 1º, complementando o arcabouço regulatório existente.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A <strong class=\"text-bcb-dark\">Resolução BCB nº 576/2026</strong> é motivada pela contínua necessidade de fortalecer a <strong class=\"text-bcb-dark\">governança corporativa</strong> e a <strong class=\"text-bcb-dark\">resiliência operacional</strong> das instituições financeiras e demais entidades autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong>. No cenário macroeconômico e prudencial, a garantia da <strong class=\"text-bcb-dark\">continuidade da gestão</strong> e de que a <strong class=\"text-bcb-dark\">alta administração</strong> possua as competências adequadas é crucial para a <strong class=\"text-bcb-dark\">solidez e estabilidade do Sistema Financeiro Nacional (SFN)</strong>. A medida visa mitigar <strong class=\"text-bcb-dark\">riscos operacionais, estratégicos e reputacionais</strong> decorrentes de lacunas na liderança, assegurando a perenidade e a qualidade da gestão.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=576\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução BCB N° 576 de 23/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">O prazo para adequação e entrada em vigor da <strong class=\"text-bcb-dark\">Resolução BCB nº 576/2026</strong> é <strong class=\"text-bcb-dark\">1º de janeiro de 2027</strong>. A partir desta data, todas as <strong class=\"text-bcb-dark\">administradoras de consórcio</strong>, <strong class=\"text-bcb-dark\">sociedades corretoras de títulos e valores mobiliários</strong>, <strong class=\"text-bcb-dark\">sociedades distribuidoras de títulos e valores mobiliários</strong>, <strong class=\"text-bcb-dark\">sociedades corretoras de câmbio</strong>, <strong class=\"text-bcb-dark\">sociedades prestadoras de serviços de ativos virtuais</strong> e <strong class=\"text-bcb-dark\">instituições de pagamento</strong> deverão já possuir e manter sua <strong class=\"text-bcb-dark\">política de sucessão de administradores</strong> implementada. Adicionalmente, a política implementada deve ser <strong class=\"text-bcb-dark\">revisada</strong> periodicamente, com frequência mínima de a cada <strong class=\"text-bcb-dark\">cinco anos</strong>, ou sempre que houver eventos relevantes que impactem a estrutura de governança, o modelo de negócio ou o perfil de risco da instituição.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A implementação da <strong class=\"text-bcb-dark\">Resolução BCB nº 576/2026</strong> gerará trabalho e custo para as instituições, principalmente na <strong class=\"text-bcb-dark\">formalização e documentação</strong> de seus processos de <strong class=\"text-bcb-dark\">sucessão de administradores</strong>. Os processos de <strong class=\"text-bcb-dark\">Recursos Humanos</strong> e de <strong class=\"text-bcb-dark\">Governança Corporativa</strong> deverão ser revisados ou criados, abrangendo <strong class=\"text-bcb-dark\">recrutamento, promoção, eleição e retenção</strong>. Isso inclui a elaboração e aplicação de critérios claros para identificação, avaliação, treinamento e seleção de candidatos para a <strong class=\"text-bcb-dark\">alta administração</strong>, considerando aspectos como capacidade técnica, gerencial, habilidades interpessoais, conhecimento regulatório e experiência. Haverá necessidade de envolvimento do <strong class=\"text-bcb-dark\">conselho de administração</strong> (ou diretoria) na aprovação e supervisão contínua da política, além da alocação de recursos para sua manutenção e revisão periódica, que deve ocorrer a cada <strong class=\"text-bcb-dark\">cinco anos</strong>.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB nº 576/2026</strong> não prevê alterações diretas em <strong class=\"text-bcb-dark\">layouts de sistemas</strong>, documentos regulatórios (como <strong class=\"text-bcb-dark\">CADOCs</strong>), <strong class=\"text-bcb-dark\">tabelas de domínios</strong>, <strong class=\"text-bcb-dark\">dicionários de dados</strong>, <strong class=\"text-bcb-dark\">tags XML</strong> ou <strong class=\"text-bcb-dark\">protocolos de transmissão</strong>. A natureza da norma foca exclusivamente em <strong class=\"text-bcb-dark\">governança interna</strong> e <strong class=\"text-bcb-dark\">processos de gestão de pessoas</strong> na alta administração, sem impacto em fluxos de dados, infraestrutura tecnológica ou requisitos de reportes técnicos ao <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong>.</p>\n      </div>","title":"BC - Resolução BCB N° 576 de 23/06/2026","type":"Resolução","summary":"A Resolução BCB nº 576/2026 estabelece a obrigatoriedade de políticas de sucessão para a alta administração de diversas instituições reguladas. Garanta que sua política esteja em conformidade, cobrindo recrutamento, promoção, eleição e retenção, e seja revisada a cada cinco anos. Esta medida visa fortalecer a governança e a resiliência das entidades do Sistema Financeiro Nacional (SFN), entrando em vigor em 1º de janeiro de 2027.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=576","isFeatured":false,"tags":["SPSAV"],"date":"2026-06-23","number":"BCB N° 576","updated_at":"2026-06-23T21:57:27.181Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52938.pdf"},"normativos_52939":{"id":"normativos_52939","slug":"resolucao-bcb-577","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB nº 577, de 23 de junho de 2026</strong>, representa um avanço significativo nas exigências de reporte prudencial do Banco Central do Brasil (<strong class=\"text-bcb-dark\">BCB</strong>). Sua principal função é alterar a <strong class=\"text-bcb-dark\">Resolução BCB nº 207, de 22 de março de 2022</strong>, que estabelece os requisitos para o envio de informações contábeis e prudenciais. Esta nova norma visa refinar a aplicabilidade e o escopo de reporte para todos os <strong class=\"text-bcb-dark\">conglomerados prudenciais</strong> enquadrados nos segmentos <strong class=\"text-bcb-dark\">S1, S2, S3 e S4</strong>, de acordo com as Resoluções nº <strong class=\"text-bcb-dark\">4.553/2017</strong> e <strong class=\"text-bcb-dark\">BCB nº 436/2024</strong>.</p><p class=\"mb-4 text-justify\">As modificações introduzidas são particularmente relevantes para os <strong class=\"text-bcb-dark\">conglomerados prudenciais S1</strong>. A norma passa a exigir que as informações sejam elaboradas não apenas em base <strong class=\"text-bcb-dark\">consolidada</strong>, conforme a apuração do Patrimônio de Referência, mas também em base <strong class=\"text-bcb-dark\">subconsolidada</strong>, no âmbito do <strong class=\"text-bcb-dark\">subconglomerado prudencial</strong>. Este conceito de <strong class=\"text-bcb-dark\">subconglomerado</strong> é definido no <strong class=\"text-bcb-dark\">Art. 13-A da Resolução CMN nº 4.950, de 30 de setembro de 2021</strong>. A resolução detalha as responsabilidades de envio por tipo de instituição, incluindo líderes de conglomerado, bancos cooperativos e instituições não pertencentes a conglomerados.</p><p class=\"mb-4 text-justify\">Com a entrada em vigor em <strong class=\"text-bcb-dark\">1º de julho de 2026</strong>, a norma busca otimizar a supervisão do <strong class=\"text-bcb-dark\">BCB</strong>, garantindo que as instituições financeiras e demais entidades autorizadas forneçam dados mais precisos e estruturados sobre sua saúde financeira e seus riscos. É concedido um período de homologação para o envio das informações em base <strong class=\"text-bcb-dark\">subconsolidada</strong> até <strong class=\"text-bcb-dark\">31 de dezembro de 2026</strong>, permitindo que as instituições ajustem seus sistemas e processos de reporte sem penalidades. A revogação do <strong class=\"text-bcb-dark\">Art. 4º, § 4º</strong>, da <strong class=\"text-bcb-dark\">Resolução BCB nº 207/2022</strong> complementa as alterações.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é <strong class=\"text-bcb-dark\">MÉDIO</strong> devido à complexidade da implementação da base de reporte <strong class=\"text-bcb-dark\">subconsolidada</strong>, especialmente para os <strong class=\"text-bcb-dark\">conglomerados prudenciais S1</strong>, que são os maiores e mais complexos. Isso exige adaptações significativas em sistemas, processos e governança de dados, afetando a estrutura de reporte de informações cruciais para a supervisão do <strong class=\"text-bcb-dark\">BCB</strong>, mas não impactando diretamente o capital ou produtos ao consumidor.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução BCB Nº 577, de 23 de junho de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Altera a <strong class=\"text-bcb-dark\">Resolução BCB nº 207, de 22 de março de 2022</strong>, modificando o <strong class=\"text-bcb-dark\">Art. 1º, § 1º-A</strong>, o <strong class=\"text-bcb-dark\">Art. 2º, § 2º</strong>, o <strong class=\"text-bcb-dark\">Art. 3º, Parágrafo único</strong>, e o <strong class=\"text-bcb-dark\">Art. 4º</strong>. Revoga o <strong class=\"text-bcb-dark\">Art. 4º, § 4º</strong>, da mesma <strong class=\"text-bcb-dark\">Resolução BCB nº 207/2022</strong>. Faz referência à definição de <strong class=\"text-bcb-dark\">subconglomerado prudencial</strong> no <strong class=\"text-bcb-dark\">Art. 13-A da Resolução CMN nº 4.950, de 30 de setembro de 2021</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória reside na busca por maior precisão e granularidade na supervisão prudencial do <strong class=\"text-bcb-dark\">BCB</strong>. Ao exigir informações em base <strong class=\"text-bcb-dark\">consolidada</strong> e, de forma inédita e crucial, em base <strong class=\"text-bcb-dark\">subconsolidada</strong> para <strong class=\"text-bcb-dark\">conglomerados S1</strong>, a norma visa proporcionar uma visão mais clara e detalhada dos riscos e da saúde financeira de grupos complexos. Isso é essencial para a estabilidade do sistema financeiro nacional, permitindo ao regulador identificar e mitigar riscos de forma mais eficiente, fortalecendo as ferramentas de macroprudência.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=577\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução BCB N° 577 de 23/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB nº 577/2026</strong> entra em vigor em <strong class=\"text-bcb-dark\">1º de julho de 2026</strong>. Contudo, para as instituições integrantes de <strong class=\"text-bcb-dark\">conglomerado prudencial</strong> que necessitam elaborar informações em base <strong class=\"text-bcb-dark\">subconsolidada</strong>, é admitido o envio em caráter de homologação até <strong class=\"text-bcb-dark\">31 de dezembro de 2026</strong>. Isso significa que as instituições têm este período para adequar seus sistemas e processos ao novo formato de reporte para o <strong class=\"text-bcb-dark\">subconglomerado prudencial</strong> sem penalidades. A partir de <strong class=\"text-bcb-dark\">1º de janeiro de 2027</strong>, o envio em base <strong class=\"text-bcb-dark\">subconsolidada</strong> deve estar em plena <strong class=\"text-bcb-dark\">conformidade</strong> com a norma.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A implementação da <strong class=\"text-bcb-dark\">Resolução BCB nº 577/2026</strong> gerará um impacto operacional relevante, principalmente para os <strong class=\"text-bcb-dark\">conglomerados prudenciais S1</strong>. Será necessário um trabalho considerável de revisão e adaptação dos processos de coleta, tratamento e consolidação de dados. As instituições deverão:</p><p class=\"mb-4 text-justify\">1.  <strong class=\"text-bcb-dark\">Revisar Processos Internos</strong>: Atualizar os fluxos de trabalho para identificar e segregar as informações necessárias para o reporte em base <strong class=\"text-bcb-dark\">subconsolidada</strong>, além da <strong class=\"text-bcb-dark\">consolidada</strong>.</p><p class=\"mb-4 text-justify\">2.  <strong class=\"text-bcb-dark\">Desenvolver e Adaptar Sistemas</strong>: Alterar ou criar sistemas para a geração automática dos novos relatórios, garantindo que as regras de consolidação (incluindo a definição de <strong class=\"text-bcb-dark\">subconglomerado prudencial</strong>) sejam aplicadas corretamente.</p><p class=\"mb-4 text-justify\">3.  <strong class=\"text-bcb-dark\">Governança de Dados</strong>: Fortalecer a <strong class=\"text-bcb-dark\">governança de dados</strong> para assegurar a consistência e a qualidade das informações em diferentes níveis de consolidação.</p><p class=\"mb-4 text-justify\">4.  <strong class=\"text-bcb-dark\">Treinamento</strong>: Capacitar equipes técnicas e de compliance sobre as novas exigências e seus impactos.</p><p class=\"mb-4 text-justify\">5.  <strong class=\"text-bcb-dark\">Custos</strong>: Os custos associados incluirão investimentos em tecnologia, licenças de software, consultoria especializada e horas de trabalho dedicadas das equipes internas, resultando em um aumento temporário na carga de trabalho para garantir a <strong class=\"text-bcb-dark\">conformidade</strong> dentro do prazo de homologação.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">As alterações técnicas decorrem da necessidade de gerar relatórios em duas novas bases: <strong class=\"text-bcb-dark\">consolidada</strong> e <strong class=\"text-bcb-dark\">subconsolidada</strong>, para diferentes tipos de instituições e segmentos. Embora a norma não especifique <strong class=\"text-bcb-dark\">CADOCs</strong> ou layouts de arquivos (XML, tabelas de domínio, dicionários de dados) diretamente, qualquer <strong class=\"text-bcb-dark\">CADOC</strong> que utilize as definições de escopo e consolidação da <strong class=\"text-bcb-dark\">Resolução BCB nº 207/2022</strong> será indiretamente afetado. As instituições, especialmente as enquadradas no <strong class=\"text-bcb-dark\">S1</strong>, deverão revisar seus sistemas de reporte para:</p><li class=\"text-justify\">Inserir a capacidade de gerar informações em base <strong class=\"text-bcb-dark\">subconsolidada</strong> conforme o <strong class=\"text-bcb-dark\">Art. 13-A da Resolução CMN nº 4.950/2021</strong>.</li><li class=\"text-justify\">Adaptar os processos de coleta, agregação e validação de dados para refletir as novas regras de consolidação.</li><li class=\"text-justify\">Possivelmente, atualizar esquemas XSD, dicionários de dados ou templates de relatórios que o <strong class=\"text-bcb-dark\">BCB</strong> possa vir a publicar em comunicados específicos, dado o impacto na estrutura dos dados reportados. A ausência de uma URL específica para layout implica que essas adaptações deverão ser inferidas e desenvolvidas internamente, aguardando orientações técnicas suplementares do <strong class=\"text-bcb-dark\">BCB</strong> via comunicados.</li>\n      </div>","title":"BC - Resolução BCB N° 577 de 23/06/2026","type":"Resolução","summary":"A Resolução BCB nº 577/2026 é crucial para aprimorar a supervisão prudencial do BCB. Ela altera a Resolução BCB nº 207/2022, focando na padronização e na granularidade das informações reportadas pelos conglomerados prudenciais. A grande novidade é a introdução da base subconsolidada de reporte para instituições do S1, exigindo atenção redobrada aos prazos e à conformidade dos sistemas de informação.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=577","tags":["Riscos"],"date":"2026-06-23","number":"BCB N° 577","updated_at":"2026-06-23T21:57:27.181Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52939.pdf","isFeatured":false},"normativos_52940":{"id":"normativos_52940","slug":"resolucao-bcb-578","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB Nº 578, de 23 de junho de 2026</strong>, representa uma atualização interna fundamental no arcabouço normativo do <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong>. Seu objetivo primário é alterar o <strong class=\"text-bcb-dark\">Regimento Interno do Banco Central do Brasil</strong>, anexo à <strong class=\"text-bcb-dark\">Resolução BCB nº 340, de 21 de setembro de 2023</strong>, para redefinir e clarificar as competências decisórias de sua <strong class=\"text-bcb-dark\">Diretoria Colegiada</strong> e de alguns de seus departamentos, como o <strong class=\"text-bcb-dark\">Departamento de Organização do Sistema Financeiro e de Resolução (Deorf)</strong>. Embora seja uma norma de caráter organizacional interno, suas implicações reverberam diretamente em todas as instituições supervisionadas, ao estabelecer quem decide o quê dentro do regulador.</p><p class=\"mb-4 text-justify\">As alterações abrangem uma vasta gama de temas críticos para o ecossistema financeiro. Destacam-se as novas disposições sobre a decretação de inadimplência e concessão de limites para <strong class=\"text-bcb-dark\">Linhas Financeiras de Liquidez</strong>, a elegibilidade de instrumentos para composição do <strong class=\"text-bcb-dark\">Patrimônio de Referência (PR)</strong>, autorizações para escrituração de <strong class=\"text-bcb-dark\">duplicatas escriturais</strong> e cancelamento de arranjos de pagamento. De forma significativa, a norma detalha exaustivamente as competências relacionadas a pleitos dos <strong class=\"text-bcb-dark\">Provedores de Serviços de Tecnologia da Informação (PSTIs)</strong>, como credenciamento, descredenciamento e manutenção em casos de alteração societária ou de administradores. Também são abordadas as autorizações para funcionamento e alterações de sociedades prestadoras de serviços de ativos virtuais, administradoras de consórcio e cooperativas de crédito clássicas.</p><p class=\"mb-4 text-justify\">Para a alta gestão e equipes técnicas das instituições financeiras e demais entidades autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong>, a <strong class=\"text-bcb-dark\">Resolução BCB Nº 578</strong> exige uma revisão da compreensão sobre os fluxos de aprovação regulatória. Embora não crie novas obrigações diretas de conformidade, a clareza nas alçadas de decisão do <strong class=\"text-bcb-dark\">BCB</strong> é crucial para otimizar os processos de interação com o regulador, garantir a submissão correta de pleitos e antecipar possíveis impactos nos prazos e requisitos para autorizações estratégicas, como fusões, cisões e mudanças de controle societário. A norma busca, em última instância, aumentar a eficiência e a transparência na gestão regulatória interna do <strong class=\"text-bcb-dark\">BCB</strong>.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto sistêmico é <strong class=\"text-bcb-dark\">MÉDIO</strong> porque, embora a <strong class=\"text-bcb-dark\">Resolução BCB Nº 578</strong> seja uma norma interna do <strong class=\"text-bcb-dark\">BCB</strong>, ela redefine as competências para decisões críticas que afetam diretamente a governança, a estabilidade e a operação de diversas entidades financeiras e de tecnologia da informação que compõem o sistema. A clareza nos processos de autorização para <strong class=\"text-bcb-dark\">PSTIs</strong>, <strong class=\"text-bcb-dark\">Linhas Financeiras de Liquidez</strong> e <strong class=\"text-bcb-dark\">Patrimônio de Referência</strong> pode mitigar incertezas e agilizar trâmites, impactando a eficiência e a resiliência do sistema financeiro como um todo.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> Resolução BCB N° 578, de 23 de junho de 2026.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Esta norma altera o <strong class=\"text-bcb-dark\">Regimento Interno do Banco Central do Brasil</strong>, anexo à <strong class=\"text-bcb-dark\">Resolução BCB nº 340, de 21 de setembro de 2023</strong>. Adicionalmente, <strong class=\"text-bcb-dark\">revoga o item 1 da alínea \"a\" do inciso I do caput do art. 99</strong> do referido <strong class=\"text-bcb-dark\">Regimento Interno</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória primária para a <strong class=\"text-bcb-dark\">Resolução BCB Nº 578</strong> é aprimorar a governança e a eficiência interna do <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong>. Em um cenário de constante evolução do mercado financeiro e tecnológico, o <strong class=\"text-bcb-dark\">BCB</strong> busca refinar a distribuição de competências decisórias entre a <strong class=\"text-bcb-dark\">Diretoria Colegiada</strong> e seus departamentos, como o <strong class=\"text-bcb-dark\">Deorf</strong>. Isso garante maior clareza e agilidade na análise e decisão de pleitos estratégicos, desde autorizações para novos entrantes (como sociedades prestadoras de serviços de ativos virtuais) e <strong class=\"text-bcb-dark\">PSTIs</strong>, até questões relacionadas à liquidez e capital das instituições financeiras, otimizando a supervisão prudencial e a resposta regulatória às dinâmicas do mercado.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=578\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução BCB N° 578 de 23/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB Nº 578</strong> entra em vigor na <strong class=\"text-bcb-dark\">data de sua publicação</strong>, ou seja, em <strong class=\"text-bcb-dark\">23 de junho de 2026</strong>. Para as instituições financeiras e demais entidades autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong>, a adequação consiste em compreender imediatamente as novas alçadas de decisão e as competências internas do <strong class=\"text-bcb-dark\">BCB</strong> relativas a pleitos de autorização, credenciamento, descredenciamento e outras matérias regulatórias. Não há um prazo específico para 'adequação' de sistemas ou processos operacionais internos das instituições, mas sim a necessidade de atualização do conhecimento sobre os procedimentos do regulador para garantir a correta interação e submissão de processos a partir da data de entrada em vigor.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">O <strong class=\"text-bcb-dark\">impacto operacional</strong> direto para as instituições financeiras e entidades reguladas é indireto, mas significativo. A norma exige uma atualização na compreensão sobre os processos de interação com o <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong>. Equipes de <strong class=\"text-bcb-dark\">compliance</strong>, jurídica e de relações institucionais deverão revisar seus guias de procedimentos para identificar as novas alçadas decisórias para temas como: credenciamento e descredenciamento de <strong class=\"text-bcb-dark\">PSTIs</strong>, pleitos de autorização de <strong class=\"text-bcb-dark\">arranjos de pagamento</strong>, elegibilidade de instrumentos de <strong class=\"text-bcb-dark\">Patrimônio de Referência (PR)</strong>, e autorizações para sociedades de ativos virtuais.</p><p class=\"mb-4 text-justify\">Embora não gere novos <strong class=\"text-bcb-dark\">CADOCs</strong> ou relatórios, a correta identificação do departamento ou diretoria competente no <strong class=\"text-bcb-dark\">BCB</strong> para cada tipo de pleito é crucial para evitar retrabalho, atrasos e custos desnecessários. Processos internos de comunicação e submissão de documentos ao <strong class=\"text-bcb-dark\">BCB</strong> podem precisar ser revisados para refletir essas novas competências, garantindo que as solicitações sejam direcionadas de forma eficaz e que as expectativas de prazos e fluxos internos do regulador sejam devidamente gerenciadas. O custo principal será a alocação de tempo para análise e disseminação interna dessas mudanças regulatórias.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">Esta <strong class=\"text-bcb-dark\">Resolução BCB Nº 578</strong> é de natureza organizacional e interna ao <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong>, alterando seu <strong class=\"text-bcb-dark\">Regimento Interno</strong>. Portanto, <strong class=\"text-bcb-dark\">NÃO HÁ</strong> alterações diretas de layout de sistemas, documentos regulatórios (<strong class=\"text-bcb-dark\">CADOCs</strong>), tabelas de domínios, dicionários de dados, tags <strong class=\"text-bcb-dark\">XML</strong> ou protocolos de transmissão impostas às instituições supervisionadas. As mudanças se referem a quem decide sobre o quê dentro do <strong class=\"text-bcb-dark\">BCB</strong>, e não a como as informações são reportadas ou processadas pelas instituições externas.</p>\n      </div>","title":"BC - Resolução BCB N° 578 de 23/06/2026","type":"Resolução","summary":"A Resolução BCB Nº 578/2026 atualiza o Regimento Interno do Banco Central do Brasil, especificamente a Resolução BCB nº 340/2023. Ela redefine e esclarece as competências decisórias da Diretoria Colegiada e de departamentos como o Deorf, impactando diretamente processos de autorização, credenciamento e descredenciamento para diversas instituições, incluindo PSTIs e sociedades de ativos virtuais. Fique atento às novas alçadas para garantir a correta submissão de seus pleitos ao BCB.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=578","tags":[],"date":"2026-06-23","number":"BCB N° 578","updated_at":"2026-06-23T21:57:27.181Z","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52940.pdf","thumb_v":"v4","isFeatured":false},"normativos_52941":{"id":"normativos_52941","slug":"instrucao-normativa-bcb-751","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Instrução Normativa BCB N° 751</strong>, de <strong class=\"text-bcb-dark\">24 de junho de 2026</strong>, representa um marco regulatório do <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong> ao divulgar as rubricas contábeis do <strong class=\"text-bcb-dark\">Padrão Contábil das Instituições Reguladas pelo Banco Central do Brasil (Cosif)</strong>. Estas rubricas são cruciais para a determinação da base de cálculo das contribuições ordinárias, especiais e adicionais devidas ao <strong class=\"text-bcb-dark\">Fundo Garantidor de Créditos (FGC)</strong>, bem como para o montante a ser alocado em títulos públicos federais (<strong class=\"text-bcb-dark\">MATPF</strong>). Sua aplicação é mandatória para todas as instituições financeiras e demais entidades autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong>, visando assegurar a padronização e a precisão nos cálculos regulatórios.</p><p class=\"mb-4 text-justify\">Esta normativa tem o papel de substituir a <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 566, de 17 de dezembro de 2024</strong>, consolidando em um único ato as rubricas atualizadas do <strong class=\"text-bcb-dark\">Cosif</strong>. A necessidade dessa atualização decorre de alterações em normativos de hierarquia superior, notadamente a <strong class=\"text-bcb-dark\">Resolução BCB nº 572, de 29 de maio de 2026</strong>, que promoveu modificações na <strong class=\"text-bcb-dark\">Resolução BCB nº 102, de 7 de junho de 2021</strong>. Tais alterações ajustaram a forma de cálculo de indicadores como o <strong class=\"text-bcb-dark\">Patrimônio Líquido Ajustado (PLA)</strong>, o <strong class=\"text-bcb-dark\">Valor de Referência (VR)</strong> e o <strong class=\"text-bcb-dark\">Ativo de Referência (AR)</strong>, todos fundamentais para a apuração das obrigações com o <strong class=\"text-bcb-dark\">FGC</strong> e o <strong class=\"text-bcb-dark\">MATPF</strong>.</p><p class=\"mb-4 text-justify\">Em essência, a <strong class=\"text-bcb-dark\">IN BCB Nº 751</strong> não introduz novos métodos de cálculo, mas sim formaliza e atualiza as contas específicas dentro do plano de contas <strong class=\"text-bcb-dark\">Cosif</strong> que devem ser utilizadas como insumo para os cálculos já previstos em regulamentações preexistentes. Essa iniciativa do <strong class=\"text-bcb-dark\">BCB</strong> busca proporcionar maior clareza e uniformidade na apuração das obrigações regulatórias, otimizando o processo de conformidade e facilitando a auditoria para as instituições supervisionadas. Ao consolidar as informações, o ato normativo simplifica o acesso e a aplicação da regulação pertinente.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é considerado <strong class=\"text-bcb-dark\">MÉDIO</strong> devido à necessidade de as instituições financeiras e demais entidades ajustarem seus sistemas contábeis e de <strong class=\"text-bcb-dark\">reporte regulatório</strong> para incorporar as <strong class=\"text-bcb-dark\">novas rubricas contábeis Cosif</strong> para o cálculo das contribuições ao <strong class=\"text-bcb-dark\">FGC</strong> e do <strong class=\"text-bcb-dark\">MATPF</strong>. Embora a norma consolide e atualize rubricas já existentes, exige revisão e possível reconfiguração de <strong class=\"text-bcb-dark\">bases de dados</strong> e <strong class=\"text-bcb-dark\">rotinas de cálculo</strong> para garantir a conformidade com as definições mais recentes do <strong class=\"text-bcb-dark\">BCB</strong> para <strong class=\"text-bcb-dark\">PLA</strong>, <strong class=\"text-bcb-dark\">VR</strong> e <strong class=\"text-bcb-dark\">AR</strong>. A complexidade advém da integração dessas rubricas nos processos já estabelecidos, impactando diretamente as áreas de <strong class=\"text-bcb-dark\">TI</strong> e <strong class=\"text-bcb-dark\">Contabilidade</strong>.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Instrução Normativa BCB N° 751</strong>, de <strong class=\"text-bcb-dark\">24 de junho de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Revoga a <strong class=\"text-bcb-dark\">Instrução Normativa BCB nº 566, de 17 de dezembro de 2024</strong>. Complementa e detalha o disposto na <strong class=\"text-bcb-dark\">Resolução CMN nº 4.222, de 23 de maio de 2013</strong>, e na <strong class=\"text-bcb-dark\">Resolução BCB nº 102, de 7 de junho de 2021</strong>, que foi alterada pela <strong class=\"text-bcb-dark\">Resolução BCB nº 572, de 29 de maio de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória reside na necessidade de manter atualizado e consolidado o elenco de <strong class=\"text-bcb-dark\">rubricas contábeis Cosif</strong> que servem como base para o cálculo das contribuições ao <strong class=\"text-bcb-dark\">Fundo Garantidor de Créditos (FGC)</strong> e para a apuração do montante a ser alocado em títulos públicos federais (<strong class=\"text-bcb-dark\">MATPF</strong>). Alterações em normas hierarquicamente superiores, como a <strong class=\"text-bcb-dark\">Resolução BCB nº 102, de 2021</strong>, modificada pela <strong class=\"text-bcb-dark\">Resolução BCB nº 572, de 2026</strong>, introduziram ajustes nos indicadores como <strong class=\"text-bcb-dark\">Patrimônio Líquido Ajustado (PLA)</strong>, <strong class=\"text-bcb-dark\">Valor de Referência (VR)</strong> e <strong class=\"text-bcb-dark\">Ativo de Referência (AR)</strong>. Esta <strong class=\"text-bcb-dark\">Instrução Normativa</strong> visa, portanto, formalizar as <strong class=\"text-bcb-dark\">novas rubricas Cosif</strong> correspondentes a essas definições, garantindo clareza, padronização e consistência na aplicação das normas prudenciais e de proteção ao sistema financeiro.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=751\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Instrução Normativa BCB N° 751 de 24/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Instrução Normativa BCB N° 751</strong>, de <strong class=\"text-bcb-dark\">24 de junho de 2026</strong>, entra em vigor na data de sua publicação, conforme Art. 3º. Isso significa que as instituições financeiras e demais entidades autorizadas pelo <strong class=\"text-bcb-dark\">BCB</strong> devem estar em <strong class=\"text-bcb-dark\">conformidade (Compliance)</strong> com as <strong class=\"text-bcb-dark\">novas rubricas contábeis Cosif</strong> para os cálculos das contribuições ao <strong class=\"text-bcb-dark\">FGC</strong> e do <strong class=\"text-bcb-dark\">MATPF</strong> a partir do momento da publicação. Não há um período de transição explícito para a aplicação das novas rubricas, exigindo que os sistemas e processos internos de apuração contábil e de reporte já estejam adaptados para a primeira data de cálculo após a entrada em vigor da norma.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A implementação desta norma gera trabalho significativo para as áreas de <strong class=\"text-bcb-dark\">contabilidade</strong>, <strong class=\"text-bcb-dark\">regulação</strong>, <strong class=\"text-bcb-dark\">riscos</strong> e <strong class=\"text-bcb-dark\">tecnologia da informação</strong> das instituições. Os processos operacionais que devem ser revisados e ajustados incluem:</p><p class=\"mb-4 text-justify\">1.  <strong class=\"text-bcb-dark\">Mapeamento e Configuração de Contas</strong>: As equipes contábeis precisarão mapear as novas <strong class=\"text-bcb-dark\">rubricas Cosif</strong> divulgadas nos anexos com as contas internas da instituição. É crucial garantir que os dados utilizados nos cálculos de <strong class=\"text-bcb-dark\">FGC</strong> e <strong class=\"text-bcb-dark\">MATPF</strong> reflitam as definições atualizadas.</p><p class=\"mb-4 text-justify\">2.  <strong class=\"text-bcb-dark\">Atualização de Sistemas</strong>: Os sistemas de <strong class=\"text-bcb-dark\">ERP</strong> contábeis, os módulos de <strong class=\"text-bcb-dark\">reporte regulatório</strong> e as bases de dados relacionadas precisarão ser atualizados para reconhecer e processar corretamente as novas rubricas, especialmente no que tange ao cálculo de <strong class=\"text-bcb-dark\">PLA</strong>, <strong class=\"text-bcb-dark\">VR</strong> e <strong class=\"text-bcb-dark\">AR</strong>. Isso pode envolver desenvolvimento ou parametrização de <strong class=\"text-bcb-dark\">software</strong>, testes rigorosos e validações.</p><p class=\"mb-4 text-justify\">3.  <strong class=\"text-bcb-dark\">Revisão de Procedimentos Internos</strong>: Os procedimentos internos de apuração e reconciliação dos valores das contribuições ao <strong class=\"text-bcb-dark\">FGC</strong> e do <strong class=\"text-bcb-dark\">MATPF</strong> deverão ser integralmente revisados e atualizados para incorporar as novas bases de cálculo, garantindo a <strong class=\"text-bcb-dark\">integridade</strong> e <strong class=\"text-bcb-dark\">precisão</strong> dos dados reportados.</p><p class=\"mb-4 text-justify\">4.  <strong class=\"text-bcb-dark\">Treinamento de Equipes</strong>: As equipes operacionais e de <strong class=\"text-bcb-dark\">compliance</strong> precisarão ser treinadas sobre as mudanças e as novas metodologias de cálculo. Todos esses ajustes representam custos diretos e indiretos, incluindo horas de trabalho de equipes internas e/ou consultoria externa, bem como potenciais investimentos em <strong class=\"text-bcb-dark\">tecnologia</strong>, impactando diretamente o orçamento operacional e de <strong class=\"text-bcb-dark\">projetos de TI</strong> e regulatórios das instituições.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">Esta <strong class=\"text-bcb-dark\">Instrução Normativa</strong> estabelece e consolida as <strong class=\"text-bcb-dark\">rubricas contábeis Cosif</strong> utilizadas como base de cálculo. Embora não haja menção explícita a alterações de <strong class=\"text-bcb-dark\">layout</strong> de documentos regulatórios específicos como <strong class=\"text-bcb-dark\">CADOCs</strong> ou <strong class=\"text-bcb-dark\">XMLs</strong> nesta norma, as rubricas divulgadas são os insumos fundamentais para o preenchimento e a correta apuração dos valores reportados nesses documentos. As principais <strong class=\"text-bcb-dark\">rubricas Cosif</strong> detalhadas nos anexos, que substituem ou complementam as anteriores para os cálculos de <strong class=\"text-bcb-dark\">FGC</strong> e <strong class=\"text-bcb-dark\">MATPF</strong>, são:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Anexo I</strong>: Rubricas para <strong class=\"text-bcb-dark\">Contribuições Ordinárias FGC</strong>, como <strong class=\"text-bcb-dark\">9.8.2.10.01.01-4 Depósitos à Vista ou Sacáveis Mediante Aviso Prévio</strong> e <strong class=\"text-bcb-dark\">9.8.2.10.01.07-6 Letras de Crédito Imobiliário</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Anexo II</strong>: Rubricas para <strong class=\"text-bcb-dark\">Contribuições Especiais FGC</strong>, como <strong class=\"text-bcb-dark\">9.8.2.10.02.01-3 Depósito a Prazo com Garantia Especial - com Alienação de Recebíveis</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Anexo III</strong>: Rubricas para <strong class=\"text-bcb-dark\">Captações de Referência (CR)</strong> para <strong class=\"text-bcb-dark\">Contribuições Adicionais FGC</strong> e <strong class=\"text-bcb-dark\">MATPF</strong>, incluindo <strong class=\"text-bcb-dark\">9.8.2.10.03.01-2 Captação Total</strong> e <strong class=\"text-bcb-dark\">9.8.2.10.03.03-6 (-) Captação de Instituições Financeiras</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Anexo IV</strong>: Rubricas para <strong class=\"text-bcb-dark\">Patrimônio Líquido Ajustado (PLA)</strong> para <strong class=\"text-bcb-dark\">Contribuições Adicionais FGC</strong> e <strong class=\"text-bcb-dark\">MATPF</strong>, com detalhamento de <strong class=\"text-bcb-dark\">Patrimônio Líquido</strong>, <strong class=\"text-bcb-dark\">Resultado Credor/Devedor</strong>, <strong class=\"text-bcb-dark\">Instrumentos de Dívida Elegíveis a Capital Complementar/Nível 2</strong> e <strong class=\"text-bcb-dark\">Participações no capital de instituições financeiras associadas ao FGC</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Anexo V</strong>: Rubricas para <strong class=\"text-bcb-dark\">Valor de Referência (VR)</strong> para <strong class=\"text-bcb-dark\">Contribuições Adicionais FGC</strong> e <strong class=\"text-bcb-dark\">MATPF</strong>, exemplificada por <strong class=\"text-bcb-dark\">9.8.2.25.00.00-2 VALOR DE REFERÊNCIA (VR)</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Anexo VI</strong>: Rubricas para <strong class=\"text-bcb-dark\">Ativo de Referência (AR)</strong> para <strong class=\"text-bcb-dark\">MATPF</strong>, como <strong class=\"text-bcb-dark\">3.8.2.20.00.00-3 ATIVO DE REFERÊNCIA (AR)</strong>.</li><p class=\"mb-4 text-justify\">Estas rubricas formam o dicionário de dados contábeis que as áreas de <strong class=\"text-bcb-dark\">TI</strong> e <strong class=\"text-bcb-dark\">Contabilidade</strong> devem mapear e implementar em seus sistemas para garantir a correta apuração dos valores.</p>\n      </div>","title":"BC - Instrução Normativa BCB N° 751 de 24/06/2026","type":"Instrução Normativa","summary":"A Instrução Normativa BCB N° 751, de 24 de junho de 2026, atualiza e consolida as rubricas contábeis do Cosif essenciais para o cálculo das contribuições ao Fundo Garantidor de Créditos (FGC) e do montante a ser alocado em títulos públicos federais (MATPF). Essencial para garantir a conformidade dos sistemas contábeis e de reportes regulatórios das instituições financeiras, ela reflete ajustes decorrentes de normas superiores e substitui a IN BCB nº 566/2024.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=751","tags":[],"date":"2026-06-24","number":"BCB N° 751","updated_at":"2026-06-24T15:04:03.320Z","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52941.pdf","thumb_v":"v4","isFeatured":false},"normativos_52942":{"id":"normativos_52942","slug":"resolucao-bcb-579","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB Nº 579, de 25 de junho de 2026</strong>, representa um ajuste significativo nas diretrizes regulatórias para a elaboração e remessa de documentos contábeis por diversas instituições supervisionadas pelo <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong>. Seu objetivo primordial é aprimorar a transparência e a supervisão prudencial, consolidando requisitos e especificando responsabilidades, sobretudo para grupos econômicos e entidades com atuação internacional. A norma altera substancialmente a <strong class=\"text-bcb-dark\">Resolução BCB nº 146, de 28 de setembro de 2021</strong>, que trata da matéria contábil, buscando uma maior aderência às práticas de reporte e governança.</p><p class=\"mb-4 text-justify\">Entre as principais alterações, destacam-se a inclusão explícita de novos perfis de instituições, como as sociedades prestadoras de serviços de ativos virtuais, e a exigência de elaboração mensal do <strong class=\"text-bcb-dark\">Balancete Patrimonial Analítico</strong> para administradoras de consórcio, instituições de pagamento, sociedades corretoras e distribuidoras que possuam participações em entidades no exterior integrantes do conglomerado prudencial. Essa medida visa aprofundar o acompanhamento da saúde financeira consolidada desses grupos, independentemente da localização geográfica de suas subsidiárias ou coligadas.</p><p class=\"mb-4 text-justify\">Além disso, a norma redefine as responsabilidades de remessa de documentos, com um claro direcionamento para que as instituições líderes de conglomerados prudenciais consolidem e enviem ao <strong class=\"text-bcb-dark\">BCB</strong> os documentos de todas as entidades pertencentes ao grupo. Para as instituições que não integram conglomerados, a remessa dos documentos contábeis individuais permanece direta ao <strong class=\"text-bcb-dark\">BCB</strong>. Há ainda uma dispensa temporária, até a data-base de <strong class=\"text-bcb-dark\">junho de 2027</strong>, para a elaboração e remessa de certas informações específicas, concedendo um período de adaptação para as instituições.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é <strong class=\"text-bcb-dark\">MÉDIO</strong> devido à amplitude de instituições afetadas – abrangendo administradoras de consórcio, instituições de pagamento, corretoras, distribuidoras e sociedades prestadoras de serviços de ativos virtuais – e à complexidade inerente à adaptação de sistemas contábeis e fluxos de reporte, especialmente para as que operam em conglomerados prudenciais com entidades no exterior. Embora não seja uma mudança radical de paradigma, a exigência de relatórios mensais mais detalhados para operações internacionais e a consolidação de responsabilidades demandarão revisão de processos e <strong class=\"text-bcb-dark\">RegTechs</strong>.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução BCB N° 579, de 25 de junho de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Esta resolução altera e revoga dispositivos da <strong class=\"text-bcb-dark\">Resolução BCB nº 146, de 28 de setembro de 2021</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Altera os artigos:</strong> 2º, 2º-A, 4º, 4º-B, 5º-A, 5º-B, 12-B e 16 da <strong class=\"text-bcb-dark\">Resolução BCB nº 146/2021</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Revoga os seguintes dispositivos da Resolução BCB nº 146/2021:</strong></p><li class=\"text-justify\">a alínea “a” do inciso II do *caput* do art. 15;</li><li class=\"text-justify\">as alíneas “c”, “d”, “f”, “i” e “l” do inciso II do *caput* do art. 16.</li><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória reside na busca por maior robustez e granularidade na supervisão prudencial do sistema financeiro nacional. Ao refinar as exigências de documentos contábeis, especialmente para conglomerados com exposição internacional e novas modalidades de instituições (como as de ativos virtuais), o <strong class=\"text-bcb-dark\">BCB</strong> visa fortalecer a capacidade de monitoramento da saúde financeira, do risco sistêmico e da conformidade. A norma reflete a necessidade de acompanhar a complexidade crescente das estruturas financeiras e a globalização das operações, garantindo que as informações contábeis reflitam adequadamente a realidade econômica e patrimonial das instituições, essenciais para a estabilidade do mercado.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=579\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução BCB N° 579 de 25/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">O cronograma de adequação para as instituições financeiras e demais entidades autorizadas é dividido da seguinte forma:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">25 de junho de 2026 (Data de Publicação):</strong> Entrada em vigor das revogações da alínea “a” do inciso II do *caput* do art. 15 da <strong class=\"text-bcb-dark\">Resolução BCB nº 146/2021</strong> e das alterações no art. 16 da mesma resolução. Esta parte inclui a dispensa temporária da elaboração e remessa de certas informações (alíneas “e”, “g”, “h”, “j” e “k” do inciso II do *caput* do art. 16) <strong class=\"text-bcb-dark\">até a data-base de junho de 2027</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">1º de janeiro de 2028:</strong> Entrada em vigor dos demais dispositivos da <strong class=\"text-bcb-dark\">Resolução BCB N° 579/2026</strong>. Isso inclui as principais alterações nos arts. 2º, 2º-A, 4º, 4º-B, 5º-A, 5º-B e 12-B da <strong class=\"text-bcb-dark\">Resolução BCB nº 146/2021</strong>, que tratam das novas exigências para elaboração de documentos contábeis, a obrigatoriedade do <strong class=\"text-bcb-dark\">Balancete Patrimonial Analítico</strong> mensal para entidades no exterior e as responsabilidades de remessa de informações por conglomerados prudenciais e instituições individuais.</li>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A norma gerará um impacto operacional significativo, demandando trabalho e custos para as instituições. Será essencial revisar e adaptar os sistemas contábeis e de gestão de dados para comportar a nova exigência do <strong class=\"text-bcb-dark\">Balancete Patrimonial Analítico</strong> mensal de entidades no exterior, o que pode implicar desenvolvimento ou aquisição de novas ferramentas de <strong class=\"text-bcb-dark\">RegTech</strong>. Processos de coleta, consolidação e validação de informações deverão ser reestruturados, especialmente para líderes de conglomerados prudenciais, que assumem a responsabilidade pela remessa conjunta de dados individuais e consolidados. Além disso, a governança interna e os controles de <strong class=\"text-bcb-dark\">compliance</strong> precisarão ser atualizados para garantir a correta aplicação das novas regras e prazos, incluindo a gestão da dispensa temporária de certas informações até <strong class=\"text-bcb-dark\">junho de 2027</strong>.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução BCB N° 579/2026</strong> não especifica diretamente códigos <strong class=\"text-bcb-dark\">CADOC</strong> ou detalhes de layout como tags <strong class=\"text-bcb-dark\">XML</strong> e dicionários de dados. No entanto, as alterações no que tange à elaboração e remessa de documentos contábeis implicam necessariamente em futuras atualizações nos layouts de <strong class=\"text-bcb-dark\">CADOCs</strong> relacionados a balancetes e informações consolidadas. A exigência de um <strong class=\"text-bcb-dark\">Balancete Patrimonial Analítico</strong> mensal para entidades no exterior e a consolidação de relatórios por líderes de conglomerados sugere a necessidade de revisão em <strong class=\"text-bcb-dark\">CADOCs</strong> que coletam dados de balanço (como <strong class=\"text-bcb-dark\">CADOC 2010</strong>, <strong class=\"text-bcb-dark\">CADOC 4010</strong> ou outros correlatos para instituições de pagamento e consórcios, dependendo da especificidade) para incorporar essas novas granularidades e fluxos de reporte. Instituições devem monitorar comunicados futuros do <strong class=\"text-bcb-dark\">BCB</strong> que detalharão as alterações técnicas nos manuais de <strong class=\"text-bcb-dark\">CADOC</strong> e arquivos de leiaute.</p>\n      </div>","title":"BC - Resolução BCB N° 579 de 25/06/2026","type":"Resolução","summary":"A Resolução BCB N° 579/2026 atualiza e aprimora as exigências para a elaboração e remessa de documentos contábeis por instituições financeiras e demais entidades autorizadas pelo BCB. O foco principal é a consolidação de informações, especialmente para conglomerados prudenciais e entidades com participações ou dependências no exterior, exigindo o Balancete Patrimonial Analítico mensal para estas últimas. Fique atento aos prazos de adequação, que variam entre a data de publicação e 1º de janeiro de 2028, com uma dispensa temporária para certas informações até junho de 2027.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20BCB&numero=579","tags":[],"date":"2026-06-25","number":"BCB N° 579","updated_at":"2026-06-25T21:02:09.184Z","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52942.pdf","thumb_v":"v4","isFeatured":false},"normativos_52944":{"id":"normativos_52944","slug":"resolucao-cmn-5311","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN nº 5.311</strong>, publicada em <strong class=\"text-bcb-dark\">25 de junho de 2026</strong>, representa uma importante medida de renegociação para operações de <strong class=\"text-bcb-dark\">crédito rural</strong> concedidas no âmbito do <strong class=\"text-bcb-dark\">Programa Especial de Crédito para a Reforma Agrária (Procera)</strong>. A norma autoriza a concessão de um <strong class=\"text-bcb-dark\">rebate</strong> significativo para a liquidação de dívidas contratadas com <strong class=\"text-bcb-dark\">recursos do Orçamento Geral da União (OGU)</strong>, focando em mutuários cujos saldos devedores eram superiores a <strong class=\"text-bcb-dark\">R$10.000,00</strong> em <strong class=\"text-bcb-dark\">27 de dezembro de 2013</strong>, sejam essas operações renegociadas ou não. O objetivo é oferecer uma condição favorável para a regularização dessas pendências financeiras.</p><p class=\"mb-4 text-justify\">Para a elegibilidade e cálculo do benefício, o valor da operação é atualizado com uma taxa efetiva de juros de apenas <strong class=\"text-bcb-dark\">1,15% a.a.</strong> desde a data da contratação original até a data da liquidação, substituindo os encargos contratuais e excluindo qualquer tipo de bônus de adimplência, multas, moras ou honorários advocatícios. Este recálculo cria uma base devedora mais branda, sobre a qual incidirá o <strong class=\"text-bcb-dark\">rebate</strong>. É crucial notar que não haverá devolução de valores ao mutuário em caso de recálculo favorável, e débitos já inscritos em <strong class=\"text-bcb-dark\">Dívida Ativa da União (DAU)</strong> não são contemplados por esta resolução.</p><p class=\"mb-4 text-justify\">O principal incentivo da norma é o <strong class=\"text-bcb-dark\">rebate de 80%</strong> sobre o saldo devedor recalculado, acrescido de um desconto fixo de <strong class=\"text-bcb-dark\">R$2.000,00</strong> por mutuário, o que substitui todos os bônus de adimplência e de liquidação previstos nos contratos originais. Para operações coletivas ou grupais, a norma detalha como o saldo devedor deve ser apurado por beneficiário final ou dividido pelo número de mutuários/associados. O ônus financeiro decorrente desses descontos será integralmente do <strong class=\"text-bcb-dark\">OGU</strong> para as operações lastreadas nessa fonte, aliviando a carga sobre as <strong class=\"text-bcb-dark\">instituições financeiras</strong> que atuam como agentes. O prazo limite para que os mutuários aproveitem estas condições especiais de liquidação é <strong class=\"text-bcb-dark\">20 de de
