zembro de 2026</strong>.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">BAIXO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto sistêmico é <strong class=\"text-bcb-dark\">BAIXO</strong>, pois a norma é altamente focada em um tipo específico de <strong class=\"text-bcb-dark\">crédito rural</strong> (<strong class=\"text-bcb-dark\">Procera</strong>, <strong class=\"text-bcb-dark\">OGU</strong>-backed) e um grupo de mutuários com critérios definidos. Não altera fundamentalmente a estrutura ou regulamentação do sistema financeiro como um todo, nem exige grandes adaptações de infraestrutura ou processos que afetem a generalidade das operações bancárias. A complexidade é operacional para as <strong class=\"text-bcb-dark\">instituições financeiras</strong> que gerenciam essas carteiras, mas não sistêmica.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução CMN N° 5.311, de 25 de junho de 2026</strong></p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Esta resolução não revoga ou altera diretamente normas anteriores, mas estabelece uma nova autorização para concessão de <strong class=\"text-bcb-dark\">rebates</strong> e liquidação de operações de <strong class=\"text-bcb-dark\">crédito rural Procera</strong>, baseando-se em dispositivos legais como a <strong class=\"text-bcb-dark\">Lei nº 4.595/1964</strong>, <strong class=\"text-bcb-dark\">Lei nº 4.829/1965</strong>, <strong class=\"text-bcb-dark\">Lei nº 13.001/2014</strong> e o <strong class=\"text-bcb-dark\">Decreto nº 8.179/2013</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória reside na necessidade de fomentar a regularização de passivos de <strong class=\"text-bcb-dark\">crédito rural</strong>, especificamente para o <strong class=\"text-bcb-dark\">Programa Especial de Crédito para a Reforma Agrária (Procera)</strong>. Ao oferecer condições facilitadas de liquidação, o <strong class=\"text-bcb-dark\">BCB</strong> busca aliviar a situação financeira de produtores rurais, reduzir a inadimplência em uma carteira específica, promover a estabilidade do setor agrícola e assegurar o cumprimento de políticas públicas de reforma agrária e desenvolvimento rural, alinhando-se a estratégias macroeconômicas de suporte ao setor primário da economia.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5311\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução CMN N° 5.311 de 25/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">O cronograma de adequação e prazos importantes para as <strong class=\"text-bcb-dark\">instituições financeiras</strong> e mutuários são:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">25 de junho de 2026</strong>: Entrada em vigor da <strong class=\"text-bcb-dark\">Resolução CMN nº 5.311</strong>, data de sua publicação.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">20 de dezembro de 2026</strong>: Prazo final para que os mutuários realizem a liquidação das operações de <strong class=\"text-bcb-dark\">crédito rural Procera</strong> elegíveis, usufruindo dos <strong class=\"text-bcb-dark\">rebates</strong> e descontos previstos.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Até o dia 30 do mês subsequente à liquidação</strong>: As <strong class=\"text-bcb-dark\">instituições financeiras</strong> devem encaminhar ao <strong class=\"text-bcb-dark\">Ministério do Desenvolvimento Agrário e Agricultura Familiar</strong> as informações sobre o <strong class=\"text-bcb-dark\">número de operações</strong> e o <strong class=\"text-bcb-dark\">montante de recursos</strong> das operações liquidadas no mês anterior, referentes às operações amparadas em <strong class=\"text-bcb-dark\">recursos do OGU</strong>.</li>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A implementação desta norma gerará trabalho e custo para as <strong class=\"text-bcb-dark\">instituições financeiras</strong> que possuem carteiras de <strong class=\"text-bcb-dark\">crédito rural Procera</strong> com <strong class=\"text-bcb-dark\">recursos do OGU</strong>. Os principais processos que devem ser revisados e as atividades geradas incluem:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Identificação de Carteiras</strong>: Mapear e identificar todas as operações elegíveis com base nos critérios de <strong class=\"text-bcb-dark\">Procera</strong>, lastro <strong class=\"text-bcb-dark\">OGU</strong> e saldo devedor em <strong class=\"text-bcb-dark\">27 de dezembro de 2013</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Recálculo de Dívidas</strong>: Desenvolver ou adaptar sistemas para realizar o recálculo do saldo devedor aplicando a taxa de <strong class=\"text-bcb-dark\">1,15% a.a.</strong> e os descontos previstos, excluindo os encargos de inadimplência.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Comunicação e Atendimento ao Cliente</strong>: Estabelecer um plano de comunicação proativo para informar os mutuários elegíveis sobre as novas condições e o prazo, além de treinar equipes de atendimento para sanar dúvidas e auxiliar no processo de liquidação.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Processamento de Liquidações</strong>: Adaptar os fluxos operacionais para processar as liquidações com as novas condições, garantindo a aplicação correta dos <strong class=\"text-bcb-dark\">rebates</strong> e descontos.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Controle e Reporte</strong>: Criar ou ajustar mecanismos de controle para monitorar as liquidações e consolidar as informações necessárias para o reporte mensal ao <strong class=\"text-bcb-dark\">Ministério do Desenvolvimento Agrário e Agricultura Familiar</strong>, conforme Art. 5º da Resolução.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Treinamento</strong>: Assegurar que as equipes relevantes estejam plenamente capacitadas nas novas regras e procedimentos para garantir a conformidade e a eficiência operacional.</li>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN nº 5.311/2026</strong> não especifica alterações diretas em layouts de sistemas, <strong class=\"text-bcb-dark\">CADOCs</strong>, tabelas de domínios, dicionários de dados, tags <strong class=\"text-bcb-dark\">XML</strong> ou protocolos de transmissão. A única exigência de reporte é o envio de informações ao <strong class=\"text-bcb-dark\">Ministério do Desenvolvimento Agrário e Agricultura Familiar</strong> sobre o <strong class=\"text-bcb-dark\">número de operações</strong> e o <strong class=\"text-bcb-dark\">montante de recursos</strong> liquidados. Este reporte deve ser feito pelas <strong class=\"text-bcb-dark\">instituições financeiras</strong> até o dia <strong class=\"text-bcb-dark\">30 do mês subsequente à liquidação</strong>, e geralmente envolve uma consolidação administrativa ou um formulário específico, não um novo <strong class=\"text-bcb-dark\">CADOC</strong> complexo ou alteração de layout técnico padronizado do <strong class=\"text-bcb-dark\">BCB</strong>. Não há URLs indicadas para alterações de layout.</p>\n      </div>","title":"BC - Resolução CMN N° 5.311 de 25/06/2026","type":"Resolução","summary":"A Resolução CMN nº 5.311/2026 é uma oportunidade única para mutuários de crédito rural Procera com operações lastreadas no OGU regularizarem suas dívidas. Fique atento ao prazo de liquidação até 20 de dezembro de 2026 e aos critérios de elegibilidade para usufruir de um rebate de 80% e desconto fixo de R$2.000,00, com recálculo favorável dos encargos. Instituições financeiras devem agilizar a comunicação e operacionalização para garantir o compliance e o benefício aos clientes.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5311","isFeatured":false,"tags":[],"date":"2026-06-25","number":"CMN N° 5.311","updated_at":"2026-06-25T23:43:22.406Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52944.pdf"},"normativos_52945":{"id":"normativos_52945","slug":"resolucao-cmn-5312","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN Nº 5.312</strong>, publicada em <strong class=\"text-bcb-dark\">25 de junho de 2026</strong>, tem como principal objetivo atualizar os preços de garantia para produtos amparados pelo <strong class=\"text-bcb-dark\">Programa de Garantia de Preços para a Agricultura Familiar (PGPAF)</strong>. Esta norma insere no <strong class=\"text-bcb-dark\">Manual de Crédito Rural (MCR)</strong> a <strong class=\"text-bcb-dark\">Tabela 2 - Preços de garantia vigentes sobre as operações de custeio e investimento</strong>, aplicável para vencimentos entre <strong class=\"text-bcb-dark\">10 de julho de 2026</strong> e <strong class=\"text-bcb-dark\">9 de julho de 2027</strong>, detalhando valores para diversos produtos agrícolas em diferentes regiões do país.</p><p class=\"mb-4 text-justify\">Além da atualização dos preços, a resolução promove alterações importantes na <strong class=\"text-bcb-dark\">Seção 15 (PGPAF)</strong> do <strong class=\"text-bcb-dark\">Capítulo 10 (Pronaf)</strong> do <strong class=\"text-bcb-dark\">MCR</strong>. As mudanças incluem a determinação de que o bônus de desconto do <strong class=\"text-bcb-dark\">PGPAF</strong> em operações prorrogadas deverá ser concedido sobre o saldo devedor, com base nos percentuais da nova data de vencimento. Adicionalmente, a norma reforça que a concessão do bônus está condicionada à posse de um <strong class=\"text-bcb-dark\">Cadastro Nacional da Agricultura Familiar (CAF) ativo</strong>, enquadrado no <strong class=\"text-bcb-dark\">Pronaf</strong> e registrado eletronicamente no sistema do <strong class=\"text-bcb-dark\">MDA</strong> na data de pagamento, sendo de responsabilidade da instituição financeira a verificação dessa condição.</p><p class=\"mb-4 text-justify\">Por fim, a resolução estabelece que, em caso de concessão indevida do bônus com base em <strong class=\"text-bcb-dark\">CAF inativo</strong>, a instituição financeira deverá seguir o procedimento de devolução da subvenção econômica. Essas medidas visam garantir maior precisão na aplicação dos subsídios governamentais, fortalecer a gestão de riscos e assegurar a transparência e conformidade nas operações de crédito rural direcionadas à agricultura familiar.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é <strong class=\"text-bcb-dark\">MÉDIO</strong> para o sistema financeiro, uma vez que afeta diretamente as instituições autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong> que operam com crédito rural, especialmente no âmbito do <strong class=\"text-bcb-dark\">Programa Nacional de Fortalecimento da Agricultura Familiar (Pronaf)</strong> e <strong class=\"text-bcb-dark\">PGPAF</strong>. Requer ajustes em sistemas de cálculo, verificação de dados e processos operacionais, mas não altera a estrutura regulatória fundamental para a maioria das instituições que não atuam neste segmento.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> Resolução CMN Nº 5.312, de <strong class=\"text-bcb-dark\">25 de junho de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Esta resolução altera a <strong class=\"text-bcb-dark\">Seção 15 (Programa de Garantia de Preços para a Agricultura Familiar – PGPAF)</strong> do <strong class=\"text-bcb-dark\">Capítulo 10 (Programa Nacional de Fortalecimento da Agricultura Familiar – Pronaf)</strong> do <strong class=\"text-bcb-dark\">Manual de Crédito Rural (MCR)</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória reside na necessidade de garantir o apoio à agricultura familiar através da estabilização de preços mínimos para seus produtos, mitigando riscos de mercado. A atualização dos preços visa refletir as condições econômicas e de produção atuais, enquanto as alterações nas regras de concessão de bônus buscam aprimorar a efetividade do programa, assegurar a correta aplicação dos recursos públicos e fortalecer a conformidade, exigindo a verificação rigorosa do <strong class=\"text-bcb-dark\">CAF ativo</strong>.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5312\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução CMN N° 5.312 de 25/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN Nº 5.312</strong> entra em vigor em <strong class=\"text-bcb-dark\">10 de julho de 2026</strong>. Isso significa que todas as instituições financeiras que operam com o <strong class=\"text-bcb-dark\">Pronaf</strong> e o <strong class=\"text-bcb-dark\">PGPAF</strong> devem estar plenamente adequadas às novas disposições até essa data. Os novos preços de garantia, conforme a <strong class=\"text-bcb-dark\">Tabela 2</strong>, serão aplicados para operações de custeio e investimento com vencimento a partir de <strong class=\"text-bcb-dark\">10 de julho de 2026</strong> até <strong class=\"text-bcb-dark\">9 de julho de 2027</strong>. Assim, os sistemas e processos internos de concessão de crédito, cálculo de bônus e verificação de elegibilidade (especialmente o <strong class=\"text-bcb-dark\">CAF ativo</strong>) devem estar atualizados e operacionais antes da data de entrada em vigor para evitar inconformidades e riscos de devolução de subvenções.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A implementação desta norma gera trabalho e custo para as instituições financeiras, exigindo a revisão e adaptação de diversos processos operacionais:</p><p class=\"mb-4 text-justify\">1.  <strong class=\"text-bcb-dark\">Revisão de Processos de Crédito Rural</strong>: Necessidade de revisar e atualizar os fluxos de trabalho e sistemas de concessão de crédito rural, especialmente para operações enquadradas no <strong class=\"text-bcb-dark\">Pronaf</strong> e com amparo do <strong class=\"text-bcb-dark\">PGPAF</strong>.</p><p class=\"mb-4 text-justify\">2.  <strong class=\"text-bcb-dark\">Adaptação de Sistemas de Cálculo</strong>: Requer alterações nos sistemas responsáveis pelo cálculo do bônus de desconto do <strong class=\"text-bcb-dark\">PGPAF</strong>, ajustando a lógica para operações prorrogadas e incorporando os novos valores da <strong class=\"text-bcb-dark\">Tabela 2</strong> de preços de garantia. Isso pode envolver desenvolvimento de software, testes e homologação.</p><p class=\"mb-4 text-justify\">3.  <strong class=\"text-bcb-dark\">Fortalecimento da Verificação de </strong>CAF<strong class=\"text-bcb-dark\"></strong>: Os processos de due diligence e elegibilidade devem ser aprimorados, garantindo a consulta e validação eletrônica do status do <strong class=\"text-bcb-dark\">Cadastro Nacional da Agricultura Familiar (CAF)</strong> no sistema do <strong class=\"text-bcb-dark\">MDA</strong> para cada mutuário. Isso pode demandar novas integrações ou automatizações.</p><p class=\"mb-4 text-justify\">4.  <strong class=\"text-bcb-dark\">Treinamento de Equipes</strong>: As equipes de atendimento, gerentes de conta e analistas de crédito precisarão ser treinadas sobre as novas regras, a atualização dos preços e, principalmente, sobre a obrigatoriedade e o processo de verificação do <strong class=\"text-bcb-dark\">CAF ativo</strong> para a concessão do bônus.</p><p class=\"mb-4 text-justify\">5.  <strong class=\"text-bcb-dark\">Controle e Compliance</strong>: Aumenta a necessidade de controles internos robustos para garantir que os bônus sejam concedidos apenas a mutuários elegíveis com <strong class=\"text-bcb-dark\">CAF ativo</strong>, mitigando o risco de devolução de subvenção econômica, conforme previsto na legislação.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">As alterações técnicas decorrem principalmente da atualização dos parâmetros de cálculo e elegibilidade no contexto do <strong class=\"text-bcb-dark\">PGPAF</strong> dentro do <strong class=\"text-bcb-dark\">MCR</strong>.</p><p class=\"mb-4 text-justify\">1.  <strong class=\"text-bcb-dark\">Atualização de Tabelas de Preços</strong>: As instituições deverão incorporar a nova <strong class=\"text-bcb-dark\">Tabela 2 - Preços de garantia vigentes sobre as operações de custeio e investimento com vencimento de 10/7/2026 até 9/7/2027</strong> do <strong class=\"text-bcb-dark\">Anexo I</strong> do <strong class=\"text-bcb-dark\">MCR</strong> em seus sistemas que gerenciam operações de crédito rural. Isso implica atualização de bases de dados e parâmetros em motores de cálculo.</p><p class=\"mb-4 text-justify\">2.  <strong class=\"text-bcb-dark\">Lógica de Cálculo de Bônus</strong>: Os sistemas que calculam o bônus de desconto do <strong class=\"text-bcb-dark\">PGPAF</strong> precisarão ser ajustados para considerar o saldo devedor das operações prorrogadas, aplicando os percentuais estabelecidos para a nova data de vencimento da parcela ou do contrato prorrogado.</p><p class=\"mb-4 text-justify\">3.  <strong class=\"text-bcb-dark\">Verificação de </strong>CAF<strong class=\"text-bcb-dark\"> Ativo</strong>: Implementação ou aprimoramento de rotinas de integração e verificação do status do <strong class=\"text-bcb-dark\">Cadastro Nacional da Agricultura Familiar (CAF)</strong>. Os sistemas deverão consultar o sistema de registro do <strong class=\"text-bcb-dark\">MDA</strong> para assegurar que o <strong class=\"text-bcb-dark\">CAF</strong> do mutuário esteja <strong class=\"text-bcb-dark\">ativo</strong> e enquadrado no <strong class=\"text-bcb-dark\">Pronaf</strong> na data do pagamento da prestação. Isso pode envolver o uso de APIs ou outros métodos de integração com o sistema do <strong class=\"text-bcb-dark\">MDA</strong>. Não foram indicadas URLs específicas para alterações de layout de sistemas externos ou <strong class=\"text-bcb-dark\">CADOCs</strong> no corpo da norma, mas as alterações no <strong class=\"text-bcb-dark\">MCR</strong> podem se refletir indiretamente em relatórios como o <strong class=\"text-bcb-dark\">CADOC 4010 (Crédito Rural)</strong>, exigindo revisão de dicionários de dados internos.</p>\n      </div>","title":"BC - Resolução CMN N° 5.312 de 25/06/2026","type":"Resolução","summary":"A Resolução CMN Nº 5.312, de 25 de junho de 2026, atualiza os Preços de Garantia do PGPAF e ajusta as regras para concessão de bônus no MCR, especialmente em operações prorrogadas e na verificação do CAF ativo. Instituições financeiras que operam com o Pronaf devem revisar seus sistemas e processos até 10 de julho de 2026 para assegurar a conformidade, evitando perdas de subvenção.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5312","isFeatured":false,"tags":[],"date":"2026-06-25","number":"CMN N° 5.312","updated_at":"2026-06-25T23:43:22.406Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52945.pdf"},"normativos_52946":{"id":"normativos_52946","slug":"resolucao-cmn-5313","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.313, de 25 de junho de 2026</strong>, publicada pelo <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong>, representa uma importante alteração no arcabouço regulatório do sistema financeiro nacional. Esta norma modifica a <strong class=\"text-bcb-dark\">Resolução CMN nº 5.309, de 19 de junho de 2026</strong>, com o objetivo central de refinar e padronizar a metodologia de cálculo das taxas de juros aplicáveis aos <strong class=\"text-bcb-dark\">contratos de financiamento</strong>, visando maior transparência e uniformidade no mercado de crédito.</p><p class=\"mb-4 text-justify\">As alterações promovidas impactam especificamente o <strong class=\"text-bcb-dark\">Art. 3º, § 5º</strong>, e o <strong class=\"text-bcb-dark\">Art. 4º, § 4º</strong> da norma anterior. A principal mudança metodológica estabelece que as taxas de juros dos contratos de financiamento serão calculadas mediante a <strong class=\"text-bcb-dark\">conversão em fatores dos encargos</strong> previstos em incisos específicos da norma e sua posterior <strong class=\"text-bcb-dark\">multiplicação</strong>. Esta abordagem visa garantir que a composição da taxa final seja calculada de forma homogênea por <strong class=\"text-bcb-dark\">todas as instituições financeiras</strong> e entidades autorizadas a operar pelo <strong class=\"text-bcb-dark\">BCB</strong>, eliminando ambiguidades e promovendo a comparabilidade dos produtos.</p><p class=\"mb-4 text-justify\">Com efeito imediato a partir de sua publicação, a <strong class=\"text-bcb-dark\">Resolução</strong> exige que as instituições revisem e ajustem prontamente seus sistemas, processos e modelos de precificação. O aprimoramento na <strong class=\"text-bcb-dark\">metodologia de cálculo de juros</strong> reforça o compromisso do <strong class=\"text-bcb-dark\">BCB</strong> com a integridade e a solidez do mercado financeiro, impactando diretamente a forma como os produtos de financiamento são ofertados e precificados no cenário macroeconômico e prudencial brasileiro.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">Apesar de ser uma alteração específica em parágrafos de uma norma existente, o impacto é considerado <strong class=\"text-bcb-dark\">MÉDIO</strong> por afetar diretamente a base de cálculo das taxas de juros em <strong class=\"text-bcb-dark\">contratos de financiamento</strong>, um pilar fundamental da operação de <strong class=\"text-bcb-dark\">todas as instituições financeiras</strong>. A necessidade de revisão e adaptação de sistemas de precificação, <strong class=\"text-bcb-dark\">compliance</strong> e controles internos para incorporar a nova metodologia de <strong class=\"text-bcb-dark\">conversão em fatores dos encargos</strong> e sua <strong class=\"text-bcb-dark\">multiplicação</strong> exige esforços consideráveis, embora não introduza um produto ou requisito regulatório completamente novo.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução CMN N° 5.313, de 25 de junho de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Altera a <strong class=\"text-bcb-dark\">Resolução CMN nº 5.309, de 19 de junho de 2026</strong>, especificamente o <strong class=\"text-bcb-dark\">Art. 3º, § 5º</strong>, e o <strong class=\"text-bcb-dark\">Art. 4º, § 4º</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A <strong class=\"text-bcb-dark\">Resolução</strong> tem como base legal o <strong class=\"text-bcb-dark\">art. 9º da Lei nº 4.595, de 31 de dezembro de 1964</strong>, o <strong class=\"text-bcb-dark\">art. 4º, *caput*, inciso VI, da Lei nº 4.595, de 31 de dezembro de 1964</strong>, o <strong class=\"text-bcb-dark\">art. 8º-A da Lei nº 14.947, de 2 de agosto de 2024</strong>, e a <strong class=\"text-bcb-dark\">Medida Provisória nº 1.366, de 12 de junho de 2026</strong>. Sua motivação regulatória reside na busca por maior clareza, padronização e previsibilidade na <strong class=\"text-bcb-dark\">metodologia de cálculo das taxas de juros</strong> aplicadas a <strong class=\"text-bcb-dark\">contratos de financiamento</strong> no sistema financeiro nacional. Ao refinar a forma como os <strong class=\"text-bcb-dark\">encargos</strong> são considerados na formação da taxa final, o <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong> visa promover a equidade e a transparência, mitigando riscos de interpretações diversas e fortalecendo a confiança no mercado de crédito.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5313\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução CMN N° 5.313 de 25/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">Conforme o <strong class=\"text-bcb-dark\">Art. 2º</strong> da <strong class=\"text-bcb-dark\">Resolução CMN N° 5.313</strong>, a norma entra em vigor na data de sua publicação, ou seja, em <strong class=\"text-bcb-dark\">25 de junho de 2026</strong>. Isso significa que a adequação deve ser <strong class=\"text-bcb-dark\">imediata</strong> para <strong class=\"text-bcb-dark\">todas as instituições financeiras</strong> e demais entidades autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong> que oferecem <strong class=\"text-bcb-dark\">contratos de financiamento</strong>. Não há período de transição ou fases de implementação; a nova metodologia de <strong class=\"text-bcb-dark\">cálculo das taxas de juros</strong> deve ser aplicada aos contratos regidos por esta norma a partir da data de sua vigência. A prontidão para a conformidade é crucial para evitar não conformidades.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A implementação desta <strong class=\"text-bcb-dark\">Resolução</strong> gerará trabalho significativo e custos para as instituições. Os principais processos que deverão ser revisados incluem:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Desenvolvimento e TI</strong>: Atualização dos sistemas de cálculo de juros e precificação de produtos de financiamento para incorporar a nova metodologia de <strong class=\"text-bcb-dark\">conversão em fatores dos encargos</strong> e <strong class=\"text-bcb-dark\">multiplicação</strong>. Isso envolve desenvolvimento, testes rigorosos e homologação.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Crédito e Produtos</strong>: Revisão das tabelas de precificação e simulações de crédito para garantir a aderência à nova regra.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Risco e *Compliance</strong>*: Validação dos modelos internos de precificação e risco, bem como a atualização das políticas e procedimentos de <strong class=\"text-bcb-dark\">compliance</strong> para refletir a nova base de cálculo.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Jurídico</strong>: Análise e, se necessário, adaptação de modelos de <strong class=\"text-bcb-dark\">contratos de financiamento</strong> e seus aditivos para refletir a clareza exigida pela norma.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Treinamento</strong>: Capacitação de equipes de vendas, atendimento, <strong class=\"text-bcb-dark\">compliance</strong> e tecnologia sobre as mudanças operacionais e seus impactos.</li><p class=\"mb-4 text-justify\">O custo será gerado principalmente pela alocação de recursos humanos e tecnológicos para as adaptações sistêmicas e procedimentais.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.313</strong> não especifica diretamente alterações em layouts de documentos regulatórios (ex: <strong class=\"text-bcb-dark\">CADOCs</strong>) ou em padrões técnicos como <strong class=\"text-bcb-dark\">tabelas de domínios</strong>, <strong class=\"text-bcb-dark\">dicionários de dados</strong>, <strong class=\"text-bcb-dark\">tags XML</strong> ou <strong class=\"text-bcb-dark\">protocolos de transmissão</strong>. Contudo, como a norma impacta a <strong class=\"text-bcb-dark\">metodologia de cálculo das taxas de juros</strong> dos <strong class=\"text-bcb-dark\">contratos de financiamento</strong>, é <strong class=\"text-bcb-dark\">imprescindível</strong> que as instituições avaliem internamente a necessidade de ajustes em seus sistemas legados e plataformas de precificação de crédito. Embora não haja uma URL explícita para layouts, a mudança na <strong class=\"text-bcb-dark\">lógica de cálculo</strong> (<strong class=\"text-bcb-dark\">conversão em fatores dos encargos</strong> e <strong class=\"text-bcb-dark\">multiplicação</strong>) exigirá revisão de código-fonte e algoritmos que geram as taxas e alimentam sistemas de gestão de contratos, contabilidade e relatórios internos e regulatórios, ainda que estes últimos não sejam explicitamente listados na norma.</p>\n      </div>","title":"BC - Resolução CMN N° 5.313 de 25/06/2026","type":"Resolução","summary":"A Resolução CMN N° 5.313, de 25 de junho de 2026, emitida pelo Banco Central do Brasil (BCB), foca na alteração da metodologia de cálculo das taxas de juros para contratos de financiamento. Essencial para as instituições financeiras, ela esclarece como encargos específicos devem ser convertidos em fatores e multiplicados para determinar a taxa final, buscando maior padronização no mercado. Sua eficácia é imediata, exigindo pronta adequação.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5313","isFeatured":false,"tags":[],"date":"2026-06-25","number":"CMN N° 5.313","updated_at":"2026-06-25T23:43:22.406Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52946.pdf"},"normativos_52947":{"id":"normativos_52947","slug":"resolucao-cmn-5314","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.314, de 25 de junho de 2026</strong>, emitida pelo <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong>, introduz alterações significativas no <strong class=\"text-bcb-dark\">Manual de Crédito Rural (MCR)</strong>, com o objetivo de modernizar e aprimorar a regulamentação do crédito agrícola no país. Esta norma impacta diretamente a operacionalização e as condições de financiamento de todas as instituições financeiras que atuam no segmento, buscando maior clareza, transparência e alinhamento com as diretrizes do <strong class=\"text-bcb-dark\">Conselho Monetário Nacional (CMN)</strong>.</p><p class=\"mb-4 text-justify\">Entre as principais mudanças, destaca-se a nova classificação das fontes de recursos para crédito rural. O <strong class=\"text-bcb-dark\">MCR</strong> passa a diferenciar recursos quanto à origem (<strong class=\"text-bcb-dark\">direcionados</strong> ou <strong class=\"text-bcb-dark\">livres</strong>) e quanto às condições de encargos financeiros (<strong class=\"text-bcb-dark\">controlados</strong> pelo <strong class=\"text-bcb-dark\">CMN</strong> ou <strong class=\"text-bcb-dark\">não controlados</strong>, pactuados entre as partes). Além disso, a resolução estabelece a vedação explícita de financiamento, com recursos direcionados e controlados, para empreendimentos cujo projeto ou orçamento preveja a <strong class=\"text-bcb-dark\">supressão da vegetação nativa</strong>, reforçando o compromisso com a sustentabilidade ambiental. Também são ajustadas as condições para prorrogação de dívidas rurais em situações de dificuldade temporária.</p><p class=\"mb-4 text-justify\">A norma detalha as consequências da não aplicação das exigibilidades de crédito rural, que agora sujeitam as instituições ao pagamento de custo financeiro e à abertura de processo administrativo sancionador, conforme a <strong class=\"text-bcb-dark\">Lei nº 13.506/2017</strong>. Para operações com recursos <strong class=\"text-bcb-dark\">não controlados</strong>, é concedida maior flexibilidade na pactuação das condições contratuais, mas mantendo a aplicação de certas seções do <strong class=\"text-bcb-dark\">MCR</strong>, como as relativas a impedimentos sociais, ambientais e climáticos. Estas medidas visam aprimorar a alocação de recursos, gerenciar riscos de forma mais eficaz e promover um agronegócio mais responsável.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">ALTO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é <strong class=\"text-bcb-dark\">ALTO</strong> para as instituições financeiras com atuação relevante em crédito rural, pois exige uma revisão profunda dos sistemas, processos e políticas internas. As novas classificações de recursos (<strong class=\"text-bcb-dark\">controlados</strong> e <strong class=\"text-bcb-dark\">não controlados</strong>), a vedação ambiental e as exigibilidades com sanções por não cumprimento demandam investimentos em <strong class=\"text-bcb-dark\">RegTech</strong> e <strong class=\"text-bcb-dark\">Compliance</strong> para adaptação.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> Resolução CMN N° 5.314, de 25 de junho de 2026.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Altera diversas seções do <strong class=\"text-bcb-dark\">Manual de Crédito Rural (MCR)</strong>, incluindo as Seções 6 (Reembolso), 9 (Impedimentos Sociais, Ambientais e Climáticos) do Capítulo 2; Seção 2 (Créditos de Custeio) do Capítulo 3; e Seções 1 (Disposições Gerais), 2 (Obrigatórios), 3 (Livres, agora 'Recursos Não Controlados'), 4 (Poupança Rural) e 7 (Letra de Crédito do Agronegócio – <strong class=\"text-bcb-dark\">LCA</strong>) do Capítulo 6. Revoga os itens 2 e 3 da Seção 1 do Capítulo 6 do <strong class=\"text-bcb-dark\">MCR</strong>, e as alíneas “a” e “b” do item 7-A da Seção 7 do Capítulo 6 do <strong class=\"text-bcb-dark\">MCR</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória reside na necessidade de fortalecer a <strong class=\"text-bcb-dark\">gestão de riscos no crédito rural</strong>, promover a <strong class=\"text-bcb-dark\">sustentabilidade ambiental</strong> na concessão de financiamentos (especialmente com a vedação da <strong class=\"text-bcb-dark\">supressão de vegetação nativa</strong>) e conferir maior <strong class=\"text-bcb-dark\">transparência e flexibilidade</strong> às instituições financeiras na gestão das diversas fontes de recursos. A reclassificação visa otimizar a alocação de capital e alinhar as práticas do setor com as diretrizes prudenciais e socioambientais do <strong class=\"text-bcb-dark\">CMN</strong>.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5314\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução CMN N° 5.314 de 25/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.314, de 25 de junho de 2026</strong>, entra em vigor em <strong class=\"text-bcb-dark\">1º de julho de 2026</strong>. Todas as instituições financeiras e demais entidades autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong> que operam com crédito rural devem estar plenamente adequadas às novas disposições normativas a partir dessa data. Isso inclui a implementação das novas classificações de recursos, a vedação à <strong class=\"text-bcb-dark\">supressão de vegetação nativa</strong>, as regras de prorrogação e os procedimentos de consignação da fonte de recursos nos instrumentos de crédito.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A implementação desta norma gerará trabalho e custo significativos para as instituições financeiras. Será necessário investir em: <strong class=\"text-bcb-dark\">1)</strong> <strong class=\"text-bcb-dark\">Treinamento</strong> de equipes nas áreas de crédito, <strong class=\"text-bcb-dark\">compliance</strong>, jurídico e <strong class=\"text-bcb-dark\">TI</strong> sobre as novas classificações de recursos (<strong class=\"text-bcb-dark\">controlados/não controlados</strong>), regras de prorrogação e, principalmente, a vedação a projetos com <strong class=\"text-bcb-dark\">supressão de vegetação nativa</strong>; <strong class=\"text-bcb-dark\">2)</strong> <strong class=\"text-bcb-dark\">Adaptação de Sistemas</strong> para ajustar a lógica de registro, classificação e controle das operações de crédito rural, bem como para incorporar as novas validações socioambientais; <strong class=\"text-bcb-dark\">3)</strong> <strong class=\"text-bcb-dark\">Revisão de Processos</strong> internos de análise e concessão de crédito para incluir a verificação ambiental, e de processos de acompanhamento e monitoramento de operações; <strong class=\"text-bcb-dark\">4)</strong> <strong class=\"text-bcb-dark\">Atualização de Documentação Legal e Contratual</strong>, incluindo contratos-padrão de crédito rural e políticas internas; <strong class=\"text-bcb-dark\">5)</strong> <strong class=\"text-bcb-dark\">Adequação de Relatórios Regulatórios</strong>, o que demandará a revisão dos procedimentos de geração de <strong class=\"text-bcb-dark\">CADOCs</strong> para garantir a consistência com as novas definições e classificações. O descumprimento pode levar a custos financeiros e sanções administrativas severas.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução</strong> não detalha alterações específicas em layouts de documentos regulatórios (<strong class=\"text-bcb-dark\">CADOCs</strong>) ou estruturas de dados (tabelas, dicionários, tags XML). No entanto, as profundas mudanças nas classificações de fontes de recursos (<strong class=\"text-bcb-dark\">direcionados/livres</strong> e <strong class=\"text-bcb-dark\">controlados/não controlados</strong>) e nas regras de impedimentos socioambientais terão um impacto <strong class=\"text-bcb-dark\">direto</strong> nos sistemas de informação das instituições. Os sistemas de registro e acompanhamento de operações de crédito rural precisarão ser adaptados para acomodar as novas categorizações e validações. Isso <strong class=\"text-bcb-dark\">implicará</strong> na necessidade de atualização de campos para indicar a fonte e condições dos recursos, além de incorporar novas lógicas para a vedação de financiamento para projetos com <strong class=\"text-bcb-dark\">supressão de vegetação nativa</strong>. É <strong class=\"text-bcb-dark\">crucial</strong> que as áreas de <strong class=\"text-bcb-dark\">TI</strong> e <strong class=\"text-bcb-dark\">RegTech</strong> das instituições monitorem as futuras comunicações do <strong class=\"text-bcb-dark\">BCB</strong> que detalharão as adaptações nos <strong class=\"text-bcb-dark\">CADOCs</strong> relacionados ao crédito rural (e.g., <strong class=\"text-bcb-dark\">CADOCs</strong> 21XX, 23XX, 27XX) e eventuais modificações em seus leiautes ou dicionários de dados para garantir a conformidade na remessa de informações regulatórias.</p>\n      </div>","title":"BC - Resolução CMN N° 5.314 de 25/06/2026","type":"Resolução","summary":"A Resolução CMN N° 5.314, de 25 de junho de 2026, promove ajustes cruciais no Manual de Crédito Rural (MCR). Ela reclassifica as fontes de recursos, distinguindo claramente entre controlados e não controlados, e estabelece uma importante vedação a financiamentos que prevejam a supressão de vegetação nativa. Instituições devem revisar seus processos e sistemas para adequação, com atenção especial à data de entrada em vigor em 1º de julho de 2026 e às implicações para a conformidade socioambiental.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5314","isFeatured":false,"tags":[],"date":"2026-06-25","number":"CMN N° 5.314","updated_at":"2026-06-25T23:43:22.406Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52947.pdf"},"normativos_52948":{"id":"normativos_52948","slug":"resolucao-cmn-5315","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN nº 5.315</strong>, de <strong class=\"text-bcb-dark\">25 de junho de 2026</strong>, emitida pelo <strong class=\"text-bcb-dark\">Conselho Monetário Nacional (CMN)</strong> por intermédio do <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong>, promove alterações significativas nas regras do <strong class=\"text-bcb-dark\">Programa de Garantia da Atividade Agropecuária (Proagro)</strong>. Publicada em <strong class=\"text-bcb-dark\">25 de junho de 2026</strong>, esta norma visa aprimorar os mecanismos de proteção ao produtor rural, focando na eficiência e na precisão da apuração e compensação de perdas, o que impacta diretamente as instituições financeiras que operam o crédito rural. As modificações introduzidas atualizam o <strong class=\"text-bcb-dark\">Manual de Crédito Rural (MCR)</strong>, que rege as operações do programa.</p><p class=\"mb-4 text-justify\">As principais inovações regulatórias concentram-se em dois pilares fundamentais. Primeiramente, a norma flexibiliza a <strong class=\"text-bcb-dark\">comprovação de perdas</strong> em casos de alta gravidade, permitindo que o relatório de vistoria seja concluído com uma única visita ao empreendimento, desde que observadas condições cumulativas específicas. Em segundo lugar, há um reforço nas exigências documentais, notadamente a obrigatoriedade de registrar a situação do empreendimento com, no mínimo, <strong class=\"text-bcb-dark\">três fotos coloridas</strong> por visita, que devem ter <strong class=\"text-bcb-dark\">resolução e tomada de posição adequadas</strong>, incluir <strong class=\"text-bcb-dark\">pontos de referência</strong> e, crucialmente, utilizar <strong class=\"text-bcb-dark\">tecnologia que ateste a captura em localização geográfica</strong> contida nas coordenadas geodésicas da área enquadrada. Além disso, a Tabela 1 de <strong class=\"text-bcb-dark\">Alíquotas do adicional para enquadramento de empreendimento</strong> no <strong class=\"text-bcb-dark\">Proagro</strong> e no <strong class=\"text-bcb-dark\">Proagro Mais</strong> foi atualizada.</p><p class=\"mb-4 text-justify\">Em síntese, a resolução busca modernizar e desburocratizar os processos de apuração de sinistros, ao mesmo tempo em que reforça a integridade e a veracidade das informações apresentadas. Essas mudanças são essenciais para otimizar a operacionalização do <strong class=\"text-bcb-dark\">Proagro</strong>, beneficiando tanto os agricultores, que terão processos de indenização potencialmente mais ágeis, quanto as instituições financeiras, que precisarão adaptar seus sistemas e procedimentos para garantir a <strong class=\"text-bcb-dark\">conformidade (compliance)</strong> e a sustentabilidade do programa.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">As alterações são específicas para o <strong class=\"text-bcb-dark\">Programa de Garantia da Atividade Agropecuária (Proagro)</strong>, impactando diretamente as instituições financeiras que operam com crédito rural. Requer adaptações em processos de análise, vistoria e sistemas de informação para conformidade com as novas regras de <strong class=\"text-bcb-dark\">comprovação de perdas</strong> e cálculo de adicional, mas não altera a estrutura macroprudencial do sistema financeiro como um todo.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução CMN N° 5.315, de 25 de junho de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Altera as regras da <strong class=\"text-bcb-dark\">Seção 4</strong> (<strong class=\"text-bcb-dark\">Comprovação de Perdas</strong>) e da <strong class=\"text-bcb-dark\">Seção 10</strong> (<strong class=\"text-bcb-dark\">Alíquotas básicas do adicional para enquadramento de empreendimento no Proagro e no Proagro Mais</strong>) do <strong class=\"text-bcb-dark\">Capítulo 12</strong> (<strong class=\"text-bcb-dark\">Programa de Garantia da Atividade Agropecuária – Proagro</strong>) do <strong class=\"text-bcb-dark\">Manual de Crédito Rural – MCR</strong>. Fundamenta-se nas disposições do art. 9º da <strong class=\"text-bcb-dark\">Lei nº 4.595, de 31 de dezembro de 1964</strong>, e nos arts. 59, 65-A e 66-A da <strong class=\"text-bcb-dark\">Lei nº 8.171, de 17 de janeiro de 1991</strong>, bem como no art. 4º do <strong class=\"text-bcb-dark\">Decreto nº 175, de 10 de julho de 1991</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória reside na necessidade de aprimorar a gestão e a eficiência do <strong class=\"text-bcb-dark\">Programa de Garantia da Atividade Agropecuária (Proagro)</strong>. O objetivo é otimizar os processos de apuração e <strong class=\"text-bcb-dark\">comprovação de perdas</strong>, tornando-os mais ágeis e robustos, especialmente em cenários de alta gravidade de eventos climáticos. Isso contribui para a sustentabilidade do programa e para a mitigação de riscos tanto para os produtores rurais quanto para as instituições financeiras, ao passo que garante a correta aplicação dos recursos públicos e a fidedignidade das informações de sinistro no setor agropecuário.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5315\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução CMN N° 5.315 de 25/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN nº 5.315</strong>, de <strong class=\"text-bcb-dark\">25 de junho de 2026</strong>, estabelece que todas as instituições financeiras e demais entidades autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong> que operam o <strong class=\"text-bcb-dark\">Programa de Garantia da Atividade Agropecuária (Proagro)</strong> devem estar em total <strong class=\"text-bcb-dark\">conformidade</strong> com as novas regras a partir de <strong class=\"text-bcb-dark\">1º de julho de 2026</strong>. Isso significa que, a partir desta data, as novas metodologias para <strong class=\"text-bcb-dark\">comprovação de perdas</strong> (incluindo a vistoria única em casos específicos e os requisitos de fotografia geoespacial) e as <strong class=\"text-bcb-dark\">alíquotas básicas</strong> atualizadas para o adicional devem ser aplicadas em todos os novos enquadramentos de empreendimentos e processos de sinistro do <strong class=\"text-bcb-dark\">Proagro</strong>. Não há períodos de transição escalonados mencionados na norma, exigindo que a adequação sistêmica e processual esteja completa até a data de entrada em vigor.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A implementação desta norma implicará em trabalho e custo significativos para as instituições financeiras que atuam com crédito rural e o <strong class=\"text-bcb-dark\">Proagro</strong>. Operacionalmente, será necessário revisar e <strong class=\"text-bcb-dark\">atualizar os procedimentos internos</strong> de análise e acompanhamento de empreendimentos rurais, especialmente nas fases de vistoria e <strong class=\"text-bcb-dark\">comprovação de perdas</strong>. Equipes de campo precisarão ser treinadas nos novos requisitos para a realização de vistorias, incluindo o uso de <strong class=\"text-bcb-dark\">tecnologia de georreferenciamento</strong> para fotos. A padronização da coleta de imagens (resolução, posição, pontos de referência e presença do agricultor) demandará <strong class=\"text-bcb-dark\">novos protocolos</strong> e talvez investimentos em equipamentos ou aplicativos específicos. A <strong class=\"text-bcb-dark\">simplificação da vistoria</strong> em casos de alta gravidade, embora desburocratizante, exigirá critérios claros de elegibilidade e documentação robusta. Adicionalmente, as áreas de suporte e back-office deverão ajustar seus processos de recepção, validação e registro das informações de sinistro, bem como os cálculos das <strong class=\"text-bcb-dark\">alíquotas de adicional</strong>, para garantir a conformidade e evitar glosas futuras.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">As alterações impactam diretamente os sistemas que gerenciam as operações do <strong class=\"text-bcb-dark\">Proagro</strong>, especialmente no que tange à <strong class=\"text-bcb-dark\">comprovação de perdas</strong> e ao cálculo do <strong class=\"text-bcb-dark\">adicional para enquadramento</strong>. Embora a norma não especifique diretamente <strong class=\"text-bcb-dark\">CADOCs</strong> impactados, as mudanças na <strong class=\"text-bcb-dark\">Seção 4</strong> e <strong class=\"text-bcb-dark\">Seção 10</strong> do <strong class=\"text-bcb-dark\">MCR</strong> demandarão atualizações nos sistemas de registro de sinistros e de cálculo de garantias. Destaca-se a necessidade de implementação de funcionalidades para: 1. Captura e armazenamento de <strong class=\"text-bcb-dark\">fotos coloridas</strong> com <strong class=\"text-bcb-dark\">resolução e tomada de posição adequadas</strong>, comprovando os efeitos de eventos adversos e amostras de produção. 2. Integração com <strong class=\"text-bcb-dark\">tecnologia de georreferenciamento</strong> para atestar a localização geográfica das fotos, vinculadas às <strong class=\"text-bcb-dark\">coordenadas geodésicas</strong> da área enquadrada. 3. Atualização das tabelas de cálculos e regras de negócio para refletir as novas <strong class=\"text-bcb-dark\">alíquotas do adicional</strong> (<strong class=\"text-bcb-dark\">Tabela 1</strong> da <strong class=\"text-bcb-dark\">Seção 10</strong> do <strong class=\"text-bcb-dark\">Capítulo 12</strong> do <strong class=\"text-bcb-dark\">MCR</strong>). As equipes de desenvolvimento e sustentação de sistemas devem revisar fluxos de trabalho e telas de registro de vistorias, garantindo a coleta e validação das novas informações. O texto vigente do <strong class=\"text-bcb-dark\">MCR</strong>, onde as alterações se consolidarão, pode ser consultado em `www3.bcb.gov.br/mcr`.</p>\n      </div>","title":"BC - Resolução CMN N° 5.315 de 25/06/2026","type":"Resolução","summary":"A Resolução CMN nº 5.315, de 25 de junho de 2026, traz ajustes importantes ao Programa de Garantia da Atividade Agropecuária (Proagro). As principais mudanças envolvem a flexibilização da comprovação de perdas com uma única vistoria em situações de alta gravidade e a exigência de fotos geoespaciais e de alta resolução para documentar sinistros. Além disso, as alíquotas básicas de adicional para enquadramento foram atualizadas, visando otimizar a gestão do programa e a segurança na avaliação de eventos adversos no campo.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5315","isFeatured":false,"tags":[],"date":"2026-06-25","number":"CMN N° 5.315","updated_at":"2026-06-25T23:43:22.406Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52948.pdf"},"normativos_52949":{"id":"normativos_52949","slug":"resolucao-cmn-5316","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN nº 5.316, de 25 de junho de 2026</strong>, ajusta as normas para a elaboração e remessa do <strong class=\"text-bcb-dark\">Balancete Combinado do Sistema Cooperativo</strong> ao <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong>. Esta medida visa aprimorar a supervisão prudencial e a transparência dos sistemas cooperativos de crédito, alterando especificamente a <strong class=\"text-bcb-dark\">Resolução CMN nº 5.259, de 23 de outubro de 2025</strong>, nos seus artigos 5º e 11-A. O foco principal é detalhar o escopo da informação que deve ser consolidada e as responsabilidades pela sua submissão mensal ao <strong class=\"text-bcb-dark\">BCB</strong>.</p><p class=\"mb-4 text-justify\">A alteração no <strong class=\"text-bcb-dark\">Art. 5º</strong> estabelece que o <strong class=\"text-bcb-dark\">Balancete Combinado do Sistema Cooperativo</strong> deve agora incluir não apenas os documentos do combinado cooperativo, mas também os <strong class=\"text-bcb-dark\">documentos contábeis individuais</strong> das cooperativas que o compõem, conforme já previsto na <strong class=\"text-bcb-dark\">Resolução CMN nº 4.911, de 27 de maio de 2021</strong>. Essa exigência é particularmente relevante para sistemas cooperativos de três níveis, onde a consolidação de dados de múltiplas camadas de entidades é mais complexa, garantindo que o <strong class=\"text-bcb-dark\">BCB</strong> receba uma visão integral e precisa da saúde financeira do sistema como um todo.</p><p class=\"mb-4 text-justify\">Além disso, a introdução do <strong class=\"text-bcb-dark\">Art. 11-A</strong> na <strong class=\"text-bcb-dark\">Resolução CMN nº 5.259/2025</strong> reforça explicitamente que as atribuições e responsabilidades pela remessa do balancete combinado e dos <strong class=\"text-bcb-dark\">documentos contábeis individuais</strong> recaem sobre as instituições especificadas no Art. 5º, *caput*. Esta clarificação é vital para fortalecer a governança e a *accountability* dentro dos sistemas cooperativos, assegurando que as entidades-mãe ou centrais assumam a plena responsabilidade pela conformidade. As instituições têm até <strong class=\"text-bcb-dark\">1º de julho de 2028</strong> para se adequarem às novas disposições.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é considerado <strong class=\"text-bcb-dark\">MÉDIO</strong> porque, embora afete primariamente o segmento de sistemas cooperativos de crédito, as alterações exigem uma revisão substantiva dos processos de consolidação de dados contábeis e de *reporting* ao <strong class=\"text-bcb-dark\">BCB</strong>. A necessidade de integrar <strong class=\"text-bcb-dark\">documentos contábeis individuais</strong> e <strong class=\"text-bcb-dark\">combinados cooperativos</strong> de sistemas de três níveis demanda ajustes significativos em sistemas, fluxos de trabalho e controles internos, o que pode gerar desafios de implementação para as instituições envolvidas.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução CMN Nº 5.316, de 25 de junho de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Altera a <strong class=\"text-bcb-dark\">Resolução CMN nº 5.259, de 23 de outubro de 2025</strong>, modificando os <strong class=\"text-bcb-dark\">Art. 5º</strong> e <strong class=\"text-bcb-dark\">Art. 11-A</strong>. Também faz referência à <strong class=\"text-bcb-dark\">Resolução CMN nº 4.911, de 27 de maio de 2021</strong>, que trata dos <strong class=\"text-bcb-dark\">documentos contábeis individuais</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória reside na busca por maior <strong class=\"text-bcb-dark\">transparência</strong> e <strong class=\"text-bcb-dark\">precisão</strong> na supervisão prudencial dos sistemas cooperativos de crédito no Brasil. Ao detalhar o conteúdo e as responsabilidades pela remessa do <strong class=\"text-bcb-dark\">Balancete Combinado do Sistema Cooperativo</strong>, o <strong class=\"text-bcb-dark\">BCB</strong> visa fortalecer a governança e a *accountability* dessas instituições. Essa medida contribui para a mitigação de riscos e para a garantia da <strong class=\"text-bcb-dark\">solidez do Sistema Financeiro Nacional</strong>, especialmente diante da complexidade das estruturas cooperativas de múltiplos níveis, que exigem uma visão consolidada e detalhada para uma supervisão eficaz.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5316\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução CMN N° 5.316 de 25/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">As instituições financeiras e demais entidades autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong> que se enquadram no escopo desta norma, particularmente os sistemas cooperativos de crédito, devem iniciar seus planos de adequação imediatamente. A <strong class=\"text-bcb-dark\">Resolução CMN nº 5.316/2026</strong> entrará em vigor em <strong class=\"text-bcb-dark\">1º de julho de 2028</strong>. Isso significa que, até essa data, todos os sistemas de informação, processos operacionais e controles internos relacionados à elaboração e remessa do <strong class=\"text-bcb-dark\">Balancete Combinado do Sistema Cooperativo</strong> devem estar plenamente adaptados. A conformidade deve garantir a inclusão dos <strong class=\"text-bcb-dark\">documentos contábeis individuais</strong> e <strong class=\"text-bcb-dark\">combinados cooperativos</strong>, conforme detalhado no novo <strong class=\"text-bcb-dark\">Art. 5º, § 2º</strong>, e o atendimento às responsabilidades reforçadas pelo <strong class=\"text-bcb-dark\">Art. 11-A</strong>.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">Esta <strong class=\"text-bcb-dark\">Resolução CMN</strong> gera um impacto operacional significativo para os sistemas cooperativos de crédito. As instituições deverão revisar e, em muitos casos, reprojetar seus processos de coleta, validação e consolidação de dados contábeis. As equipes de <strong class=\"text-bcb-dark\">contabilidade</strong>, <strong class=\"text-bcb-dark\">compliance</strong>, <strong class=\"text-bcb-dark\">riscos</strong> e <strong class=\"text-bcb-dark\">TI</strong> precisarão colaborar intensamente para: 1. <strong class=\"text-bcb-dark\">Revisar e adaptar os fluxos de dados:</strong> Assegurar que os <strong class=\"text-bcb-dark\">documentos contábeis individuais</strong> sejam eficientemente coletados, tratados e integrados no processo de elaboração do <strong class=\"text-bcb-dark\">Balancete Combinado</strong>. 2. <strong class=\"text-bcb-dark\">Atualizar sistemas:</strong> Modificar os sistemas de gestão contábil e de *reporting* ao <strong class=\"text-bcb-dark\">BCB</strong> para acomodar as novas regras de consolidação. 3. <strong class=\"text-bcb-dark\">Reforçar controles internos:</strong> Estabelecer novos controles para garantir a precisão, integridade e consistência dos dados consolidados. 4. <strong class=\"text-bcb-dark\">Treinamento:</strong> Capacitar as equipes envolvidas nas novas exigências e responsabilidades. Tais esforços implicam em custos de desenvolvimento, testes, *compliance* e auditoria interna, além de demandarem um esforço contínuo para manter a conformidade e a qualidade das informações remetidas ao <strong class=\"text-bcb-dark\">BCB</strong>.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A norma não especifica diretamente alterações em layouts de documentos regulatórios (ex: <strong class=\"text-bcb-dark\">CADOCs</strong>), tags <strong class=\"text-bcb-dark\">XML</strong> ou dicionários de dados. No entanto, a exigência de incluir <strong class=\"text-bcb-dark\">documentos contábeis individuais</strong> e <strong class=\"text-bcb-dark\">documentos do combinado cooperativo</strong> no <strong class=\"text-bcb-dark\">Balancete Combinado do Sistema Cooperativo</strong> (mencionado no <strong class=\"text-bcb-dark\">Art. 5º, § 2º</strong>) implica uma potencial necessidade de revisão e/ou adaptação dos layouts dos <strong class=\"text-bcb-dark\">CADOCs</strong> ou outros relatórios eletrônicos utilizados para essa remessa. Instituições devem antecipar a possibilidade de que o <strong class=\"text-bcb-dark\">BCB</strong> possa emitir instruções complementares, alterando manuais de instruções de relatórios como o <strong class=\"text-bcb-dark\">CADOC 4016</strong> (Balancete Contábil) ou o <strong class=\"text-bcb-dark\">CADOC 4040</strong> (Balancete de Cooperativas), para acomodar a consolidação mais granular. Essas adaptações podem envolver a criação de novos campos, a reestruturação de seções ou a inclusão de chaves para identificar a origem das informações, garantindo a integridade e completude dos dados consolidados.</p>\n      </div>","title":"BC - Resolução CMN N° 5.316 de 25/06/2026","type":"Resolução","summary":"A Resolução CMN nº 5.316, de 25 de junho de 2026, aprimora a remessa do Balancete Combinado do Sistema Cooperativo ao Banco Central do Brasil. Ela detalha o que deve ser incluído, como os documentos contábeis individuais e do combinado cooperativo, e reforça as responsabilidades das instituições. O prazo de adequação é até 1º de julho de 2028. Foco em sistemas cooperativos de crédito, especialmente os de três níveis, visando maior transparência e supervisão.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5316","isFeatured":false,"tags":[],"date":"2026-06-25","number":"CMN N° 5.316","updated_at":"2026-06-25T23:43:22.406Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52949.pdf"},"normativos_52950":{"id":"normativos_52950","slug":"resolucao-cmn-5317","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.317 de 25/06/2026</strong> foi emitida pelo Conselho Monetário Nacional (<strong class=\"text-bcb-dark\">CMN</strong>) e representa uma alteração significativa na <strong class=\"text-bcb-dark\">Resolução CMN nº 4.911, de 27 de maio de 2021</strong>. Seu principal objetivo é aprimorar as regras de elaboração e remessa de documentos contábeis por parte das instituições financeiras e demais entidades autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong>. A norma busca otimizar o fluxo de informações e a supervisão prudencial, segmentando as responsabilidades de reporte com base na estrutura organizacional das instituições.</p><p class=\"mb-4 text-justify\">Esta normativa detalha quais documentos devem ser elaborados e para quem devem ser remetidos, com especial atenção para instituições com dependências ou participações no exterior, que deverão elaborar mensalmente o <strong class=\"text-bcb-dark\">Balancete Patrimonial Analítico</strong> dessas entidades. A grande inovação reside na clara segmentação das regras de remessa: instituições integrantes de conglomerado prudencial ou sistema cooperativo, instituições não integrantes dessas estruturas, e as líderes de conglomerados prudenciais. É vital notar que administradoras de consórcio, instituições de pagamento, corretoras e distribuidoras de títulos e valores mobiliários, corretoras de câmbio e sociedades prestadoras de serviços de ativos virtuais estão explicitamente excluídas do escopo desta Resolução, devendo seguir regulamentação específica do <strong class=\"text-bcb-dark\">BC
