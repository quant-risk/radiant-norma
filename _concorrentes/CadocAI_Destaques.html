B</strong>.</p><p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.317</strong> estabelece que suas disposições entram em vigor a partir de <strong class=\"text-bcb-dark\">1º de janeiro de 2028</strong>. Contudo, regras específicas para a remessa de documentos dentro dos sistemas cooperativos de crédito, envolvendo confederações e bancos cooperativos, terão efeito apenas a partir de <strong class=\"text-bcb-dark\">1º de julho de 2028</strong>. Adicionalmente, as cooperativas de crédito integrantes de sistemas cooperativos deverão seguir as regras anteriores (remessa direta ao <strong class=\"text-bcb-dark\">BCB</strong>) para os documentos contábeis com data-base até <strong class=\"text-bcb-dark\">junho de 2028</strong>. A norma visa, em última instância, fortalecer a supervisão e a qualidade dos dados contábeis reportados ao <strong class=\"text-bcb-dark\">BCB</strong>, garantindo maior transparência e acurácia no monitoramento do sistema financeiro.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é <strong class=\"text-bcb-dark\">MÉDIO</strong> pois a norma ajusta processos e fluxos de informação já existentes, sem criar novas exigências prudenciais complexas. A principal complexidade reside na adaptação dos sistemas de informação e processos operacionais para a correta segmentação e roteamento dos documentos contábeis, especialmente dentro de conglomerados e sistemas cooperativos, exigindo revisão de controles internos e responsabilidades de reporte.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução CMN N° 5.317, de 25 de junho de 2026</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Altera a <strong class=\"text-bcb-dark\">Resolução CMN nº 4.911, de 27 de maio de 2021</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória reside na necessidade de aprimorar a qualidade, a tempestividade e a clareza das informações contábeis reportadas ao <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong>. Visa fortalecer a supervisão prudencial ao detalhar as responsabilidades de elaboração e remessa de documentos, especialmente em cenários de estruturas complexas como conglomerados financeiros e sistemas cooperativos. Isso permite ao <strong class=\"text-bcb-dark\">BCB</strong> uma visão mais precisa e consolidada da saúde financeira das instituições, contribuindo para a estabilidade do sistema financeiro nacional e para a conformidade com as melhores práticas de governança de dados e reporte regulatório.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5317\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução CMN N° 5.317 de 25/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">O cronograma de adequação para a <strong class=\"text-bcb-dark\">Resolução CMN N° 5.317 de 25/06/2026</strong> é dividido em etapas claras, exigindo atenção das instituições para garantir a conformidade:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">1º de janeiro de 2028</strong>: Esta é a data de entrada em vigor da Resolução. A partir deste dia, todas as instituições financeiras e demais entidades autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong>, abrangidas pela norma, deverão estar em <strong class=\"text-bcb-dark\">compliance</strong> com as novas regras de elaboração e remessa de documentos contábeis, conforme as alterações na <strong class=\"text-bcb-dark\">Resolução CMN nº 4.911/2021</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Até junho de 2028 (data-base)</strong>: Para os documentos contábeis com data-base até <strong class=\"text-bcb-dark\">junho de 2028</strong>, as cooperativas de crédito integrantes de sistemas cooperativos deverão observar o disposto no <strong class=\"text-bcb-dark\">Art. 2º-B</strong> da <strong class=\"text-bcb-dark\">Resolução CMN nº 4.911/2021</strong>. Isso significa que, para esses documentos, a remessa ainda deverá ser feita diretamente ao <strong class=\"text-bcb-dark\">Banco Central do Brasil</strong>.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">1º de julho de 2028</strong>: A partir desta data, a regra de remessa para as cooperativas de crédito integrantes de sistemas cooperativos (<strong class=\"text-bcb-dark\">Art. 2º-A, inciso II</strong>) produzirá seus efeitos. Assim, as cooperativas de crédito que fazem parte de sistemas de três ou dois níveis deverão remeter seus documentos contábeis para a confederação de crédito, banco cooperativo, ou cooperativa central a que pertencem, e não mais diretamente ao <strong class=\"text-bcb-dark\">BCB</strong> para documentos com data-base a partir de <strong class=\"text-bcb-dark\">julho de 2028</strong>.</li>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.317</strong> gerará trabalho e custo significativos para as instituições financeiras e demais entidades reguladas, exigindo uma revisão profunda de processos e sistemas. Operacionalmente, as instituições deverão:</p><p class=\"mb-4 text-justify\">1.  <strong class=\"text-bcb-dark\">Revisar Processos Internos de Geração e Remessa</strong>: É fundamental remapear os fluxos de trabalho para a elaboração do <strong class=\"text-bcb-dark\">Balancete Patrimonial Analítico</strong> para dependências/participações no exterior e para a remessa de todos os documentos contábeis, garantindo que o destino (líder de conglomerado, confederação de crédito, ou <strong class=\"text-bcb-dark\">BCB</strong>) esteja correto conforme a nova regulamentação.</p><p class=\"mb-4 text-justify\">2.  <strong class=\"text-bcb-dark\">Adaptar Sistemas de Informação</strong>: Os sistemas de contabilidade e de reporte regulatório precisarão ser ajustados para incorporar as novas lógicas de roteamento e consolidação de dados. Isso pode envolver o desenvolvimento de novas funcionalidades para agregar informações de entidades estrangeiras e para direcionar os relatórios aos destinatários corretos, com impacto em custos de TI e alocação de equipes de desenvolvimento.</p><p class=\"mb-4 text-justify\">3.  <strong class=\"text-bcb-dark\">Treinamento de Equipes</strong>: As equipes responsáveis pela contabilidade, compliance e TI precisarão ser treinadas nas novas diretrizes e fluxos operacionais para garantir a correta aplicação da norma e evitar falhas de reporte.</p><p class=\"mb-4 text-justify\">4.  <strong class=\"text-bcb-dark\">Revisão de Controles Internos</strong>: Será necessário fortalecer os controles internos para garantir a integridade, a acurácia e a tempestividade dos dados contábeis, especialmente na fase de transição e na segregação das responsabilidades de remessa. A não conformidade pode gerar penalidades regulatórias.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.317</strong>, ao alterar a <strong class=\"text-bcb-dark\">Resolução CMN nº 4.911/2021</strong>, introduz mudanças significativas nos processos de elaboração e remessa de documentos contábeis, o que implica em alterações técnicas diretas nos sistemas das instituições.</p><p class=\"mb-4 text-justify\">Embora a norma não mencione explicitamente <strong class=\"text-bcb-dark\">CADOCs</strong> específicos, as referências a \"documentos contábeis\" e \"Balancete Patrimonial Analítico\" indicam impactos diretos em relatórios como o <strong class=\"text-bcb-dark\">CADOC 2010 (Balancete Patrimonial Analítico)</strong> e outros <strong class=\"text-bcb-dark\">CADOCs</strong> relacionados à contabilidade individual e consolidada das instituições. As instituições com dependências no exterior ou participações em entidades no exterior integrantes do conglomerado prudencial deverão elaborar mensalmente o <strong class=\"text-bcb-dark\">Balancete Patrimonial Analítico</strong> dessas entidades, o que pode requerer adaptações nos fluxos de dados e no layout de reporte para capturar e consolidar essas informações.</p><p class=\"mb-4 text-justify\">As principais mudanças técnicas residem na lógica de remessa: sistemas deverão ser adaptados para direcionar os relatórios para a instituição líder do conglomerado prudencial, confederações/bancos cooperativos (para sistemas cooperativos), ou diretamente ao <strong class=\"text-bcb-dark\">BCB</strong>, conforme a classificação da instituição. Isso pode exigir ajustes nas tabelas de domínios para identificação do destinatário correto, no dicionário de dados para novas flags de categorização ou nos próprios protocolos de transmissão. É crucial que as equipes técnicas monitorem as atualizações dos manuais de <strong class=\"text-bcb-dark\">CADOC</strong> e os comunicados técnicos do <strong class=\"text-bcb-dark\">BCB</strong>, que detalharão as especificações exatas de layout, campos e formatos (como <strong class=\"text-bcb-dark\">XML</strong>, por exemplo) que serão impactados por estas novas regras de reporte e roteamento de informações.</p>\n      </div>","title":"BC - Resolução CMN N° 5.317 de 25/06/2026","type":"Resolução","summary":"A Resolução CMN N° 5.317 de 25/06/2026 é uma atualização fundamental para aprimorar a governança e o fluxo de dados contábeis no sistema financeiro. Ela redefine as responsabilidades de elaboração e remessa de documentos, especialmente para instituições que integram conglomerados prudenciais e sistemas cooperativos. A atenção aos prazos de entrada em vigor, como 1º de janeiro de 2028 e 1º de julho de 2028, é crucial para garantir a conformidade.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5317","isFeatured":false,"tags":[],"date":"2026-06-25","number":"CMN N° 5.317","updated_at":"2026-06-25T23:43:22.406Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52950.pdf"},"normativos_52951":{"id":"normativos_52951","slug":"resolucao-cmn-5318","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN nº 5.318, de 25 de junho de 2026</strong>, emitida pelo <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong> por deliberação do <strong class=\"text-bcb-dark\">Conselho Monetário Nacional (CMN)</strong>, estabelece importantes restrições operacionais para um segmento específico do sistema financeiro. Esta norma altera a <strong class=\"text-bcb-dark\">Resolução CMN nº 5.060, de 16 de fevereiro de 2023</strong>, com o objetivo principal de aprimorar a estrutura regulatória para bancos comerciais que possuem controle societário por bolsas de valores, de mercadorias e futuros, ou por ambos. A medida visa fortalecer a segregação de funções e mitigar potenciais conflitos de interesse dentro do ecossistema financeiro.</p><p class=\"mb-4 text-justify\">A principal alteração introduzida pela <strong class=\"text-bcb-dark\">Resolução CMN nº 5.318/2026</strong> consiste em vetar expressamente uma série de atividades para esses bancos comerciais. Entre as vedações, destacam-se a captação de recursos via depósitos a prazo e emissão de letras, a concessão de operações de crédito e outras operações com característica de concessão de crédito, avais, fianças e garantias de qualquer natureza. Contudo, é importante ressaltar que a proibição de concessão de crédito não se aplica a operações compromissadas e empréstimos de ativos financeiros, desde que não envolvam a própria contraparte ou entidades de seu grupo econômico.</p><p class=\"mb-4 text-justify\">Adicionalmente, a norma impede a intermediação da colocação de valores mobiliários e a manutenção de posição própria em valores mobiliários, com exceção de emissões próprias ou daquelas que servem de lastro para emissões de <strong class=\"text-bcb-dark\">Brazilian Depositary Receipt (BDR)</strong>, tanto patrocinados quanto não patrocinados, conforme a regulamentação da <strong class=\"text-bcb-dark\">Comissão de Valores Mobiliários (CVM)</strong>. Esta adequação normativa é fundamental para as instituições afetadas, exigindo uma revisão profunda de suas estratégias de negócios e modelos operacionais para garantir a plena conformidade com as novas diretrizes a partir da data de sua entrada em vigor.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é <strong class=\"text-bcb-dark\">MÉDIO</strong> devido à especificidade do público-alvo – bancos comerciais controlados por bolsas –, limitando o número de instituições diretamente afetadas. No entanto, a natureza das restrições, que buscam segregar atividades bancárias tradicionais de infraestruturas de mercado, tem um impacto qualitativo <strong class=\"text-bcb-dark\">ALTO</strong> na mitigação de riscos sistêmicos e conflitos de interesse, garantindo maior estabilidade e integridade para o mercado financeiro como um todo.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução CMN Nº 5.318, de 25 de junho de 2026</strong></p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Altera a <strong class=\"text-bcb-dark\">Resolução CMN nº 5.060, de 16 de fevereiro de 2023</strong>.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória reside na necessidade de fortalecer a segregação entre as atividades bancárias tradicionais e a operação de infraestruturas de mercado, como bolsas de valores e de mercadorias e futuros. A medida visa prevenir potenciais conflitos de interesse, reduzir a concentração de riscos e garantir a estabilidade e a integridade do sistema financeiro. Ao limitar a atuação de bancos controlados por bolsas em áreas como captação de depósitos, concessão de crédito e posição própria em valores mobiliários, o <strong class=\"text-bcb-dark\">CMN</strong> e o <strong class=\"text-bcb-dark\">BCB</strong> buscam evitar que eventuais falhas ou riscos de uma atividade contaminem a outra, protegendo depositantes e o mercado de capitais.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5318\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução CMN N° 5.318 de 25/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN nº 5.318, de 25 de junho de 2026</strong>, estabelece um cronograma direto e de efeito imediato para as instituições financeiras impactadas. O <strong class=\"text-bcb-dark\">Art. 2º</strong> da norma define que esta Resolução <strong class=\"text-bcb-dark\">entra em vigor em 1º de julho de 2026</strong>. Isso significa que, a partir desta data, os bancos comerciais sob controle societário de bolsas de valores, de mercadorias e futuros, ou de ambos, deverão estar plenamente adequados às novas vedações e restrições impostas, não havendo período de transição posterior à entrada em vigor. As instituições devem ter concluído todas as revisões de processos e adequações operacionais e de negócios até o dia <strong class=\"text-bcb-dark\">30 de junho de 2026</strong> para estarem em conformidade no dia subsequente.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A implementação da <strong class=\"text-bcb-dark\">Resolução CMN nº 5.318/2026</strong> gerará trabalho e custos significativos para os bancos comerciais controlados por bolsas. Operacionalmente, as instituições deverão <strong class=\"text-bcb-dark\">revisar</strong> e, em muitos casos, <strong class=\"text-bcb-dark\">reestruturar</strong> seus portfólios de produtos e serviços. Isso implica na <strong class=\"text-bcb-dark\">cessação</strong> da captação de depósitos a prazo e emissão de letras, demandando um plano de gestão para os passivos existentes. A área de crédito precisará <strong class=\"text-bcb-dark\">revisar</strong> e <strong class=\"text-bcb-dark\">adaptar</strong> suas políticas para cessar novas concessões de crédito, avais e fianças, exceto para as operações explicitamente permitidas, como compromissadas e empréstimo de ativos financeiros.</p><p class=\"mb-4 text-justify\">A gestão de ativos também será afetada, com a necessidade de <strong class=\"text-bcb-dark\">ajustar</strong> a estratégia de manutenção de posição própria em valores mobiliários, exceto para as exceções de BDRs e emissões próprias. Processos internos de <strong class=\"text-bcb-dark\">compliance</strong>, <strong class=\"text-bcb-dark\">controles internos</strong> e <strong class=\"text-bcb-dark\">gestão de riscos</strong> precisarão ser <strong class=\"text-bcb-dark\">atualizados</strong> para incorporar as novas vedações e garantir o monitoramento contínuo. Pode haver custos com <strong class=\"text-bcb-dark\">consultoria jurídica</strong> para interpretação e adaptação, <strong class=\"text-bcb-dark\">treinamento</strong> de equipes, e possíveis <strong class=\"text-bcb-dark\">ajustes em sistemas</strong> para refletir as novas restrições de operações e emissões.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN nº 5.318, de 25 de junho de 2026</strong>, trata de mudanças em nível de política e governança regulatória, impondo vedações específicas a determinadas instituições. O conteúdo da norma analisada não especifica alterações diretas em <strong class=\"text-bcb-dark\">CADOCs</strong>, tabelas de domínios, dicionários de dados, <strong class=\"text-bcb-dark\">tags XML</strong> ou protocolos de transmissão de dados. Portanto, não há um impacto técnico direto em layout de sistemas ou arquivos regulatórios a ser detalhado a partir desta norma em si. Qualquer necessidade de adaptação de sistemas seria uma consequência indireta da adequação operacional às novas restrições de negócios.</p>\n      </div>","title":"BC - Resolução CMN N° 5.318 de 25/06/2026","type":"Resolução","summary":"Esta Resolução CMN nº 5.318/2026 é crucial para bancos comerciais controlados por bolsas. Ela reforça a segregação de atividades, impedindo a captação de depósitos a prazo, concessão de crédito amplo e manutenção de posição própria em valores mobiliários. Fique atento ao prazo de entrada em vigor em 1º de julho de 2026 para garantir a conformidade e evitar não conformidade.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5318","isFeatured":false,"tags":[],"date":"2026-06-25","number":"CMN N° 5.318","updated_at":"2026-06-25T23:43:22.406Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52951.pdf"},"normativos_52952":{"id":"normativos_52952","slug":"resolucao-cmn-5319","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN nº 5.319, de 25 de junho de 2026</strong>, editada pelo <strong class=\"text-bcb-dark\">Conselho Monetário Nacional (CMN)</strong>, representa uma alteração pontual, porém significativa, na <strong class=\"text-bcb-dark\">Resolução CMN nº 5.304, de 20 de maio de 2026</strong>. Seu principal objetivo é clarificar e reforçar as regras relativas à cobrança de encargos e comissões nas operações de crédito realizadas pelo <strong class=\"text-bcb-dark\">Banco Nacional de Desenvolvimento Econômico e Social (BNDES)</strong> e pelas instituições financeiras por ele habilitadas, garantindo maior transparência e proteção aos mutuários. Embora o escopo direto seja sobre o <strong class=\"text-bcb-dark\">BNDES</strong> e seus parceiros, a norma reitera um conceito de 'tarifa de cadastro' que é universal no sistema financeiro, com base na <strong class=\"text-bcb-dark\">Resolução nº 3.919/2010</strong>, impactando indiretamente as práticas de todas as instituições.</p><p class=\"mb-4 text-justify\">O cerne da alteração reside no Art. 7º da norma anterior. A nova redação permite expressamente que o <strong class=\"text-bcb-dark\">BNDES</strong> e as instituições financeiras habilitadas cobrem, além dos encargos financeiros já previstos, outros encargos ou comissões que sejam \"usualmente praticadas em suas operações\", em conformidade com suas políticas operacionais. Isso inclui a possibilidade de cobrança de encargo por reserva de crédito, desde que previsto contratualmente e com valores devidamente divulgados em suas páginas oficiais na internet. Essa flexibilidade visa acomodar a diversidade de produtos e serviços oferecidos.</p><p class=\"mb-4 text-justify\">Contudo, a principal diretriz de compliance é a <strong class=\"text-bcb-dark\">vedação expressa</strong>, \"em qualquer hipótese\", da cobrança de \"tarifa de cadastro\". A norma faz questão de definir este termo, remetendo à Tabela I anexa à <strong class=\"text-bcb-dark\">Resolução nº 3.919, de 25 de novembro de 2010</strong>, como sendo aquela referente à \"realização de pesquisa em serviços de proteção ao crédito, base de dados e informações cadastrais e ao tratamento de dados necessários ao início de relacionamento decorrente da contratação de operação de crédito\". Esta clareza na vedação e na definição exige uma revisão meticulosa das práticas de cobrança e contratos em todo o ecossistema financeiro para operações de crédito, especialmente aquelas vinculadas ou assemelhadas ao perfil de atuação do <strong class=\"text-bcb-dark\">BNDES</strong>.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">MÉDIO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O impacto é <strong class=\"text-bcb-dark\">MÉDIO</strong> pois, embora a alteração seja específica para operações do <strong class=\"text-bcb-dark\">BNDES</strong> e instituições habilitadas, ela reforça e clarifica a proibição de um tipo de tarifa comum no mercado (tarifa de cadastro), exigindo atenção e potencial revisão de processos e contratos para todas as instituições financeiras que operam com crédito, a fim de garantir alinhamento com a definição explícita do que é vedado.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução CMN N° 5.319, de 25 de junho de 2026</strong></p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Esta resolução altera o Art. 1º da <strong class=\"text-bcb-dark\">Resolução CMN nº 5.304, de 20 de maio de 2026</strong>. Adicionalmente, faz referência à <strong class=\"text-bcb-dark\">Resolução nº 3.919, de 25 de novembro de 2010</strong>, para a definição de 'tarifa de cadastro'.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória por trás desta norma é a busca por maior transparência e equidade nas relações de consumo financeiras, especialmente em operações de crédito. Ao clarificar quais encargos podem ser cobrados e, mais importante, ao reiterar e detalhar a proibição da 'tarifa de cadastro', o <strong class=\"text-bcb-dark\">CMN</strong> visa coibir práticas que possam gerar custos indevidos ou abusivos aos mutuários. Esta medida contribui para a estabilidade e a credibilidade do sistema financeiro, alinhando as práticas de mercado com as diretrizes de proteção ao consumidor e com a estrutura prudencial já estabelecida pelo <strong class=\"text-bcb-dark\">BCB</strong>.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5319\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução CMN N° 5.319 de 25/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">Conforme o <strong class=\"text-bcb-dark\">Art. 2º</strong> da <strong class=\"text-bcb-dark\">Resolução CMN nº 5.319/2026</strong>, esta norma <strong class=\"text-bcb-dark\">entra em vigor na data de sua publicação</strong>. Isso significa que as instituições financeiras, em particular o <strong class=\"text-bcb-dark\">BNDES</strong> e aquelas por ele habilitadas, devem estar em conformidade com as novas disposições imediatamente a partir de <strong class=\"text-bcb-dark\">25 de junho de 2026</strong>. Não há prazo de adequação ou carência; a conformidade é exigível de forma retroativa à data de publicação para todas as operações futuras e revisões de contratos.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A implementação desta <strong class=\"text-bcb-dark\">Resolução</strong> gera impactos operacionais importantes para as instituições financeiras, principalmente para o <strong class=\"text-bcb-dark\">BNDES</strong> e seus parceiros. Primeiramente, exige a <strong class=\"text-bcb-dark\">revisão e atualização</strong> imediata das políticas de cobrança e das tabelas de tarifas e encargos, assegurando que a \"tarifa de cadastro\", conforme a definição detalhada, seja expressamente vedada em todas as operações de crédito. Em segundo lugar, os departamentos jurídico e de compliance deverão <strong class=\"text-bcb-dark\">revisar todos os modelos de contratos</strong> de crédito para remover qualquer menção ou possibilidade de cobrança dessa tarifa, bem como garantir que outros encargos sejam claramente especificados e divulgados conforme as exigências da norma.</p><p class=\"mb-4 text-justify\">Além disso, sistemas de faturamento e de gestão de crédito precisarão ser <strong class=\"text-bcb-dark\">auditados e, se necessário, ajustados</strong> para bloquear a cobrança da \"tarifa de cadastro\". Equipes comerciais e de atendimento precisarão de <strong class=\"text-bcb-dark\">treinamento urgente</strong> para entender as novas diretrizes e comunicá-las corretamente aos clientes, evitando práticas não conformes. O custo operacional pode incluir despesas com consultoria jurídica, ajustes em sistemas legados e programas de treinamento, além de possíveis revisões de processos de originação de crédito.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN nº 5.319/2026</strong> não especifica alterações diretas em layouts de documentos regulatórios (<strong class=\"text-bcb-dark\">CADOCs</strong>), tabelas de domínios, dicionários de dados, tags <strong class=\"text-bcb-dark\">XML</strong> ou protocolos de transmissão. Sua natureza é de cunho normativo-regulatória, focando nas práticas de cobrança. As instituições devem, no entanto, revisar seus sistemas internos de cobrança e gestão de contratos para garantir a adequação à vedação da 'tarifa de cadastro' e à correta divulgação dos demais encargos, conforme exigido pelas políticas operacionais e divulgação em canais oficiais.</p>\n      </div>","title":"BC - Resolução CMN N° 5.319 de 25/06/2026","type":"Resolução","summary":"A Resolução CMN nº 5.319/2026 é uma atualização crítica da Resolução CMN nº 5.304/2026. Ela reforça a permissão para cobrança de encargos e comissões usuais por parte do BNDES e instituições habilitadas, mas reitera a vedação explícita à 'tarifa de cadastro', conforme a definição da Resolução nº 3.919/2010. É essencial revisar as políticas de cobrança para garantir a conformidade imediata.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5319","tags":[],"date":"2026-06-25","number":"CMN N° 5.319","updated_at":"2026-06-25T23:43:22.406Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52952.pdf","isFeatured":false},"normativos_52953":{"id":"normativos_52953","slug":"resolucao-cmn-5320","fullContent":"\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-file-invoice text-bcb-gold\"></i> Sumário Executivo\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.320, de 25 de junho de 2026</strong>, é uma medida regulatória do <strong class=\"text-bcb-dark\">Banco Central do Brasil (BCB)</strong> de suma importância para o combate à exploração ilegal de loterias de apostas de quota fixa no país. Esta norma define as diretrizes e responsabilidades das instituições financeiras e de pagamento integrantes do <strong class=\"text-bcb-dark\">Sistema de Pagamentos Brasileiro (SPB)</strong> na implementação de bloqueios de contas e impedimento de transações financeiras de pessoas naturais e jurídicas que operam sem a devida autorização legal, em alinhamento com a legislação federal vigente, especialmente o <strong class=\"text-bcb-dark\">Decreto nº 13.033/2026</strong> e a <strong class=\"text-bcb-dark\">Lei nº 14.790/2023</strong>.</p>\n        \n      <div class=\"bg-amber-50 border border-amber-200 rounded-lg p-4 mt-4 flex items-start gap-4\">\n        <div class=\"w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-amber-600 flex-shrink-0\">\n          <i class=\"fa-solid fa-gauge-high text-lg\"></i>\n        </div>\n        <div>\n          <p class=\"text-amber-900 font-bold text-base\">Impacto Sistêmico</p>\n          <p class=\"text-amber-700 font-bold text-sm uppercase\">ALTO</p>\n          <p class=\"text-amber-800 text-sm mt-1 italic\">O nível de impacto é <strong class=\"text-bcb-dark\">ALTO</strong> devido à exigência de <strong class=\"text-bcb-dark\">prazos extremamente curtos</strong> (24 a 48 horas) para implementação de bloqueios, rejeição de transações e comunicação, que demandam <strong class=\"text-bcb-dark\">revisão e adaptação urgentes</strong> de processos, sistemas e controles internos. A necessidade de identificar e interceptar transações destinadas, direta ou indiretamente, à exploração irregular de apostas de quota fixa impõe desafios significativos de <strong class=\"text-bcb-dark\">detecção de fraudes</strong> e <strong class=\"text-bcb-dark\">monitoramento transacional</strong> a todas as instituições autorizadas a funcionar pelo <strong class=\"text-bcb-dark\">BCB</strong>, independentemente de seu porte ou segmento.</p>\n        </div>\n      </div>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gavel text-bcb-gold\"></i> Base Normativa\n        </h4>\n        <p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Norma:</strong> <strong class=\"text-bcb-dark\">Resolução CMN N° 5.320, de 25 de junho de 2026</strong></p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Alterações:</strong> Esta Resolução não altera ou revoga diretamente outras normas do <strong class=\"text-bcb-dark\">BCB</strong>. Em vez disso, ela é editada com base na <strong class=\"text-bcb-dark\">Lei nº 4.595, de 31 de dezembro de 1964</strong>, e implementa as disposições do <strong class=\"text-bcb-dark\">Decreto nº 13.033, de 19 de junho de 2026</strong>, e do <strong class=\"text-bcb-dark\">art. 21-A da Lei nº 14.790, de 29 de dezembro de 2023</strong>, que tratam da exploração de apostas de quota fixa. Ela estabelece o procedimento operacional para o cumprimento dessas novas bases legais no âmbito do sistema financeiro.</p><p class=\"mb-4 text-justify\"><strong class=\"text-bcb-dark\">Motivação:</strong> A motivação regulatória reside na necessidade de fortalecer a supervisão e o combate à ilegalidade no mercado de apostas, coibindo a atuação de operadores não autorizados. No cenário macroeconômico e prudencial, esta medida visa proteger os consumidores, combater a lavagem de dinheiro e a evasão fiscal, e assegurar a integridade e a credibilidade do <strong class=\"text-bcb-dark\">Sistema Financeiro Nacional</strong>. A norma garante que as instituições financeiras atuem como linha de defesa contra fluxos de recursos ilícitos associados à exploração de jogos de azar irregulares, em alinhamento com a legislação recém-promulgada.</p>\n        <a href=\"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5320\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-center justify-between group hover:bg-blue-100 transition-all duration-300\">\n          <div class=\"flex items-center gap-3\">\n            <div class=\"w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 group-hover:bg-blue-200 transition-colors\">\n              <i class=\"fa-solid fa-building-columns text-lg\"></i>\n            </div>\n            <div>\n              <p class=\"text-blue-900 font-bold text-sm\">Acessar Regulamentação Original</p>\n              <p class=\"text-blue-700 text-xs\">BC - Resolução CMN N° 5.320 de 25/06/2026</p>\n            </div>\n          </div>\n          <i class=\"fa-solid fa-arrow-up-right-from-square text-blue-400 group-hover:text-blue-600 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-all\"></i>\n        </a>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-calendar-days text-bcb-gold\"></i> Adequação\n        </h4>\n        <p class=\"mb-4 text-justify\">O cronograma para adequação à <strong class=\"text-bcb-dark\">Resolução CMN N° 5.320/2026</strong> é imediato e exige ações rápidas por parte das instituições:</p><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Entrada em vigor:</strong> A Resolução entra em vigor em <strong class=\"text-bcb-dark\">28 de agosto de 2026</strong>, exigindo que todas as instituições financeiras e de pagamento estejam aptas a cumprir suas determinações a partir dessa data.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Bloqueio de Contas:</strong> Em até <strong class=\"text-bcb-dark\">24 horas</strong> após o recebimento da notificação de bloqueio da Secretaria de Prêmios e Apostas, as instituições devem efetuar o bloqueio de todas as contas especificadas (depósito à vista, poupança, pré-paga e registro) e rejeitar movimentações financeiras com recursos delas.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Rejeição de Transações:</strong> Em até <strong class=\"text-bcb-dark\">24 horas</strong> após a notificação, as instituições e instituidores de arranjos de pagamento devem rejeitar transações de pagamento destinadas às contas bloqueadas e implementar procedimentos para impedir novas transações que visem viabilizar a exploração irregular de apostas.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Comunicação às Autoridades:</strong> Em até <strong class=\"text-bcb-dark\">48 horas</strong> após a notificação, as instituições e instituidores de arranjos de pagamento devem comunicar à Secretaria de Prêmios e Apostas as providências adotadas.</li><li class=\"text-justify\"><strong class=\"text-bcb-dark\">Desbloqueio e Encerramento:</strong> Os processos de desbloqueio ocorrem mediante decisão administrativa definitiva favorável ou conversão de valores em depósito judicial. O encerramento de contas deve ser feito na hipótese de decisão judicial que confirme o perdimento dos valores.</li>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-gears text-bcb-gold\"></i> Impacto Operacional\n        </h4>\n        <p class=\"mb-4 text-justify\">A norma impõe um significativo <strong class=\"text-bcb-dark\">impacto operacional</strong> e de <strong class=\"text-bcb-dark\">custo</strong> às instituições. Exige a revisão completa de processos de onboarding, monitoramento de clientes e transações, gestão de contas e comunicação. Novos procedimentos deverão ser estabelecidos para: (i) Integração com sistemas de notificação governamentais; (ii) Criação de fluxos de trabalho para processar bloqueios e rejeições em prazos exíguos (24/48 horas); (iii) Adaptação de sistemas de <strong class=\"text-bcb-dark\">Prevenção à Lavagem de Dinheiro (PLD)</strong> e <strong class=\"text-bcb-dark\">Prevenção à Fraude</strong> para identificar padrões associados à exploração irregular de apostas de quota fixa; (iv) Treinamento de equipes de atendimento, compliance, jurídica e tecnologia para lidar com as novas demandas e comunicações aos clientes; (v) Gerenciamento do ciclo de vida das contas bloqueadas, incluindo processos de desbloqueio e eventual encerramento; (vi) Ajustes em mecanismos de comunicação ao cliente para informar sobre bloqueios e fundamentos legais; (vii) Aumento do volume de comunicação e coordenação com a Secretaria de Prêmios e Apostas. Isso gerará a necessidade de investimento em tecnologia, pessoal e consultoria especializada em <strong class=\"text-bcb-dark\">RegTech</strong> e <strong class=\"text-bcb-dark\">Compliance</strong>.</p>\n      </div>\n\n      <div class=\"bg-white border border-slate-200 rounded-lg p-6 mb-6 shadow-sm\">\n        <h4 class=\"font-bold text-lg text-bcb-dark border-b-2 border-bcb-gold pb-2 mb-4 flex items-center gap-2\">\n          <i class=\"fa-solid fa-code text-bcb-gold\"></i> Alterações de Layout\n        </h4>\n        <p class=\"mb-4 text-justify\">A <strong class=\"text-bcb-dark\">Resolução CMN N° 5.320/2026</strong> não especifica alterações em documentos regulatórios como <strong class=\"text-bcb-dark\">CADOCs</strong>, tabelas de domínios, dicionários de dados, tags XML ou protocolos de transmissão de informações. No entanto, ela <strong class=\"text-bcb-dark\">demanda profundas alterações e desenvolvimentos sistêmicos</strong> nas instituições. Isso inclui a implementação de novas funcionalidades para: (i) Recebimento e processamento de notificações de bloqueio da Secretaria de Prêmios e Apostas do Ministério da Fazenda; (ii) Bloqueio imediato (em até <strong class=\"text-bcb-dark\">24 horas</strong>) de contas (depósitos à vista, poupança, pré-pagas, registro) de titularidade dos agentes irregulares; (iii) Rejeição automatizada de movimentações financeiras e transações de pagamento (inclusive de arranjos) com recursos ou para as contas bloqueadas; (iv) Implementação de lógicas de <strong class=\"text-bcb-dark\">detecção e impedimento</strong> de novas transações que viabilizem a exploração irregular; (v) Geração e envio de comunicação aos titulares das contas bloqueadas, incluindo cópias do auto de constatação e notificação; e (vi) Comunicação das providências adotadas à Secretaria de Prêmios e Apostas em até <strong class=\"text-bcb-dark\">48 horas</strong>. Essas funcionalidades exigirão integrações com sistemas externos e internos, além de possíveis aprimoramentos em ferramentas de <strong class=\"text-bcb-dark\">monitoramento transacional</strong> e <strong class=\"text-bcb-dark\">prevenção à fraude</strong>.</p>\n      </div>","title":"BC - Resolução CMN N° 5.320 de 25/06/2026","type":"Resolução","summary":"A Resolução CMN N° 5.320/2026 estabelece um novo e rigoroso arcabouço para o combate à operação irregular de apostas de quota fixa. Instituições financeiras devem se preparar para o bloqueio ágil de contas e a rejeição de transações de pessoas e empresas não autorizadas, seguindo notificações da Secretaria de Prêmios e Apostas do Ministério da Fazenda. A conformidade é crucial para evitar as penalidades da Lei nº 14.790/2023 e mitigar riscos de reputação e operacionais.","url":"https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5320","tags":[],"date":"2026-06-25","number":"CMN N° 5.320","updated_at":"2026-06-25T23:43:22.406Z","thumb_v":"v4","SlideGCS":"https://storage.googleapis.com/cadoc-ai-storage-private/slides/slides_normativos_52953.pdf","isFeatured":false}},"homePosts":null,"homeStats":null,"recentDestaques":[{"slug":"edicao-26-26","label":"22 a 26 | Junho 2026"},{"slug":"edicao-25-26","label":"15 a 19 | Junho 2026"},{"slug":"edicao-24-26","label":"8 a 12 | Junho 2026"},{"slug":"edicao-23-26","label":"1 a 5 | Junho 2026"}],"recentDias":null,"recentMeses":null,"pixPosts":null,"spsavPosts":null,"riscosPosts":null,"openFinancePosts":null,"pixSummary":null,"spsavSummary":null,"slidesFilters":null,"path":"/destaques","blogVersion":"v9"}</script>
